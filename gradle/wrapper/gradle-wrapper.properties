distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.1-bin.zip
# This wrapper jar only knows validateDistributionUrl / networkTimeout / distributionSha256Sum: retries
# and retryBackOffMs are absent from its class constant pool and Gradle ignores unknown wrapper
# properties silently, so those two lines never did anything while the one key that actually verifies
# the download was missing. The value below is the official SHA-256 of gradle-9.5.1-bin.zip; a bump of
# distributionUrl has to update it in the same commit or the wrapper stops on a checksum mismatch.
distributionSha256Sum=bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
