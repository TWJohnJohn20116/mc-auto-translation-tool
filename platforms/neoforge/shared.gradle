// Shared NeoForge wiring.
//
// A version module declares its coordinates and applies this script; every source
// directory, resource layer and compile target lives here. Adding a Minecraft version
// therefore never means copying Java files again — it means adding one entrypoint
// layer only when the loader API actually changed.
//
// NeoForge runs on Mojmap, so it reuses the Forge source trees unchanged. The shared
// layer here holds only what is genuinely NeoForge-specific:
//   entrypoints/<layer>/  the two @Mod / client classes
//   metadata/<layer>/     universal-translator.neoforge.mixins.json
// Everything else (common API, version families, lang assets, pack.mcmeta) is read
// from the matching platforms/forge tree, so there is exactly one copy in the repo.
//
// Required coordinates:
//   neoforgeMinecraftVersion  "1.21.7"      -> archivesName suffix
//   neoforgeVersion           project.<prop> -> NeoForge artifact version
//   neoforgeJavaRelease       17 | 21 | 25
//   neoforgeEntryLayer        "1.21.2-1.21.8"
//   neoforgeMetadataLayer     "1.21"
//   neoforgeForgeSharedRoot   "platforms/forge/1.21/shared"
//   neoforgeForgeLayers       ["common", "1.21-1.21.5"]
// Optional:
//   neoforgeForgeExtraRoots   ["platforms/forge/modern/1.20.1"]
//   neoforgePackFormat        integer, expands ${packFormat} in pack.mcmeta
//   neoforgeResourcePackFormat integer, expands ${resourcePackFormat} in pack.mcmeta

def requiredCoordinates = [
        "neoforgeMinecraftVersion",
        "neoforgeVersion",
        "neoforgeJavaRelease",
        "neoforgeEntryLayer",
        "neoforgeMetadataLayer",
        "neoforgeForgeSharedRoot",
        "neoforgeForgeLayers"
]
requiredCoordinates.each { coordinate ->
    if (!project.ext.has(coordinate)) {
        throw new GradleException(
                "Missing ${coordinate} before applying platforms/neoforge/shared.gradle")
    }
}

def sharedRoot = rootProject.file("platforms/neoforge/shared")
def entryLayer = new File(sharedRoot, "entrypoints/${project.ext.neoforgeEntryLayer}")
if (!new File(entryLayer, "src/main/java").isDirectory()) {
    // A directory without src/main/java contributes no @Mod class, and a srcDir that does not exist is
    // ignored in silence: the jar then ships no entrypoint at all and the loader reports "no mod
    // entrypoint" for a module whose build was green.
    throw new GradleException(
            "NeoForge entry layer '${project.ext.neoforgeEntryLayer}' has no src/main/java under ${sharedRoot}")
}

// Which entrypoint layers compile the shared client body (entrypoints/common), and the per-layer
// directories that hold it. Every registered layer must appear here even when the list is empty:
// a layer missing from the map used to mean it had to re-implement the shared client on its own,
// with nothing pointing that out.
def entryLayerSharedDirs = [
        "1.20.2-1.20.4" : [],
        "1.20.6"        : ["entrypoints/common"],
        "1.21-1.21.1"   : ["entrypoints/common"],
        "1.21.2-1.21.8" : [],
        "1.21.9-1.21.11": [],
        "26.1-26.1.2"   : [],
        "26.2"          : []
]
if (!entryLayerSharedDirs.containsKey(project.ext.neoforgeEntryLayer)) {
    throw new GradleException(
            "NeoForge entry layer '${project.ext.neoforgeEntryLayer}' is not listed in " +
                    "entryLayerSharedDirs of platforms/neoforge/shared.gradle")
}
def entryLayerShared = entryLayerSharedDirs[project.ext.neoforgeEntryLayer].collect {
    new File(sharedRoot, it)
}
def missingEntryShares = entryLayerShared.findAll { !new File(it, "src/main/java").isDirectory() }
if (!missingEntryShares.isEmpty()) {
    throw new GradleException(
            "Missing shared NeoForge entrypoint directories: " +
                    missingEntryShares.collect { it.name }.join(", "))
}

def metadataLayer = new File(sharedRoot, "metadata/${project.ext.neoforgeMetadataLayer}")
if (!new File(metadataLayer, "src/main/resources/universal-translator.neoforge.mixins.json").isFile()) {
    // processResources copies this directory with from(), which is silent when the file is absent, so
    // the 19 toml files kept pointing at a MixinConfigs entry that no jar contained.
    throw new GradleException(
            "NeoForge metadata layer '${project.ext.neoforgeMetadataLayer}' does not ship " +
                    "universal-translator.neoforge.mixins.json under ${sharedRoot}")
}

def forgeSharedRoot = rootProject.file(project.ext.neoforgeForgeSharedRoot)
if (!forgeSharedRoot.isDirectory()) {
    throw new GradleException(
            "Unknown Forge shared root '${project.ext.neoforgeForgeSharedRoot}'")
}
def forgeLayers = project.ext.neoforgeForgeLayers.collect { rootProject.file("${project.ext.neoforgeForgeSharedRoot}/${it}") }
def missingLayers = forgeLayers.findAll { !it.isDirectory() }
if (!missingLayers.isEmpty()) {
    throw new GradleException(
            "Missing Forge source layers under ${project.ext.neoforgeForgeSharedRoot}: " +
                    missingLayers.collect { it.name }.join(", "))
}
def forgeExtraRoots = project.ext.has("neoforgeForgeExtraRoots")
        ? project.ext.neoforgeForgeExtraRoots.collect { rootProject.file(it) }
        : []

// The Forge settings screens cover 1.18.2 through 1.21.11 and live outside both trees, so every
// NeoForge module on the 1.20/1.21 trees compiles them alongside its own Forge layers.
//
// The 26.x tree is the exception: it carries its own three screens under forge/26.x/shared/api, and
// Minecraft 26.x moved setScreen off Minecraft (Minecraft#gui), so the 1.18.2-1.21.11 copy cannot
// compile there. Pulling it in produced "cannot find symbol: setScreen" and a ConfigScreenBase that
// does not convert to the 26.x UniversalTranslatorConfigScreen.
def forgeScreenRoots = []
if (project.ext.neoforgeForgeSharedRoot != "platforms/forge/26.x/shared") {
    forgeScreenRoots = [
            rootProject.file("platforms/forge/shared/screens/1.18.2-1.21.11"),
            rootProject.file("platforms/forge/shared/widgets/1.20.1-1.21.11"),
    ]
}
def missingScreenRoots = forgeScreenRoots.findAll { !it.isDirectory() }
if (!missingScreenRoots.isEmpty()) {
    throw new GradleException(
            "Missing Forge screen roots: " + missingScreenRoots.collect { it.name }.join(", "))
}

// The 1.21 Forge tree pulls files that adjacent families compile identically into their own layers
// (platforms/forge/1.21/shared.gradle). NeoForge compiles the same tree, so it needs the same extras.
def forgeSharedLayers = []
if (project.ext.neoforgeForgeSharedRoot == "platforms/forge/1.21/shared") {
    def family = project.ext.neoforgeForgeLayers.last()
    if (family != "1.21.9-1.21.11") {
        forgeSharedLayers << "runtime/1.21-1.21.8"
    }
    if (family != "1.21-1.21.5") {
        forgeSharedLayers << "draw-context/1.21.6-1.21.11"
    }
}
def missingSharedLayers = forgeSharedLayers.findAll {
    !new File(forgeSharedRoot, "${it}/src/main/java").isDirectory()
}
if (!missingSharedLayers.isEmpty()) {
    throw new GradleException("Missing Forge shared layers: " + missingSharedLayers.join(", "))
}

// A template that holds a placeholder the module never supplies used to reach the jar unchanged, so
// pack.mcmeta shipped as "\"pack_format\": ${packFormat}" — not valid JSON, which makes the whole
// built-in resource pack (and with it every language file) unreadable while the build stays green.
// Checked against the sources so the failure names the coordinate, not "template evaluation failed".
def packTemplates = []
packTemplates.add(new File(metadataLayer, "src/main/resources/pack.mcmeta"))
forgeLayers.each { packTemplates.add(new File(it, "src/main/resources/pack.mcmeta")) }
forgeExtraRoots.each { packTemplates.add(new File(it, "src/main/resources/pack.mcmeta")) }
def missingPackCoordinates = []
packTemplates.findAll { it.isFile() }.each { template ->
    def body = template.getText("UTF-8")
    if (body.contains('${packFormat}') && !project.ext.has("neoforgePackFormat")) {
        missingPackCoordinates.add("neoforgePackFormat (${relativePath(template)})".toString())
    }
    if (body.contains('${resourcePackFormat}') && !project.ext.has("neoforgeResourcePackFormat")) {
        missingPackCoordinates.add("neoforgeResourcePackFormat (${relativePath(template)})".toString())
    }
}
if (!missingPackCoordinates.isEmpty()) {
    throw new GradleException(
            "${project.path} ships a pack.mcmeta template with unexpanded placeholders; declare " +
                    missingPackCoordinates.join(", "))
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "mc-auto-translation-tool-neoforge-${project.ext.neoforgeMinecraftVersion}"
}

sourceSets {
    main {
        java.srcDir project(":translator-core").file("src/main/java")
        // ForgeConfig and the other files every Forge tree shares live in the global Forge layer;
        // NeoForge compiles the Forge sources, so it needs that directory too.
        java.srcDir rootProject.file("platforms/forge/shared/common/src/main/java")
        // RenderedTextBridge now lives in one shared Forge layer instead of each tree's common
        // layer. The NeoForge targets reuse the Forge layers, so they have to add it explicitly.
        java.srcDir new File(rootProject.file("platforms/forge/shared"),
                "rendered-1.19.2-plus/src/main/java")
        // ForgeLocalTextGuard moved to a shared Forge layer too; NeoForge reuses the Forge layers,
        // so it needs it explicitly. NeoForge 26.2 keeps its own copy (client.gui.screen()).
        if (project.ext.neoforgeEntryLayer != "26.2") {
            java.srcDir new File(rootProject.file("platforms/forge/shared"),
                    "local-guard-1.18.2-plus/src/main/java")
        }
        // ForgeTranslationRuntime is shared between Forge 1.21.9+ and 26.x; NeoForge reuses the
        // same layers, so the entrypoints that map onto them need it as well.
        if (project.ext.neoforgeEntryLayer in ["1.21.9-1.21.11", "26.1-26.1.2", "26.2"]) {
            java.srcDir new File(rootProject.file("platforms/forge/shared"),
                    "runtime-1.21.9-plus/src/main/java")
        }
        java.srcDir new File(entryLayer, "src/main/java")
        // UniversalTranslatorNeoForgeClient is identical for the 1.20.6 and 1.21-1.21.1 entrypoint
        // layers; the other layers differ in how they read the client state, so they keep their own.
        // The mapping lives in entryLayerSharedDirs above so a new layer cannot silently omit it.
        entryLayerShared.each { shared -> java.srcDir new File(shared, "src/main/java") }
        forgeLayers.each { layer -> java.srcDir new File(layer, "src/main/java") }
        forgeExtraRoots.each { extra -> java.srcDir new File(extra, "src/main/java") }
        forgeScreenRoots.each { root -> java.srcDir new File(root, "src/main/java") }
        forgeSharedLayers.each { layer ->
            java.srcDir new File(forgeSharedRoot, "${layer}/src/main/java")
        }
        // Lang assets live outside every Forge tree (platforms/shared/lang/json), and the Forge
        // shared scripts add them with this exact line. NeoForge keeps its resources in
        // sourceSets.main.resources and only copies the Forge ones through processResources, so
        // without this line all 20 NeoForge jars shipped with no
        // assets/universal_translator/lang/*.json at all. resources.srcDir is a processResources
        // input, so no extra from(...) is needed.
        resources.srcDir rootProject.file("platforms/shared/lang/json")
        // The Forge loader entrypoints are replaced by the NeoForge variants above.
        java.exclude "**/UniversalTranslatorForgeMod.java"
        java.exclude "**/UniversalTranslatorForgeClient.java"
    }
}

tasks.named("processResources", ProcessResources).configure {
    // NeoForge-specific mixin config, one copy per API family.
    from(new File(metadataLayer, "src/main/resources"))
    // Lang assets and pack.mcmeta come from the same Forge layers as the sources, so a
    // NeoForge jar carries exactly the resources its Forge counterpart does.
    forgeLayers.each { layer ->
        from(new File(layer, "src/main/resources")) {
            exclude "universal-translator.forge.mixins.json"
            exclude "META-INF/mods.toml"
        }
    }
    forgeExtraRoots.each { extra ->
        from(new File(extra, "src/main/resources")) {
            exclude "universal-translator.forge.mixins.json"
            exclude "META-INF/mods.toml"
        }
    }
    // The metadata layer and a Forge layer may both contribute the same file name; the
    // metadata copy is added first and therefore wins.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    inputs.property "version", project.version
    // One expansion covering every format coordinate the module declares. Registering a separate
    // content filter per coordinate meant the first one also ran over a template holding the other
    // placeholder, which SimpleTemplateEngine reports as MissingPropertyException.
    def packFormatValues = [:]
    if (project.ext.has("neoforgePackFormat")) {
        packFormatValues["packFormat"] = project.ext.neoforgePackFormat
    }
    if (project.ext.has("neoforgeResourcePackFormat")) {
        packFormatValues["resourcePackFormat"] = project.ext.neoforgeResourcePackFormat
    }
    if (!packFormatValues.isEmpty()) {
        packFormatValues.each { key, value -> inputs.property(key.toString(), value) }
        filesMatching("pack.mcmeta") {
            expand packFormatValues
        }
    }
    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

apply from: rootProject.file("gradle/jar-contents.gradle")

// The class-file gate the Fabric and Forge trees run. These nineteen release targets had none: the
// bytecode level rested on this module's neoforgeJavaRelease alone, and a tree-wide toolchain change
// would have shipped without anything reading the produced jar back. No remapJar exists here, so the
// gate inspects jar, whose entries are this project's own compiled classes. ModDevGradle also writes
// compile options of its own, so the gate keeps only the class-header half here.
ext.fabricReleaseJava = project.ext.neoforgeJavaRelease
ext.fabricReleaseJarSkipReleaseCheck = true
apply from: rootProject.file("gradle/fabric-release-jar-verify.gradle")

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = project.ext.neoforgeJavaRelease
}
