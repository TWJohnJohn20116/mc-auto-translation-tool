plugins {
    id "java"
    id "net.neoforged.moddev" version "${moddev_version}"
}

// Coordinate-only module. Sources, resources and compile settings all come from
// platforms/neoforge/shared.gradle; only the values below differ per version.
ext.neoforgeMinecraftVersion = "26.2"
ext.neoforgeVersion = project.neoforge_26_2_version
ext.neoforgeJavaRelease = 25
ext.neoforgeEntryLayer = "26.2"
ext.neoforgeMetadataLayer = "26.x"
ext.neoforgeForgeSharedRoot = "platforms/forge/26.x/shared"
ext.neoforgeForgeLayers = ["common", "api/26.2"]
// Resource pack format from the client's version.json (26.2 = 88.0), not the data pack format (107).
ext.neoforgeResourcePackFormat = 88

apply from: rootProject.file("platforms/neoforge/shared.gradle")

neoForge {
    version = project.ext.neoforgeVersion
    runs {
        client {
            client()
        }
    }
    mods {
        "universal_translator" {
            sourceSet sourceSets.main
        }
    }
}