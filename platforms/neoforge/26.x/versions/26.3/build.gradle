plugins {
    id "java"
    id "net.neoforged.moddev" version "${moddev_version}"
}

// Coordinate-only module. Sources, resources and compile settings all come from
// platforms/neoforge/shared.gradle; only the values below differ per version.
ext.neoforgeMinecraftVersion = "26.3"
ext.neoforgeVersion = project.neoforge_26_3_version
// Loader metadata coordinates for platforms/neoforge/shared/metadata/common (FML versionRange checks).
ext.neoforgeLoaderVersion = "[10,)"
ext.neoforgeDependencyRange = "[26.3.0.24,26.4.0.0)"
ext.neoforgeMinecraftRange = "[26.3,26.4)"
ext.neoforgeJavaRelease = 25
ext.neoforgeEntryLayer = "26.3"
ext.neoforgeMetadataLayer = "26.x"
ext.neoforgeForgeSharedRoot = "platforms/forge/26.x/shared"
ext.neoforgeForgeLayers = ["common", "api/26.3"]
// Resource pack format from the client's version.json (26.3 = 92.0).
ext.neoforgeResourcePackFormat = 92

apply from: rootProject.file("platforms/neoforge/shared.gradle")

neoForge {
    version = project.ext.neoforgeVersion
    runs {
        client {
            client()
        }
    }
    mods {
        "universal_translator" {
            sourceSet sourceSets.main
        }
    }
}
