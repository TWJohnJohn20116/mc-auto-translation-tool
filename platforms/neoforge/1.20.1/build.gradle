plugins {
    id "java"
    id "net.neoforged.moddev.legacyforge" version "2.0.91"
}

version = project.mod_version
group = project.maven_group

// This module keeps a hand-written source set instead of applying platforms/neoforge/shared.gradle
// (that would pull the Forge project into configuration and re-trigger the Minecraft Mavenizer for
// 3.5 minutes). The coordinates below are declarative only — nothing reads them at build time —
// but they put 1.20.1 inside validateNeoForgeModuleCoordinates and validateSharedPlatformLayouts,
// which previously described every NeoForge version except this one.
ext.neoforgeMinecraftVersion = "1.20.1"
ext.neoforgeVersion = "1.20.1-47.1.106"
ext.neoforgeJavaRelease = 17
ext.neoforgeEntryLayer = "1.20.2-1.20.4"
ext.neoforgeMetadataLayer = "1.20-1.20.4"
ext.neoforgeForgeSharedRoot = "platforms/forge/modern/shared"
ext.neoforgeForgeLayers = ["common", "family/1.19.2-plus"]
ext.neoforgeForgeExtraRoots = ["platforms/forge/modern/1.20.1"]

base {
    archivesName = "mc-auto-translation-tool-neoforge-1.20.1"
}

legacyForge {
    enable {
        neoForgeVersion = "1.20.1-47.1.106"
    }

    runs {
        client {
            client()
            programArgument "--mixin.config=universal-translator.neoforge.mixins.json"
            if (System.getProperty("os.name").startsWith("Mac")) {
                jvmArgument "-XstartOnFirstThread"
            }
        }
    }

    mods {
        universal_translator {
            sourceSet(sourceSets.main)
        }
    }
}

def forgeLegacyShared = rootProject.file("platforms/forge/modern/shared")
def forgeScreenShared = rootProject.file("platforms/forge/shared/screens/1.18.2-1.21.11")

sourceSets {
    main {
        java.srcDirs = [
                // 用路徑而不是 project(":platform-forge-1.20.1")：後者會讓 settings.gradle 必須把
                // 整個 Forge 專案 include 進來，於是 ForgeGradle 的 Minecraft Mavenizer 會在配置階段
                // 跑 3 分半（2026-10-04 實測 3:29.246），讓這個 job 變成 PR 裡最慢的一個。這裡只需要
                // 檔案路徑，不需要那個專案被評估。
                rootProject.file("platforms/forge/modern/1.20.1/src/main/java"),
                new File(forgeLegacyShared, "common/src/main/java"),
                new File(forgeLegacyShared, "family/1.19.2-plus/src/main/java"),
                // RenderedTextBridge and ForgeLocalTextGuard moved to shared Forge layers.
                new File(rootProject.file("platforms/forge/shared"),
                        "rendered-1.19.2-plus/src/main/java"),
                new File(rootProject.file("platforms/forge/shared"),
                        "local-guard-1.18.2-plus/src/main/java"),
                new File(forgeScreenShared, "src/main/java"),
                new File(rootProject.file("platforms/forge/shared/widgets/1.20.1-1.21.11"), "src/main/java"),
                // ForgeConfig and the other files every Forge tree shares live in the global layer.
                new File(rootProject.file("platforms/forge/shared"), "common/src/main/java"),
                project(":translator-core").file("src/main/java")
        ]
        resources.setSrcDirs([])
        // Same reason as platforms/neoforge/shared.gradle: the language files live in
        // platforms/shared/lang/json, outside every Forge tree, and this project clears the default
        // resource directories. processResources already pulls src/main/resources for the mixin
        // config and META-INF/mods.toml, so only the shared lang dir has to be added here.
        resources.srcDir rootProject.file("platforms/shared/lang/json")
    }
}

dependencies {
    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
}

mixin {
    add sourceSets.main, "main.refmap.json"
    config "universal-translator.neoforge.mixins.json"
}

tasks.named("processResources", ProcessResources).configure {
    inputs.properties("version": project.version, "packFormat": 15)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(rootProject.file("platforms/forge/modern/1.20.1/src/main/resources")) {
        exclude "META-INF/mods.toml", "universal-translator.forge.mixins.json"
    }
    from(new File(forgeLegacyShared, "common/src/main/resources")) {
        exclude "META-INF/mods.toml"
        filesMatching("pack.mcmeta") {
            expand "packFormat": 15
        }
    }
    from("src/main/resources") {
        filesMatching("META-INF/mods.toml") {
            expand "version": project.version
        }
    }
}

tasks.named("jar", Jar).configure {
    manifest {
        attributes "MixinConfigs": "universal-translator.neoforge.mixins.json"
    }
}
apply from: rootProject.file("gradle/jar-contents.gradle")

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}
