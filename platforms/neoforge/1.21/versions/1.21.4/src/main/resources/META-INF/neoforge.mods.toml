modLoader="javafml"
loaderVersion="[6,)"
license="MIT"
# The mod has no server-side code at all, so it must not be advertised as a server mod: without
# this the handshake asks the server for the same modId and the client is kicked from every server
# that does not have it installed.
clientSideOnly=true

[[mods]]
modId="universal_translator"
version="${version}"
displayName="MC Auto Translation Tool"
displayURL="https://github.com/TWJohnJohn20116/mc-auto-translation-tool"
displayTest="IGNORE_ALL_VERSION"
authors="我小张7272635"
logoFile="assets/universal_translator/icon.png"
description='''Client-side automatic translation for server-provided text across Minecraft interfaces.'''

[[mixins]]
config="universal-translator.neoforge.mixins.json"

[[dependencies.universal_translator]]
modId="neoforge"
type="required"
versionRange="[21.4.157,21.5.0)"
ordering="NONE"
side="CLIENT"

[[dependencies.universal_translator]]
modId="minecraft"
type="required"
versionRange="[1.21.4,1.21.5)"
ordering="NONE"
side="CLIENT"
