plugins {
    id "java"
    id "net.neoforged.moddev" version "${moddev_version}"
}

// Coordinate-only module. Sources, resources and compile settings all come from
// platforms/neoforge/shared.gradle; only the values below differ per version.
ext.neoforgeMinecraftVersion = "1.20.6"
ext.neoforgeVersion = project.neoforge_1_20_6_version
// Loader metadata coordinates for platforms/neoforge/shared/metadata/common (FML versionRange checks).
ext.neoforgeLoaderVersion = "[2,)"
ext.neoforgeDependencyRange = "[20.6.139,20.7.0)"
ext.neoforgeMinecraftRange = "[1.20.6,1.20.7)"
ext.neoforgeJavaRelease = 21
ext.neoforgeEntryLayer = "1.20.6"
ext.neoforgeMetadataLayer = "1.20.6"
ext.neoforgeForgeSharedRoot = "platforms/forge/modern/shared"
ext.neoforgeForgeLayers = ["common", "family/1.19.2-plus"]
ext.neoforgeForgeExtraRoots = ["platforms/forge/modern/1.20.1"]
ext.neoforgePackFormat = 32

apply from: rootProject.file("platforms/neoforge/shared.gradle")

// 1.20.6 still runs the 1.20-era HUD: Gui.render takes (GuiGraphics, float), so the 1.20.1 copy of
// InGameHudStatusIndicatorMixin under neoforgeForgeExtraRoots applies here unchanged and
// metadata/1.20.6 lists it. DeltaTracker, which replaced that float, only starts at 1.21 - the point
// where the trees need their own HUD mixin, not here.

neoForge {
    version = project.ext.neoforgeVersion
    runs {
        client {
            client()
        }
    }
    mods {
        "universal_translator" {
            sourceSet sourceSets.main
        }
    }
}