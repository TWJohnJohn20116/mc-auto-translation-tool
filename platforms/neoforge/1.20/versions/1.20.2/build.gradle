plugins {
    id "java"
    id "net.neoforged.moddev" version "${moddev_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "mc-auto-translation-tool-neoforge-${minecraft_neoforge_1_20_2_version}"
}

// NeoForge runs on Mojmap, so it reuses the Forge 1.20.1 legacy sources.
// Only the two loader entrypoints are replaced by the NeoForge variants in this module.
def forgeModernShared = rootProject.file("platforms/forge/modern/shared")
def forgeModernCommon = new File(forgeModernShared, "common")
def forgeLegacyFamily = new File(forgeModernShared, "family/1.19.2-plus")
def forgeModern1201 = rootProject.file("platforms/forge/modern/1.20.1")

neoForge {
    version = project.neoforge_1_20_2_version

    runs {
        client {
            client()
        }
    }

    mods {
        "universal_translator" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        java.srcDir project(":translator-core").file("src/main/java")
        java.srcDir new File(forgeModernCommon, "src/main/java")
        java.srcDir new File(forgeLegacyFamily, "src/main/java")
        java.srcDir new File(forgeModern1201, "src/main/java")
        java.exclude "**/UniversalTranslatorForgeMod.java"
        java.exclude "**/UniversalTranslatorForgeClient.java"
    }
}

tasks.named("processResources", ProcessResources).configure {
    from(new File(forgeModernCommon, "src/main/resources")) {
        exclude "META-INF/mods.toml"
    }
    inputs.property "version", project.version
    inputs.property "packFormat", 18
    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
    filesMatching("pack.mcmeta") {
        expand "packFormat": 18
    }
}

tasks.named("jar", Jar).configure {
    manifest {
        attributes "MixinConfigs": "universal-translator.neoforge.mixins.json"
    }
    from(rootProject.file("LICENSE")) {
        rename { "LICENSE_universal_translator" }
    }
    from(rootProject.file("docs/en/THIRD_PARTY_OFFLINE.md")) {
        rename { "THIRD_PARTY_OFFLINE.md" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 17
}
