plugins {
    id "java"
}

repositories {
    maven { url = "https://repo1.maven.org/maven2/" }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://libraries.minecraft.net/" }
    mavenCentral()
}

version = project.mod_version
group = project.maven_group

dependencies {
    testImplementation "net.fabricmc:fabric-loader:0.19.3"
    testRuntimeOnly "org.ow2.asm:asm:9.10.1"
    testRuntimeOnly "org.ow2.asm:asm-analysis:9.10.1"
    testRuntimeOnly "org.ow2.asm:asm-commons:9.10.1"
    testRuntimeOnly "org.ow2.asm:asm-tree:9.10.1"
    testRuntimeOnly "org.ow2.asm:asm-util:9.10.1"
    testRuntimeOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
}

base {
    archivesName = "mc-auto-translation-tool-fabric-1.20.x"
}

def supportedVersions = ["1.20", "1.20.1", "1.20.2", "1.20.3", "1.20.4", "1.20.5", "1.20.6"]
supportedVersions.each { gameVersion ->
    evaluationDependsOn(":platform-fabric-${gameVersion}")
}
// This bundle used to serialise every member's compile* task with a mustRunAfter chain, which
// cancelled --parallel for seven projects and had no counterpart in the three larger bundles
// (1.21.x, 1.0-1.8.x, 1.8-1.12.x), so whatever race it papered over was still open there. Nothing
// depends on that ordering: mustRunAfter adds no task-graph edge, and `jar` reaches every member
// through implementationJars below, so removing it leaves the graph complete and lets the members
// compile in parallel again.
def implementationJars = supportedVersions.collectEntries { gameVersion ->
    [(gameVersion): project(":platform-fabric-${gameVersion}").tasks.named("remapJar")]
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

jar {
    dependsOn implementationJars.values()
    supportedVersions.each { gameVersion ->
        from(implementationJars[gameVersion].flatMap { it.archiveFile }) {
            into "META-INF/jars"
            rename { "universal-translator-${gameVersion}.jar" }
        }
    }
}
ext.jarLicenseName = "LICENSE_universal_translator_bundle"
apply from: rootProject.file("gradle/jar-contents.gradle")

tasks.register("verifyBundle") {
    dependsOn jar
    doLast {
        def archive = jar.archiveFile.get().asFile
        def required = ["fabric.mod.json"] + supportedVersions.collect {
            "META-INF/jars/universal-translator-${it}.jar"
        }
        // One walk for the whole list. zipTree(archive) used to be built inside the loop, so every
        // required entry re-expanded the entire aggregate jar — about 110 full ZIP parses per build
        // across the eight bundles, each nested jar being a multi-megabyte deflate stream.
        def present = new java.util.zip.ZipFile(archive).withCloseable { zip ->
            def names = new HashSet()
            def entries = zip.entries()
            while (entries.hasMoreElements()) {
                names.add(entries.nextElement().name)
            }
            names as Set
        }
        def absent = required.findAll { !present.contains(it) }
        if (!absent.isEmpty()) {
            throw new GradleException("Missing bundle entry: ${absent.join(', ')}")
        }
        println "Verified ${archive.name}: all ${supportedVersions.size()} Minecraft 1.20 implementations present"
    }
}

tasks.register("verifyLoaderSelection", JavaExec) {
    dependsOn jar, testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "org.universaltranslator.bundle.BundleResolutionVerifier"
    args([jar.archiveFile.get().asFile.absolutePath] + supportedVersions)
}

// Aggregate-bundle resolution check; the expected version list is settings.gradle's
// platformDependencies, so adding a Minecraft version never means editing this file again.
apply from: rootProject.file("gradle/fabric-bundle-aggregate-verify.gradle")

test {
    enabled = false
}

build.dependsOn verifyBundle, verifyLoaderSelection

