plugins {
    id "java"
}

repositories {
    maven { url = "https://repo1.maven.org/maven2/" }
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://libraries.minecraft.net/" }
    mavenCentral()
}

version = project.mod_version
group = project.maven_group

dependencies {
    testImplementation "net.fabricmc:fabric-loader:0.19.3"
    testRuntimeOnly "org.ow2.asm:asm:9.10.1"
    testRuntimeOnly "org.ow2.asm:asm-analysis:9.10.1"
    testRuntimeOnly "org.ow2.asm:asm-commons:9.10.1"
    testRuntimeOnly "org.ow2.asm:asm-tree:9.10.1"
    testRuntimeOnly "org.ow2.asm:asm-util:9.10.1"
    testRuntimeOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
}

base {
    archivesName = "mc-auto-translation-tool-fabric-1.20.x"
}

def supportedVersions = ["1.20", "1.20.1", "1.20.2", "1.20.3", "1.20.4", "1.20.5", "1.20.6"]
supportedVersions.each { gameVersion ->
    evaluationDependsOn(":platform-fabric-${gameVersion}")
}
// This bundle used to serialise every member's compile* task with a mustRunAfter chain, which
// cancelled --parallel for seven projects and had no counterpart in the three larger bundles
// (1.21.x, 1.0-1.8.x, 1.8-1.12.x), so whatever race it papered over was still open there. Nothing
// depends on that ordering: mustRunAfter adds no task-graph edge, and `jar` reaches every member
// through implementationJars below, so removing it leaves the graph complete and lets the members
// compile in parallel again.
def implementationJars = supportedVersions.collectEntries { gameVersion ->
    [(gameVersion): project(":platform-fabric-${gameVersion}").tasks.named("remapJar")]
}

// The one declared loader/java floor for all seven members. It has to be the weakest requirement
// among them: a single jar has to stay installable for every release it ships, so the stricter
// per-version floor stays where it belongs, in that member's own fabric.mod.json (1.20.5/1.20.6 need
// 0.16.9 and Java 21). Declaring the number once here keeps it from being hand-copied into the
// template, where ">=0.15.11" / ">=17" had stopped matching this bundle's own members.
ext.bundleLoaderFloor = "0.15.11"
ext.bundleJavaFloor = "17"

processResources {
    inputs.property "version", project.version
    inputs.property "fabricDependency", gradle.ext.fabricApiModId
    inputs.property "loaderFloor", project.ext.bundleLoaderFloor
    inputs.property "javaFloor", project.ext.bundleJavaFloor
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "fabricDependency": gradle.ext.fabricApiModId,
                "loaderFloor": project.ext.bundleLoaderFloor, "javaFloor": project.ext.bundleJavaFloor
    }
}

jar {
    dependsOn implementationJars.values()
    supportedVersions.each { gameVersion ->
        from(implementationJars[gameVersion].flatMap { it.archiveFile }) {
            into "META-INF/jars"
            rename { "universal-translator-${gameVersion}.jar" }
        }
    }
}
ext.jarLicenseName = "LICENSE_universal_translator_bundle"
apply from: rootProject.file("gradle/jar-contents.gradle")
// The reverse direction: a fabric.mod.json that declares a version this jar does not ship would pass
// every presence check below, and the Loader then fails that version at resolution time.
ext.bundleSupportedVersions = supportedVersions
apply from: rootProject.file("gradle/bundle-metadata-verify.gradle")

tasks.register("verifyBundle") {
    dependsOn jar
    doLast {
        def archive = jar.archiveFile.get().asFile
        def required = ["fabric.mod.json"] + supportedVersions.collect {
            "META-INF/jars/universal-translator-${it}.jar"
        }
        // One walk of the central directory, and entry names are kept whole. zipTree used to be built
        // inside the loop (one full ZIP parse per required entry per bundle) and handed back temp
        // files, so the comparison had already been reduced to `it.name` — a nested jar that sat one
        // directory deeper than META-INF/jars still passed while the Loader could not find it.
        def present = [] as Set
        new java.util.zip.ZipFile(archive).withCloseable { zip ->
            zip.entries().each { entry ->
                if (!entry.directory) {
                    present.add(entry.name)
                }
            }
        }
        def missing = required.findAll { !present.contains(it) }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing bundle entries: ${missing}")
        }
        // The Loader reads `jars[].file` as an absolute archive path, so a misplaced nested jar is the
        // same failure as a missing one and is not worth discovering at resolution time.
        def misplaced = present.findAll {
            it.contains("universal-translator-") && it.endsWith(".jar")
                    && !it.startsWith("META-INF/jars/")
        }
        if (!misplaced.isEmpty()) {
            throw new GradleException("Nested bundle JARs outside META-INF/jars: ${misplaced}")
        }
        verifyBundleMetadata()
        println "Verified ${archive.name}: all ${supportedVersions.size()} Minecraft 1.20 implementations present"
    }
}

tasks.register("verifyLoaderSelection", JavaExec) {
    dependsOn jar, testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "org.universaltranslator.bundle.BundleResolutionVerifier"
    args([jar.archiveFile.get().asFile.absolutePath] + supportedVersions)
}

// Aggregate-bundle resolution check; the expected version list is settings.gradle's
// platformDependencies, so adding a Minecraft version never means editing this file again.
apply from: rootProject.file("gradle/fabric-bundle-aggregate-verify.gradle")

test {
    enabled = false
}

build.dependsOn verifyBundle, verifyLoaderSelection

// The Fabric Loader discovery harness is identical across the Fabric bundles; it lives in
// platforms/fabric/bundles/shared-test so a Loader API change is fixed once. This bundle used to
// keep a byte-identical copy — same 159 lines, same SHA-256 as the 1.21 one — compiled against the
// same net.fabricmc:fabric-loader:0.19.3, so there was no reason for a second copy.
sourceSets {
    test {
        java.srcDir rootProject.file("platforms/fabric/bundles/shared-test/src/test/java")
    }
}

