plugins {
    id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
}

ext.legacyMinecraftVersion = minecraft_1_20_6_version
ext.legacyYarnMappings = yarn_1_20_6_mappings
ext.legacyLoaderVersion = loader_1_20_6_version
ext.legacyFabricApiVersion = fabric_api_1_20_6_version
ext.legacyJavaRelease = 21

apply from: rootProject.file("platforms/fabric/legacy/shared.gradle")

// ChatImage normalisation is part of this branch: the 1.20.5-1.20.6 mixin layer carries the same
// addMessage hook as 1.20-1.20.4, so it is covered here too. The test itself is version-independent,
// hence the shared source directory.
sourceSets {
    chatImageCompatibilityTest {
        java.srcDir rootProject.file("platforms/fabric/1.20/versions/1.20.1/src/chatImageCompatibilityTest/java")
        compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.client.runtimeClasspath
    }
}

tasks.register("chatImageCompatibilitySelfTest", JavaExec) {
    group = "verification"
    description = "Checks ChatImage/ChatPatches translatable argument normalization."
    dependsOn tasks.named("chatImageCompatibilityTestClasses")
    classpath = sourceSets.chatImageCompatibilityTest.runtimeClasspath
    mainClass = "org.universaltranslator.fabric.ChatImageCompatibilitySelfTest"
}

tasks.named("check").configure {
    dependsOn tasks.named("chatImageCompatibilitySelfTest")
}