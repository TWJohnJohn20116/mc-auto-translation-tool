plugins {
    id "fabric-loom" version "${loom_ornithe_version}"
    id "ploceus" version "${ploceus_version}"
}

// The two Ornithe 1.13 modules (1.13.0 and 1.13.1); 1.13.2 moved to the legacy script, so this tree
// needs two shapes and no third.
def version = project.name.substring("platform-fabric-".length())

ext.ornitheMinecraftVersion = gradle.ext.fabricVersionCoordinate(project, "minecraft", "minecraft_", "_version")
ext.ornitheFeatherBuild = feather_build_1_13
ext.ornitheLoaderVersion = gradle.ext.fabricVersionCoordinate(project, "loader", "loader_", "_version")
ext.ornitheArchivesName = version

apply from: rootProject.file("platforms/fabric/1.13/ornithe.gradle")
