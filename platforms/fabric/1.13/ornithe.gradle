def requiredProperties = [
        "ornitheMinecraftVersion",
        "ornitheFeatherBuild",
        "ornitheLoaderVersion",
        "ornitheArchivesName"
]
requiredProperties.each { propertyName ->
    if (!project.ext.has(propertyName)) {
        throw new GradleException("Missing ${propertyName} before applying Ornithe 1.13 shared.gradle")
    }
}

def gameVersion = project.ext.ornitheMinecraftVersion.toString()
def sharedRoot = rootProject.file("platforms/fabric/1.13/shared/common")
// Files the Ornithe (1.13.0/1.13.1) and legacy (1.13.2) variants compile identically.
def bothRoot = rootProject.file("platforms/fabric/1.13/shared/shared-both")
// The three settings screens, shared by both 1.13 build paths, plus this path's mapping half.
def screensRoot = rootProject.file("platforms/fabric/1.13/shared/screens")
def screenBaseRoot = rootProject.file("platforms/fabric/1.13/shared/screen-base/1.13.0-1.13.1")

version = project.mod_version
group = project.maven_group

base {
    archivesName = "mc-auto-translation-tool-fabric-${project.ext.ornitheArchivesName}"
}

repositories {
    maven { url = "https://maven.ornithemc.net/releases/" }
    maven { url = "https://maven.ornithemc.net/snapshots/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${gameVersion}"
    mappings ploceus.featherMappings(project.ext.ornitheFeatherBuild)
    modImplementation "net.fabricmc:fabric-loader:${project.ext.ornitheLoaderVersion}"
}

sourceSets {
    main {
        java.srcDir project(":translator-core").file("src/main/java")
        java.srcDir rootProject.file("platforms/fabric/shared/settings/legacy/src/main/java")
        // FabricTranslationRuntimeBase is the single copy of the runtime body every Fabric tree
        // shares; each tree keeps only its generation-specific FabricTranslationRuntime.
        java.srcDir rootProject.file("platforms/fabric/shared/base/src/main/java")
        java.srcDir new File(sharedRoot, "src/main/java")
        java.srcDir rootProject.file("platforms/fabric/shared/rendered-legacy/src/main/java")
        java.srcDir rootProject.file("platforms/fabric/shared/runtime-legacy/src/main/java")
        // UniversalTranslatorFabricClient is shared with Fabric 1.8–1.12; 1.13.2 keeps its own.
        java.srcDir rootProject.file("platforms/fabric/shared/client-1.8-1.13/src/main/java")
        // ChatGuiMixin and SignEditScreenMixin are shared with Fabric 1.0–1.12.
        java.srcDir rootProject.file("platforms/fabric/shared/mixin-legacy-1.0-1.13/src/main/java")
        java.srcDir new File(bothRoot, "src/main/java")
        java.srcDir new File(screensRoot, "src/main/java")
        java.srcDir new File(screenBaseRoot, "src/main/java")
        resources.srcDir new File(sharedRoot, "src/main/resources")
        resources.srcDir new File(bothRoot, "src/main/resources")
        resources.srcDir rootProject.file("platforms/shared/lang/json")
        // Minecraft 1.13+ only reads assets/<ns>/lang/*.json, so platforms/shared/lang/legacy is dead weight here.
    }
}

processResources {
    // expand() reads the template with the platform default charset unless this is set, so a jar
    // built on a Windows dev box decoded the UTF-8 fabric.mod.json differently than CI did.
    filteringCharset = "UTF-8"
    inputs.properties(
            "version": project.version,
            "minecraftVersion": gameVersion,
            "loaderVersion": project.ext.ornitheLoaderVersion
    )
    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraftVersion": gameVersion,
                "loaderVersion": project.ext.ornitheLoaderVersion
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    // Read from settings.gradle's treeJavaRelease instead of repeating 8: the number this tree compiles
    // for is the table the Mixin bounds come from, and a literal here cannot follow it.
    options.release = gradle.ext.treeJavaTarget("platforms/fabric/1.13/")
}

// options.release already pins both the language level and the API table for every JavaCompile task
// in this project, so repeating the 1.8 pair here only gave "what does this build target" a second,
// contradicting answer.
java {
    withSourcesJar()
}

apply from: rootProject.file("gradle/jar-contents.gradle")
// A mixin class that no shipped mixins.json lists is compiled, shipped and never applied — the
// failure mode 1.19.3-1.19.4 shipped with — and required:true never complains about the reverse.
// These versions are nested inside the mc1.13.x release JAR, so this is the only place that sees
// the class-to-config mapping before it ships.
apply from: rootProject.file("gradle/fabric-mixin-config-verify.gradle")

// 1.13.0/1.13.1 are nested inside the mc1.13.x release JAR, and nothing read the produced classes back:
// options.release was the whole story. The header half is the proof that the shipped bytecode really is
// Java 8. Loom/Ornithe writes compile options of its own, so the declared-release half stays off here.
ext.fabricReleaseJava = gradle.ext.treeJavaTarget("platforms/fabric/1.13/")
ext.fabricReleaseJarSkipReleaseCheck = true
apply from: rootProject.file("gradle/fabric-release-jar-verify.gradle")

