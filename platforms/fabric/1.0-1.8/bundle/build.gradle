plugins { id "java" }

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.ornithemc.net/releases/" }
    mavenCentral()
}

version = project.mod_version
group = project.maven_group
base { archivesName = "mc-auto-translation-tool-fabric-1.3.1-1.8.8" }

dependencies {
    testImplementation "net.fabricmc:fabric-loader:0.19.3"
    testRuntimeOnly "org.ow2.asm:asm:9.10.1"
    testRuntimeOnly "org.ow2.asm:asm-analysis:9.10.1"
    testRuntimeOnly "org.ow2.asm:asm-commons:9.10.1"
    testRuntimeOnly "org.ow2.asm:asm-tree:9.10.1"
    testRuntimeOnly "org.ow2.asm:asm-util:9.10.1"
    testRuntimeOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
}

def supportedVersions = ["1.3.1","1.3.2","1.4.2","1.4.4","1.4.5","1.4.6","1.4.7","1.5.1","1.5.2","1.6.1","1.6.4","1.7.2","1.7.4","1.7.6","1.7.8","1.7.9","1.7.10","1.8","1.8.1","1.8.2","1.8.3","1.8.4","1.8.5","1.8.6","1.8.7","1.8.8"]
supportedVersions.each { gameVersion -> evaluationDependsOn(":platform-fabric-${gameVersion}") }
def implementationJars = supportedVersions.collectEntries { gameVersion ->
    [(gameVersion): project(":platform-fabric-${gameVersion}").tasks.named("remapJar")]
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

jar {
    dependsOn implementationJars.values()
    supportedVersions.each { gameVersion -> from(implementationJars[gameVersion].flatMap { it.archiveFile }) { into "META-INF/jars"; rename { "universal-translator-${gameVersion}.jar" } } }
}
ext.jarLicenseName = "LICENSE_universal_translator_bundle"
apply from: rootProject.file("gradle/jar-contents.gradle")

tasks.register("verifyBundle") {
    dependsOn jar
    doLast {
        def archive = jar.archiveFile.get().asFile
        (['fabric.mod.json'] + supportedVersions.collect { "META-INF/jars/universal-translator-${it}.jar" }).each { path ->
            if (!zipTree(archive).matching { include path }.files) throw new GradleException("Missing bundle entry: ${path}")
        }
        // The reverse direction. Presence checks above only prove that everything in
        // supportedVersions was packed; they cannot see a fabric.mod.json that declares versions
        // nobody builds. That is exactly how this bundle came to advertise 38 Minecraft versions
        // while shipping 26 implementations: the Loader then treats 1.0.0-1.2.5 and the four
        // unmappable 1.6/1.7 builds as supported and fails them at resolution time.
        def metadata = new groovy.json.JsonSlurper().parse(file("src/main/resources/fabric.mod.json"))
        def declaredJars = metadata.jars.collect { entry ->
            entry.file.tokenize('/').last()
                    .replace('universal-translator-', '')
                    .replace('.jar', '')
        }
        def declaredMinecraft = metadata.depends.minecraft
        if (declaredJars != supportedVersions) {
            throw new GradleException("fabric.mod.json jars ${declaredJars} != supportedVersions ${supportedVersions}")
        }
        if (declaredMinecraft != supportedVersions) {
            throw new GradleException("fabric.mod.json depends.minecraft ${declaredMinecraft} != supportedVersions ${supportedVersions}")
        }
        println "Verified ${archive.name}: all ${supportedVersions.size()} legacy Fabric implementations present"
    }
}

tasks.register("verifyLoaderSelection", JavaExec) {
    dependsOn jar, testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "org.universaltranslator.bundle.BundleResolutionVerifier"
    args([jar.archiveFile.get().asFile.absolutePath] + supportedVersions)
}

test { enabled = false }
build.dependsOn verifyBundle, verifyLoaderSelection

// The Fabric Loader discovery harness is byte-identical across these seven bundles; it lives in
// platforms/fabric/bundles/shared-test so a Loader API change is fixed once. The 1.20/1.21 and
// 26.x bundles keep their own copy: they run against a different Loader generation.
sourceSets {
    test {
        java.srcDir rootProject.file("platforms/fabric/bundles/shared-test/src/test/java")
    }
}