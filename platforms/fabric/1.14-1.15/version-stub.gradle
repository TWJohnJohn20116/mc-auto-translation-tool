plugins { id "java" }

// One build script for the three 1.14.0-1.14.2 stubs. They cannot apply
// platforms/fabric/legacy/shared.gradle (Yarn v2 for those snapshots does not remap through Loom), so
// they own their source set and their processResources — but not a copy of it each.
def version = project.name.substring("platform-fabric-".length())

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

version = project.mod_version
group = project.maven_group
base { archivesName = "mc-auto-translation-tool-fabric-${version}" }

// The two values gradle/bundle-metadata-verify.gradle reconciles against the 1.14-1.15 bundle's floor.
ext.legacyLoaderVersion = gradle.ext.fabricVersionCoordinate(project, "loader", "loader", "_version")
ext.legacyJavaRelease = 8

dependencies { compileOnly "net.fabricmc:fabric-loader:${project.ext.legacyLoaderVersion}" }

sourceSets {
    main {
        java.srcDir rootProject.file("platforms/fabric/1.14-1.15/shared/family/1.14-1.15/src/client/java")
        resources.srcDir rootProject.file("platforms/fabric/1.14-1.15/shared/family/1.14-1.15/src/main/resources")
        resources.srcDir rootProject.file("platforms/shared/lang/json")
    }
}

processResources {
    // filteringCharset matches the shared script: "authors" is non-ASCII and Copy.expand would otherwise
    // read the template in the platform charset, so a Windows build and CI disagreed on the same sources.
    filteringCharset = "UTF-8"
    def minecraftVersion = gradle.ext.fabricVersionCoordinate(project, "minecraft", "minecraft", "_version")
    def values = ["version"         : project.version,
                  "minecraftVersion": minecraftVersion,
                  "loaderVersion"   : project.ext.legacyLoaderVersion,
                  "javaVersion"     : project.ext.legacyJavaRelease]
    inputs.properties(values)
    filesMatching("fabric.mod.json") { expand(values) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = project.ext.legacyJavaRelease as int
}

java { withSourcesJar() }
apply from: rootProject.file("gradle/jar-contents.gradle")

// These modules are nested inside mc1.14-1.15.x-fabric and nothing else reads their jar back, so both
// halves of the class-file gate apply here.
ext.fabricReleaseJava = project.ext.legacyJavaRelease
apply from: rootProject.file("gradle/fabric-release-jar-verify.gradle")
