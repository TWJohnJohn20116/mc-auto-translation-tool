plugins {
    id "java"
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

version = project.mod_version
group = project.maven_group

dependencies {
    testImplementation "net.fabricmc:fabric-loader:0.19.3"
    testRuntimeOnly "org.ow2.asm:asm:9.10.1"
    testRuntimeOnly "org.ow2.asm:asm-analysis:9.10.1"
    testRuntimeOnly "org.ow2.asm:asm-commons:9.10.1"
    testRuntimeOnly "org.ow2.asm:asm-tree:9.10.1"
    testRuntimeOnly "org.ow2.asm:asm-util:9.10.1"
    testRuntimeOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
}

base {
    archivesName = "mc-auto-translation-tool-fabric-1.14-1.15.x"
}

def remappedVersions = ["1.14.3", "1.14.4", "1.15", "1.15.1", "1.15.2"]
def stubVersions = ["1.14", "1.14.1", "1.14.2"]
def supportedVersions = stubVersions + remappedVersions
supportedVersions.each { gameVersion ->
    evaluationDependsOn(":platform-fabric-${gameVersion}")
}
def implementationJars = supportedVersions.collectEntries { gameVersion ->
    def taskName = remappedVersions.contains(gameVersion) ? "remapJar" : "jar"
    [(gameVersion): project(":platform-fabric-${gameVersion}").tasks.named(taskName)]
}

// The one declared loader/java floor for all eight members. It has to be the weakest requirement
// among them: a single jar has to stay installable for every release it ships, so the stricter
// per-version floor stays where it belongs, in that member's own fabric.mod.json. Declaring the
// number once here keeps it from being hand-copied into the template and drifting.
ext.bundleLoaderFloor = "0.19.3"
ext.bundleJavaFloor = "8"
// The three stub members do not go through platforms/fabric/legacy/shared.gradle: their fabric.mod.json
// is expanded by their own build.gradle, so what they declare is a second copy of exactly these two
// numbers. Named here so gradle/bundle-metadata-verify.gradle can reconcile those members too.
ext.bundleStubVersions = stubVersions

processResources {
    inputs.property "version", project.version
    inputs.property "fabricDependency", gradle.ext.fabricApiModId
    inputs.property "loaderFloor", project.ext.bundleLoaderFloor
    inputs.property "javaFloor", project.ext.bundleJavaFloor
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "fabricDependency": gradle.ext.fabricApiModId,
                "loaderFloor": project.ext.bundleLoaderFloor, "javaFloor": project.ext.bundleJavaFloor
    }
}

jar {
    dependsOn implementationJars.values()
    supportedVersions.each { gameVersion ->
        from(implementationJars[gameVersion].flatMap { it.archiveFile }) {
            into "META-INF/jars"
            rename { "universal-translator-${gameVersion}.jar" }
        }
    }
}
ext.jarLicenseName = "LICENSE_universal_translator_bundle"
apply from: rootProject.file("gradle/jar-contents.gradle")
// The mod-list icon: one file under platforms/shared/lang/json, not a copy per bundle.
apply from: rootProject.file("gradle/bundle-icon.gradle")
// The reverse direction: a fabric.mod.json that declares a version this jar does not ship would
// pass every presence check below, and the Loader then fails that version at resolution time.
ext.bundleSupportedVersions = supportedVersions
apply from: rootProject.file("gradle/bundle-metadata-verify.gradle")

// This bundle is a member of fabricReleaseBundles, so its nested jars end up in fabric-all.jar, but it
// had no aggregate-bundle verification at all: verifyBundle only checks file names inside this jar and
// verifyLoaderSelection only casts this bundle's own list. Without this apply, whether Fabric Loader
// picks the right implementation out of the aggregate for these versions is never proven.
apply from: rootProject.file("gradle/fabric-bundle-aggregate-verify.gradle")

tasks.register("verifyBundle") {
    dependsOn jar
    doLast {
        def archive = jar.archiveFile.get().asFile
        def required = ["fabric.mod.json", "assets/universal_translator/icon.png"] + supportedVersions.collect {
            "META-INF/jars/universal-translator-${it}.jar"
        }
        // One walk for the whole list: collect the entries that exist, then compare names. zipTree is
        // the only reader that sees the entries `jar` writes from other tasks' outputs; a raw ZipFile
        // on the same path reports the nested jars as absent.
        def present = [] as Set
        zipTree(archive).matching {
            include "fabric.mod.json"
        include "assets/universal_translator/icon.png"
            include "META-INF/jars/universal-translator-*.jar"
        }.files.each { present.add(it.name) }
        def missing = required.findAll { !present.contains(it.tokenize('/').last()) }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing bundle entries: ${missing}")
        }
        verifyBundleMetadata()
        println "Verified ${archive.name}: all ${supportedVersions.size()} Minecraft 1.14/1.15 implementations present"
    }
}

tasks.register("verifyLoaderSelection", JavaExec) {
    dependsOn jar, testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "org.universaltranslator.bundle.BundleResolutionVerifier"
    args([jar.archiveFile.get().asFile.absolutePath] + supportedVersions)
}

test {
    enabled = false
}

build.dependsOn verifyBundle, verifyLoaderSelection

// The Fabric Loader discovery harness is byte-identical across these seven bundles; it lives in
// platforms/fabric/bundles/shared-test so a Loader API change is fixed once. The 1.20/1.21 and
// 26.x bundles keep their own copy: they run against a different Loader generation.
sourceSets {
    test {
        java.srcDir rootProject.file("platforms/fabric/bundles/shared-test/src/test/java")
    }
}