plugins { id "java" }

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

version = project.mod_version
group = project.maven_group
base { archivesName = "mc-auto-translation-tool-fabric-1.14-1.15.x" }

dependencies { compileOnly "net.fabricmc:fabric-loader:0.19.3" }

sourceSets {
    main {
        java.srcDir rootProject.file("platforms/fabric/1.14-1.15/shared/family/1.14-1.15/src/client/java")
        resources.srcDir rootProject.file("platforms/fabric/1.14-1.15/shared/family/1.14-1.15/src/main/resources")
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 8
}

jar {
    from(rootProject.file("LICENSE")) { rename { "LICENSE_universal_translator" } }
    from(rootProject.file("docs/en/THIRD_PARTY_OFFLINE.md")) { rename { "THIRD_PARTY_OFFLINE.md" } }
}

tasks.register("verifyBundle") {
    dependsOn jar
    doLast {
        def archive = jar.archiveFile.get().asFile
        [
                "fabric.mod.json",
                "universal-translator.fabric.mixins.json",
                "org/universaltranslator/fabric/UniversalTranslatorFabricClient.class"
        ].each { path ->
            if (!zipTree(archive).matching { include path }.files) {
                throw new GradleException("Missing direct bundle entry: ${path}")
            }
        }
        if (zipTree(archive).matching { include "META-INF/jars/*.jar" }.files) {
            throw new GradleException("Fabric 1.14/1.15 direct bundle must not contain nested JARs")
        }
        println "Verified ${archive.name}: direct Java 8 implementation for all Minecraft 1.14/1.15 releases"
    }
}

java { withSourcesJar() }
build.dependsOn verifyBundle
