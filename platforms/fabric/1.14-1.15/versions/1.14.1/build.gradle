plugins { id "java" }

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

version = project.mod_version
group = project.maven_group
base { archivesName = "mc-auto-translation-tool-fabric-1.14.1" }

// The two values gradle/bundle-metadata-verify.gradle reconciles against the 1.14-1.15 bundle's floor.
// This module declared neither, so that comparison derived the weakest member from the other five
// members and never looked at this one; the loader version now comes from the same gradle.properties
// key the 1.14.3+ modules read instead of being a second hard-coded copy.
ext.legacyLoaderVersion = project.loader_1_14_1_version
ext.legacyJavaRelease = 8

dependencies { compileOnly "net.fabricmc:fabric-loader:${project.ext.legacyLoaderVersion}" }

sourceSets {
    main {
        java.srcDir rootProject.file("platforms/fabric/1.14-1.15/shared/family/1.14-1.15/src/client/java")
        resources.srcDir rootProject.file("platforms/fabric/1.14-1.15/shared/family/1.14-1.15/src/main/resources")
        resources.srcDir rootProject.file("platforms/shared/lang/json")
    }
}

processResources {
    // The five 1.14.3+ members expand these two keys through platforms/fabric/legacy/shared.gradle;
    // this stub expanded only "version", so a template naming the loader would have shipped the
    // placeholder verbatim and nothing would have said so. filteringCharset matches the shared script:
    // "authors" is non-ASCII and Copy.expand would otherwise read the template in the platform charset.
    filteringCharset = "UTF-8"
    inputs.properties("version": project.version, "loaderVersion": project.ext.legacyLoaderVersion)
    filesMatching("fabric.mod.json") {
        expand("version": project.version, "loaderVersion": project.ext.legacyLoaderVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    // The ext above is the number settings.gradle's treeJavaRelease is checked against; a second literal
    // here was a copy that the table could not follow.
    options.release = project.ext.legacyJavaRelease as int
}

java { withSourcesJar() }
apply from: rootProject.file("gradle/jar-contents.gradle")

// This module is one of the eight implementations nested inside mc1.14-1.15.x-fabric, and unlike the
// five 1.14.3+ ones it applied neither the metadata contract nor this gate: nothing read the jar back,
// so its Java 8 claim rested on the options.release line alone. No third-party plugin writes the compile
// options of a plain java module, so both halves of the gate apply.
ext.fabricReleaseJava = project.ext.legacyJavaRelease
apply from: rootProject.file("gradle/fabric-release-jar-verify.gradle")

