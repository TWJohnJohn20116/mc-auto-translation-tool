processResources {
    // fabric.mod.json is the only resource with non-ASCII content ("authors"), and Copy.expand reads
    // the template with the platform default charset unless this is set: on a Windows dev box the
    // UTF-8 author name would be decoded as CP950/CP936 and written back with replacement characters,
    // so the same commit produced a different jar locally than on CI.
    filteringCharset = "UTF-8"
    inputs.properties(
            "version": project.version,
            "minecraftVersion": gameVersion,
            "loaderVersion": project.ext.legacyLoaderVersion,
            "javaVersion": project.ext.legacyJavaRelease,
            "fabricDependency": project.ext.legacyFabricDependency,
            "modmenuEntrypoint": modmenuEntrypoint,
            "modmenuSuggests": modmenuSuggests
    )
    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraftVersion": gameVersion,
                "loaderVersion": project.ext.legacyLoaderVersion,
                "javaVersion": project.ext.legacyJavaRelease,
                "fabricDependency": project.ext.legacyFabricDependency,
                "modmenuEntrypoint": modmenuEntrypoint,
                "modmenuSuggests": modmenuSuggests
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = project.ext.legacyJavaRelease as int
}

java {
    withSourcesJar()
}

apply from: rootProject.file("gradle/jar-contents.gradle")

// verify_release_jars.py derives its class-file ceiling from the published file name, and a platform
// artifact is called mc-auto-translation-tool-fabric-<mc version>-<mod version>.jar, which never
// matches its RELEASE_JAR pattern — _expected_class_major() then returned null and the Java 8/17/21
// gate was skipped for every target that uses this script. Stage a copy under the published name
// (same bytes; the build output keeps its own name) and verify that.
def stagedReleaseJar = layout.buildDirectory.file(
        "verify-release/MCAutoTranslationTool-${project.version}-mc${gameVersion}-fabric.jar")

tasks.register("verifyBuiltJar", Exec) {
    group = "verification"
    description = "Validates the remapped Fabric release JAR."
    dependsOn tasks.named("remapJar")
    inputs.file(tasks.named("remapJar").flatMap { it.archiveFile })
    inputs.file(rootProject.file("scripts/verify_release_jars.py"))
    doFirst {
        def pythonCmd = System.getProperty("os.name").toLowerCase().contains("windows") ? "python" : "python3"
        def released = tasks.named("remapJar").get().archiveFile.get().asFile
        def staged = stagedReleaseJar.get().asFile
        staged.parentFile.mkdirs()
        released.withInputStream { input ->
            staged.withOutputStream { output -> output << input }
        }
        commandLine(
                pythonCmd,
                rootProject.file("scripts/verify_release_jars.py"),
                staged
        )
    }
}

tasks.named("build").configure {
    dependsOn tasks.named("verifyBuiltJar")
}

ext.modmenuEnabled = hasModMenu
ext.modmenuApiFamily = "yarn"
ext.modmenuClientSourceSet = splitEnvironment ? "client" : "main"
apply from: rootProject.file("platforms/fabric/modmenu/modmenu.gradle")
