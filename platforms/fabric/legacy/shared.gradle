def requiredProperties = [
        "legacyMinecraftVersion",
        "legacyYarnMappings",
        "legacyLoaderVersion",
        "legacyFabricApiVersion",
        "legacyJavaRelease",
        "legacyFabricDependency"
]
requiredProperties.each { propertyName ->
    if (!project.ext.has(propertyName)) {
        throw new GradleException("Missing ${propertyName} before applying Fabric legacy shared.gradle")
    }
}

def sourceLayers = [
        "1.14": ["family/1.14-1.15"],
        "1.14.1": ["family/1.14-1.15"],
        "1.14.2": ["family/1.14-1.15"],
        "1.14.3": ["family/1.14-1.15"],
        "1.14.4": ["family/1.14-1.15"],
        "1.15": ["family/1.14-1.15"],
        "1.15.1": ["family/1.14-1.15"],
        "1.15.2": ["family/1.14-1.15"],
        "1.16": ["family/1.16-1.16.1"],
        "1.16.1": ["family/1.16-1.16.1"],
        "1.16.2": ["family/1.16.0-1.16.4", "family/1.16.5-1.19.2", "rendered/1.16.5"],
        "1.16.3": ["family/1.16.0-1.16.4", "family/1.16.5-1.19.2", "rendered/1.16.5"],
        "1.16.4": ["family/1.16.0-1.16.4", "family/1.16.5-1.19.2", "rendered/1.16.5"],
        "1.16.5": ["family/1.16.5", "family/1.16.5-1.19.2", "rendered/1.16.5"],
        "1.17": ["family/1.16.5-1.19.2", "rendered/1.16.5", "family/1.17"],
        "1.17.1": ["family/1.16.5-1.19.2", "rendered/1.16.5", "family/1.17.1-1.18"],
        "1.18": ["family/1.16.5-1.19.2", "rendered/1.16.5", "family/1.17.1-1.18"],
        "1.18.1": ["family/1.16.5-1.19.2", "rendered/1.16.5", "family/1.17.1-1.18"],
        "1.18.2": ["family/1.16.5-1.19.2", "rendered/1.16.5", "family/1.18.2"],
        "1.19": ["family/1.16.5-1.19.2", "rendered/1.19.2-plus", "family/1.19.2"],
        "1.19.1": ["family/1.16.5-1.19.2", "rendered/1.19.2-plus", "family/1.19.2"],
        "1.19.2": ["family/1.16.5-1.19.2", "rendered/1.19.2-plus", "family/1.19.2"],
        "1.19.3": ["rendered/1.19.2-plus", "family/1.19.3-1.19.4"],
        "1.19.4": ["rendered/1.19.2-plus", "family/1.19.3-1.19.4"],
        "1.20": ["rendered/1.19.2-plus", "family/1.20.1"],
        "1.20.1": ["rendered/1.19.2-plus", "family/1.20.1"],
        "1.20.2": ["rendered/1.19.2-plus", "family/1.20.1"],
        "1.20.3": ["rendered/1.19.2-plus", "family/1.20.1"],
        "1.20.4": ["rendered/1.19.2-plus", "family/1.20.1"],
        "1.20.5": ["rendered/1.19.2-plus", "family/1.20.1"],
        "1.20.6": ["rendered/1.19.2-plus", "family/1.20.1"]
]
def gameVersion = project.ext.legacyMinecraftVersion.toString()
def layers = sourceLayers[gameVersion]
if (layers == null) {
    throw new GradleException("No Fabric legacy source layers are registered for ${gameVersion}")
}

def sharedRoot = rootProject.file("platforms/fabric/legacy/shared")
def rootForLayer = { layer ->
    if (layer == "family/1.16-1.16.1" || layer == "family/1.16.0-1.16.4" || layer == "family/1.16.5") {
        return rootProject.file("platforms/fabric/1.16/shared")
    }
    if (layer == "family/1.14-1.15") {
        return rootProject.file("platforms/fabric/1.14-1.15/shared")
    }
    if (layer.startsWith("family/1.20")) {
        return rootProject.file("platforms/fabric/1.20/shared")
    }
    if (layer.startsWith("family/1.17") || layer.startsWith("family/1.18.2")) {
        return rootProject.file("platforms/fabric/1.17-1.18/shared")
    }
    if (layer.startsWith("family/1.19.2") || layer.startsWith("family/1.19.3")) {
        return rootProject.file("platforms/fabric/1.19/shared")
    }
    return sharedRoot
}
def splitEnvironment = !(gameVersion in ["1.14", "1.14.1", "1.14.2", "1.14.3", "1.14.4",
        "1.15", "1.15.1", "1.15.2", "1.16", "1.16.1", "1.16.2", "1.16.3", "1.16.4", "1.16.5", "1.17", "1.17.1"])
def early114115 = gameVersion.startsWith("1.14") || gameVersion.startsWith("1.15")
def early116 = gameVersion in ["1.16", "1.16.1"]
def hasModMenu = !(early114115 || early116 || gameVersion in ["1.16.2", "1.16.3", "1.16.4"])
def modmenuEntrypoint = hasModMenu ? """,
    "modmenu": [
      "org.universaltranslator.fabric.ModMenuIntegration"
    ]""" : ""
def modmenuSuggests = hasModMenu ? """,
  "suggests": {
    "modmenu": "*"
  }""" : ""

version = project.mod_version
group = project.maven_group

base {
    archivesName = "mc-auto-translation-tool-fabric-${gameVersion}"
}

dependencies {
    minecraft "com.mojang:minecraft:${gameVersion}"
    mappings "net.fabricmc:yarn:${project.ext.legacyYarnMappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.ext.legacyLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.ext.legacyFabricApiVersion}"
}

sourceSets {
    main {
        java.srcDir project(":translator-core").file("src/main/java")
        resources.srcDir new File(sharedRoot, "common/src/main/resources")
        layers.each { layer ->
            resources.srcDir new File(rootForLayer(layer), "${layer}/src/main/resources")
        }
    }
}

if (splitEnvironment) {
    loom {
        splitEnvironmentSourceSets()

        mods {
            "universal_translator" {
                sourceSet sourceSets.main
                sourceSet sourceSets.client
            }
        }
    }

    sourceSets {
        client {
            if (!(early114115 || early116)) {
                java.srcDir new File(sharedRoot, "common/src/client/java")
            }
            layers.each { layer ->
                java.srcDir new File(rootForLayer(layer), "${layer}/src/client/java")
            }
        }
    }
} else {
    sourceSets {
        main {
            java.srcDir "src/client/java"
            if (!(early114115 || early116)) {
                java.srcDir new File(sharedRoot, "common/src/client/java")
            }
            layers.each { layer ->
                java.srcDir new File(rootForLayer(layer), "${layer}/src/client/java")
            }
        }
    }
}

processResources {
    inputs.properties(
            "version": project.version,
            "minecraftVersion": gameVersion,
            "loaderVersion": project.ext.legacyLoaderVersion,
            "javaVersion": project.ext.legacyJavaRelease,
            "fabricDependency": project.ext.legacyFabricDependency,
            "modmenuEntrypoint": modmenuEntrypoint,
            "modmenuSuggests": modmenuSuggests
    )
    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraftVersion": gameVersion,
                "loaderVersion": project.ext.legacyLoaderVersion,
                "javaVersion": project.ext.legacyJavaRelease,
                "fabricDependency": project.ext.legacyFabricDependency,
                "modmenuEntrypoint": modmenuEntrypoint,
                "modmenuSuggests": modmenuSuggests
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = project.ext.legacyJavaRelease as int
}

java {
    withSourcesJar()
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "LICENSE_universal_translator" }
    }
    from(rootProject.file("docs/en/THIRD_PARTY_OFFLINE.md")) {
        rename { "THIRD_PARTY_OFFLINE.md" }
    }
}

tasks.register("verifyBuiltJar", Exec) {
    group = "verification"
    description = "Validates the remapped Fabric release JAR."
    dependsOn tasks.named("remapJar")
    inputs.file(tasks.named("remapJar").flatMap { it.archiveFile })
    inputs.file(rootProject.file("scripts/verify_release_jars.py"))
    doFirst {
        commandLine(
                "python3",
                rootProject.file("scripts/verify_release_jars.py"),
                tasks.named("remapJar").get().archiveFile.get().asFile
        )
    }
}

tasks.named("build").configure {
    dependsOn tasks.named("verifyBuiltJar")
}

ext.modmenuEnabled = hasModMenu
ext.modmenuApiFamily = "yarn"
ext.modmenuClientSourceSet = splitEnvironment ? "client" : "main"
apply from: rootProject.file("platforms/fabric/modmenu/modmenu.gradle")
