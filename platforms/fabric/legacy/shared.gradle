def gameVersion = project.ext.legacyMinecraftVersion.toString()
def layers = sourceLayers[gameVersion]
if (layers == null) {
    throw new GradleException("No Fabric legacy source layers are registered for ${gameVersion}")
}
// Layer names that are mount flags only: the code they pull in lives in platforms/fabric/shared/*,
// so this tree has no client source directory of that name. Kept as an explicit list so the srcDir
// loop below can tell "flag" from "typo" — every name used to be treated as a path as well, which
// silently added four non-existent source directories to twenty-one projects and would have produced
// a duplicate class the day one of those directories appeared.
def sharedFlagLayers = [
        "family/1.16-common",
        "family/1.16.0-1.16.4",
        "family/1.16.5",
        "family/1.17",
        "rendered/1.19.2-plus"
] as Set

def sharedRoot = rootProject.file("platforms/fabric/legacy/shared")
def rootForLayer = { layer ->
    if (layer == "family/1.16-1.16.1" || layer == "family/1.16.0-1.16.4" || layer == "family/1.16.5"
            || layer == "family/1.16-common") {
        return rootProject.file("platforms/fabric/1.16/shared")
    }
    if (layer == "family/1.14" || layer == "family/1.15" || layer == "family/1.14-1.15"
            || layer == "family/1.14-1.15-common") {
        return rootProject.file("platforms/fabric/1.14-1.15/shared")
    }
    if (layer.startsWith("family/1.20") || layer.startsWith("chat-hud/1.20")) {
        return rootProject.file("platforms/fabric/1.20/shared")
    }
    // Fabric 1.20.x reuses the screens and the input bases that live in the 1.21 tree.
    if (layer.startsWith("screens/1.20.1-1.21") || layer == "input/pre-1.21.9") {
        return rootProject.file("platforms/fabric/1.21/shared")
    }
    if (layer.startsWith("family/1.17")) {
        return rootProject.file("platforms/fabric/1.17-1.18/shared")
    }
    if (layer.startsWith("family/1.19.2") || layer.startsWith("family/1.19.3")
            || layer.startsWith("screens/1.19") || layer.startsWith("screen-base/1.19")) {
        return rootProject.file("platforms/fabric/1.19/shared")
    }
    return sharedRoot
}
def splitEnvironment = !(gameVersion in ["1.14", "1.14.1", "1.14.2", "1.14.3", "1.14.4",
        "1.15", "1.15.1", "1.15.2", "1.16", "1.16.1", "1.16.2", "1.16.3", "1.16.4", "1.16.5", "1.17", "1.17.1"])
def early114115 = gameVersion.startsWith("1.14") || gameVersion.startsWith("1.15")
def early116 = gameVersion in ["1.16", "1.16.1"]
def hasModMenu = !(early114115 || early116 || gameVersion in ["1.16.2", "1.16.3", "1.16.4"])
def modmenuEntrypoint = hasModMenu ? """,
    "modmenu": [
      "org.universaltranslator.fabric.ModMenuIntegration"
    ]""" : ""
def modmenuSuggests = hasModMenu ? """,
  "suggests": {
    "modmenu": "*"
  }""" : ""

version = project.mod_version
group = project.maven_group

base {
    archivesName = "mc-auto-translation-tool-fabric-${gameVersion}"
}

repositories {
    maven {
        name = "MavenCentralMirror"
        url = uri("https://repo1.maven.org/maven2/")
    }
    maven {
        name = "Minecraft libraries"
        url = uri("https://libraries.minecraft.net/")
    }
    maven {
        name = "Fabric"
        url = uri("https://maven.fabricmc.net/")
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${gameVersion}"
    mappings "net.fabricmc:yarn:${project.ext.legacyYarnMappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.ext.legacyLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.ext.legacyFabricApiVersion}"
}

sourceSets {
    main {
        java.srcDir project(":translator-core").file("src/main/java")
        resources.srcDir new File(sharedRoot, "common/src/main/resources")
        resources.srcDir rootProject.file("platforms/shared/lang/json")
        layers.each { layer ->
            resources.srcDir new File(rootForLayer(layer), "${layer}/src/main/resources")
        }
    }
}

if (splitEnvironment) {
    loom {
        splitEnvironmentSourceSets()

        mods {
            "universal_translator" {
                sourceSet sourceSets.main
                sourceSet sourceSets.client
            }
        }
    }

    sourceSets {
        client {
            if (!early114115) {
                java.srcDir new File(sharedRoot, "common/src/client/java")
            }
            // FabricConfig is shared by every Fabric tree, so it is added unconditionally: the
            // early 1.14/1.15 builds used to read it from family/1.14-1.15-common.
            java.srcDir rootProject.file("platforms/fabric/shared/settings/legacy/src/main/java")
            // FabricTranslationRuntimeBase is the single copy of the runtime body every Fabric
            // tree shares; each tree keeps only its generation-specific FabricTranslationRuntime.
            java.srcDir rootProject.file("platforms/fabric/shared/base/src/main/java")
            // TranslationRenderContext is byte-identical in every Fabric tree from 1.14 up, so it
            // lives in one shared layer instead of one copy per tree.
            java.srcDir rootProject.file("platforms/fabric/shared/common/src/client/java")
            // FabricTranslationRuntime is byte-identical for 1.14 through 1.20; 1.21 keeps its own
            // pair (pre-1.21.9 / 1.21.9-plus) because the runtime splits there.
            java.srcDir rootProject.file("platforms/fabric/shared/runtime-common/src/client/java")
            java.srcDir rootProject.file("platforms/fabric/shared/legacy-common/src/client/java")
            // 1.19–1.20 share RenderedTextBridge with 1.21; 1.14–1.18 use their own copies.
            if (layers.contains("rendered/1.19.2-plus")) {
                java.srcDir rootProject.file("platforms/fabric/shared/rendered-common/src/client/java")
            }
            // InGameHudStatusIndicatorMixin is identical for 1.16 through 1.19.4. 1.14/1.15 and
            // 1.20 keep their own copies (different HUD entry points).
            if (!early114115 && !gameVersion.startsWith("1.20")) {
                java.srcDir rootProject.file("platforms/fabric/shared/hud-indicator/src/client/java")
                // The six small HUD/input mixins below are identical for 1.16 through 1.19.4 as
                // well; 1.14/1.15 and 1.20+ keep their own copies.
                java.srcDir rootProject.file("platforms/fabric/shared/mixin-1.16-1.19/src/client/java")
            }
            // ScreenMixin is identical for 1.14 through 1.19.4. 1.20+ keeps its own copy: the
            // screen lifecycle hooks it wraps changed in 1.20.
            if (!gameVersion.startsWith("1.20")) {
                java.srcDir rootProject.file("platforms/fabric/shared/screen-mixin/src/client/java")
            }
            // UniversalTranslatorFabricClient is identical for 1.14 through 1.16.4.
            if (layers.contains("family/1.14-1.15-common")
                    || layers.contains("family/1.16.0-1.16.4")) {
                java.srcDir rootProject.file("platforms/fabric/shared/client-1.14-1.16.4/src/client/java")
            }
            // UniversalTranslatorFabricClient is identical for 1.16.5 and 1.17 as well.
            if (layers.contains("family/1.16.5") || layers.contains("family/1.17")) {
                java.srcDir rootProject.file("platforms/fabric/shared/client-1.16.5-1.17/src/client/java")
            }
            // DrawContextMixin is identical for 1.20 and 1.21.0–1.21.5.
            if (layers.contains("family/1.20.1")) {
                java.srcDir rootProject.file("platforms/fabric/shared/draw-context/src/client/java")
            }
            // UniversalTranslatorFabricClient is identical for 1.20.1 and 1.21.0–1.21.8.
            if (layers.contains("family/1.20.1")) {
                java.srcDir rootProject.file("platforms/fabric/shared/client-1.20-1.21/src/client/java")
                // TextRendererMixin is shared with Fabric 1.21.0–1.21.1.
                java.srcDir rootProject.file("platforms/fabric/shared/text-renderer-1.20-1.21/src/client/java")
            }
            // ButtonWidget is identical for 1.16–1.16.1 and 1.16.5–1.19.2.
            if (layers.contains("family/1.16-1.16.1") || layers.contains("family/1.16.5-1.19.2")) {
                java.srcDir rootProject.file("platforms/fabric/shared/button-widget-1.16-1.19/src/client/java")
            }
            // The settings screen body is identical for 1.14 through 1.21.11.
            if (layers.contains("family/1.14-1.15-common") || layers.contains("screens/1.16-1.18")
                    || layers.contains("screens/1.19-1.19.4")
                    || layers.contains("screens/1.20.1-1.21.11")) {
                java.srcDir rootProject.file("platforms/fabric/shared/screens-shared/src/client/java")
            }
            // TitleScreenMixin is identical for 1.19.3–1.19.4, 1.20.x and 1.21.
            if (layers.contains("family/1.19.3-1.19.4") || layers.contains("family/1.20.1")) {
                java.srcDir rootProject.file("platforms/fabric/shared/title-screen-1.19-1.21/src/client/java")
            }
            // Three small screen/HUD mixins are identical for 1.20.x and 1.21.
            if (layers.contains("family/1.20.1")) {
                java.srcDir rootProject.file("platforms/fabric/shared/mixin-1.20-1.21/src/client/java")
            }
            // ClientPlayerEntityMixin is identical for 1.14 through 1.18.
            if (layers.contains("family/1.14-1.15-common") || layers.contains("family/1.16-common")
                    || layers.contains("family/1.17-1.18-common")) {
                java.srcDir rootProject.file("platforms/fabric/shared/mixin-1.14-1.18/src/client/java")
            }
            // TitleScreenMixin is identical for 1.14 through 1.16 only; 1.17+ uses addButton and
            // keeps its own copy.
            if (layers.contains("family/1.14-1.15-common") || layers.contains("family/1.16-common")) {
                java.srcDir rootProject.file("platforms/fabric/shared/mixin-1.14-1.16/src/client/java")
            }
            layers.each { layer ->
                def layerDir = new File(rootForLayer(layer), "${layer}/src/client/java")
                if (layerDir.directory) {
                    java.srcDir layerDir
                } else if (!sharedFlagLayers.contains(layer)) {
                    // Neither a directory nor a known mount flag: a typo, or a layer whose sources were
                    // never added. Gradle ignores a missing srcDir in silence, so the project would
                    // build without the code the table promised.
                    throw new GradleException(
                            "Source layer '${layer}' of ${gameVersion} has no directory under " +
                                    "${rootForLayer(layer)} and is not one of the shared flag layers " +
                                    sharedFlagLayers)
                }
            }
        }
    }
