def requiredProperties = [
        "fabricMinecraftVersion",
        "fabricYarnMappings",
        "fabricLoaderVersion",
        "fabricApiVersion"
]
requiredProperties.each { propertyName ->
    if (!project.ext.has(propertyName)) {
        throw new GradleException("Missing ${propertyName} before applying Fabric 1.21 shared.gradle")
    }
}

// The loader requirement under the name gradle/bundle-metadata-verify.gradle reads when it derives a
// bundle's floor from its weakest member. The 1.16-1.20 members declare legacyLoaderVersion
// themselves; this tree stores the same fact as fabricLoaderVersion, and without the alias the floor
// check would find an empty member list and pass without comparing anything for all twelve releases.
ext.legacyLoaderVersion = project.ext.fabricLoaderVersion.toString()

def sourceLayers = [
        "1.21"   : ["runtime/pre-1.21.9", "draw/1.21-1.21.5", "text-renderer/1.21-1.21.1", "input/pre-1.21.9"],
        "1.21.1" : ["runtime/pre-1.21.9", "draw/1.21-1.21.5", "text-renderer/1.21-1.21.1", "input/pre-1.21.9"],
        "1.21.2" : ["runtime/pre-1.21.9", "draw/1.21-1.21.5", "text-renderer/1.21.2-1.21.5", "input/pre-1.21.9"],
        "1.21.3" : ["runtime/pre-1.21.9", "draw/1.21-1.21.5", "text-renderer/1.21.2-1.21.5", "input/pre-1.21.9"],
        "1.21.4" : ["runtime/pre-1.21.9", "draw/1.21-1.21.5", "text-renderer/1.21.2-1.21.5", "input/pre-1.21.9"],
        "1.21.5" : ["runtime/pre-1.21.9", "draw/1.21-1.21.5", "text-renderer/1.21.2-1.21.5", "input/pre-1.21.9"],
        "1.21.6" : ["runtime/pre-1.21.9", "draw/1.21.6-plus", "text-renderer/1.21.6-1.21.10", "input/pre-1.21.9"],
        "1.21.7" : ["runtime/pre-1.21.9", "draw/1.21.6-plus", "text-renderer/1.21.6-1.21.10", "input/pre-1.21.9"],
        "1.21.8" : ["runtime/pre-1.21.9", "draw/1.21.6-plus", "text-renderer/1.21.6-1.21.10", "input/pre-1.21.9"],
        "1.21.9" : ["runtime/1.21.9-plus", "draw/1.21.6-plus", "text-renderer/1.21.6-1.21.10", "input/1.21.9-plus"],
        "1.21.10": ["runtime/1.21.9-plus", "draw/1.21.6-plus", "text-renderer/1.21.6-1.21.10", "input/1.21.9-plus"],
        "1.21.11": ["runtime/1.21.9-plus", "draw/1.21.6-plus", "text-renderer/1.21.11", "input/1.21.9-plus"]
]

// Groovy's String.minus removes the first occurrence of the substring, not a prefix, so this only
// worked while the project name contained "platform-fabric-" exactly once. Strip the prefix
// explicitly and print the project path with the derived value so a mis-registration is traceable.
def sourceVersion = project.ext.has("fabricSourceVersion") ?
        project.ext.fabricSourceVersion.toString() :
        (project.name.startsWith("platform-fabric-")
                ? project.name.substring("platform-fabric-".length())
                : project.name)
// Layer names that are mount flags only: the code they pull in lives in
// platforms/fabric/shared/*, so this tree has no directory of that name. Kept as an explicit list
// so the srcDir loop below can tell "flag" from "typo" — previously every name was also treated as
// a path, which silently added two or three non-existent source directories to eight projects and
// would have produced a duplicate class the day someone created one of those directories.
def sharedFlagLayers = [
        "runtime/pre-1.21.9",
        "draw/1.21-1.21.5",
        "text-renderer/1.21-1.21.1"
] as Set
def layers = sourceLayers[sourceVersion]
if (layers == null) {
    throw new GradleException(
            "No Fabric 1.21 source layers are registered for ${sourceVersion} (project ${project.path})")
}

def sharedRoot = rootProject.file("platforms/fabric/1.21/shared")

version = project.mod_version
group = project.maven_group

base {
    // One source for the file name: the Minecraft version this target compiles against. It used to
    // take a fabricArchiveVersion override so one unpublished project could be named after a version
    // span; that project now sets its own archivesName after applying this script instead.
    archivesName = "mc-auto-translation-tool-fabric-${project.ext.fabricMinecraftVersion}"
}

repositories {
    maven {
        name = "MavenCentralMirror"
        url = uri("https://repo1.maven.org/maven2/")
    }
    maven {
        name = "Minecraft libraries"
        url = uri("https://libraries.minecraft.net/")
    }
    maven {
        name = "Fabric"
        url = uri("https://maven.fabricmc.net/")
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.ext.fabricMinecraftVersion}"
    mappings "net.fabricmc:yarn:${project.ext.fabricYarnMappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.ext.fabricLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.ext.fabricApiVersion}"
}

sourceSets {
    main {
        java.srcDir project(":translator-core").file("src/main/java")
        resources.srcDir new File(sharedRoot, "common/src/main/resources")
        resources.srcDir rootProject.file("platforms/shared/lang/json")
    }
}

// The client source directories below are hard-coded instead of coming from sourceLayers, so none of
// them was covered by the layer check inside sourceSets. Renaming screens/1.20.1-1.21.11 (also matched
// by a string prefix in platforms/fabric/legacy/shared.gradle) would have left all twelve 1.21 targets
// compiling without their settings screens and every task still green.
def requiredSharedDirs = [
        new File(sharedRoot, "common/src/client/java"),
        new File(sharedRoot, "screens/1.20.1-1.21.11/src/client/java"),
        rootProject.file("platforms/fabric/shared/settings/modern/src/main/java"),
        rootProject.file("platforms/fabric/shared/common/src/client/java"),
        rootProject.file("platforms/fabric/shared/base/src/main/java"),
        rootProject.file("platforms/fabric/shared/runtime-common/src/client/java"),
        rootProject.file("platforms/fabric/shared/draw-context/src/client/java"),
        rootProject.file("platforms/fabric/shared/client-1.20-1.21/src/client/java"),
        rootProject.file("platforms/fabric/shared/text-renderer-1.20-1.21/src/client/java"),
        rootProject.file("platforms/fabric/shared/title-screen-1.19-1.21/src/client/java"),
        rootProject.file("platforms/fabric/shared/mixin-1.20-1.21/src/client/java"),
        rootProject.file("platforms/fabric/shared/legacy-common/src/client/java"),
        rootProject.file("platforms/fabric/shared/rendered-common/src/client/java"),
        rootProject.file("platforms/fabric/shared/screens-shared/src/client/java")
]
def missingSharedDirs = requiredSharedDirs.findAll { !it.isDirectory() }
if (!missingSharedDirs.isEmpty()) {
    throw new GradleException(
            "Missing shared Fabric source directories for ${sourceVersion}: " +
                    missingSharedDirs.collect { relativePath(it) }.join(", "))
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "universal_translator" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    client {
        java.srcDir new File(sharedRoot, "common/src/client/java")
        java.srcDir rootProject.file("platforms/fabric/shared/settings/modern/src/main/java")
        // Byte-identical in every Fabric tree from 1.14 up; see platforms/fabric/shared/common.
        java.srcDir rootProject.file("platforms/fabric/shared/common/src/client/java")
        // FabricTranslationRuntimeBase is the single copy of the runtime body every Fabric tree
        // shares; each tree keeps only its generation-specific FabricTranslationRuntime.
        java.srcDir rootProject.file("platforms/fabric/shared/base/src/main/java")
        // 1.21 through 1.21.8 share the runtime with the legacy trees; 1.21.9+ has its own copy
        // in runtime/1.21.9-plus, so the shared layer is only added for the pre-1.21.9 layer.
        if (layers.contains("runtime/pre-1.21.9")) {
            java.srcDir rootProject.file("platforms/fabric/shared/runtime-common/src/client/java")
        }
        // DrawContextMixin is shared with Fabric 1.20.x; 1.21.6+ has its own (the draw context
        // gained a new entry point there).
        if (layers.contains("draw/1.21-1.21.5")) {
            java.srcDir rootProject.file("platforms/fabric/shared/draw-context/src/client/java")
        }
        // UniversalTranslatorFabricClient is shared with Fabric 1.20.1; 1.21.9+ has its own.
        if (layers.contains("runtime/pre-1.21.9")) {
            java.srcDir rootProject.file("platforms/fabric/shared/client-1.20-1.21/src/client/java")
        }
        // TextRendererMixin is shared with Fabric 1.20.1 for 1.21.0–1.21.1 only.
        if (layers.contains("text-renderer/1.21-1.21.1")) {
            java.srcDir rootProject.file("platforms/fabric/shared/text-renderer-1.20-1.21/src/client/java")
        }
        // TitleScreenMixin is shared with Fabric 1.19.3+ and 1.20.x.
        java.srcDir rootProject.file("platforms/fabric/shared/title-screen-1.19-1.21/src/client/java")
        // Three small screen/HUD mixins are shared with Fabric 1.20.x.
        java.srcDir rootProject.file("platforms/fabric/shared/mixin-1.20-1.21/src/client/java")
        // FabricLocalTextGuard is identical for 1.14 through 1.21; 26.x keeps its own copy
        // because it reads the chat field through the newer EditBox API.
        java.srcDir rootProject.file("platforms/fabric/shared/legacy-common/src/client/java")
        // RenderedTextBridge is identical for 1.19 through 1.21; 1.14–1.18 keep their own copies
        // (the 1.14/1.15 one predates OrderedText, the 1.16 one predates the 1.19 render API).
        java.srcDir rootProject.file("platforms/fabric/shared/rendered-common/src/client/java")
        // The settings screens are shared with Fabric 1.20.x as well, so they sit in their own layer.
        java.srcDir new File(sharedRoot, "screens/1.20.1-1.21.11/src/client/java")
        // The settings screen body is also shared with the 1.19 tree.
        java.srcDir rootProject.file("platforms/fabric/shared/screens-shared/src/client/java")
        layers.each { layer ->
            def layerDir = new File(sharedRoot, "${layer}/src/client/java")
            if (layerDir.directory) {
                java.srcDir layerDir
            } else if (!sharedFlagLayers.contains(layer)) {
                // A layer that is neither a directory nor a known mount flag is a typo or a layer
                // whose sources were never added; Gradle ignores a missing srcDir in silence, so
                // the project would build without the code the table promised.
                throw new GradleException(
                        "Source layer '${layer}' of ${sourceVersion} has no directory under ${sharedRoot}"
                                + " and is not one of the shared flag layers ${sharedFlagLayers}")
            }
        }
    }
}

// The twelve fabric.mod.json files are hand-maintained, one per version, and differ only in the two
// entries that describe the release itself: "fabricloader" and "minecraft". Only the loader one is
// rewritten below, so the rest of the 36 lines were copied by hand and nothing compared them: adding
// 1.21.12 meant copying all of them, and an edit to one file (an entrypoint, a dependency, the java
// floor) could leave the other eleven behind with every task still green. Compare the tree here, at
// configuration time and without adding a task, so the copies may differ only in those two values and
// each one has to name its own release.
def versionsMetadataRoot = rootProject.file("platforms/fabric/1.21/versions")
def canonicalMetadata = null
def canonicalMetadataName = null
versionsMetadataRoot.listFiles()?.findAll { it.isDirectory() }?.sort { it.name }?.each { versionDir ->
    def metadataFile = new File(versionDir, "src/main/resources/fabric.mod.json")
    if (!metadataFile.isFile()) {
        throw new GradleException(
                "${relativePath(metadataFile)} is missing: every registered 1.21 version keeps one " +
                        "fabric.mod.json of its own")
    }
    def parsedMetadata = new groovy.json.JsonSlurper().parseText(metadataFile.getText("UTF-8")) as Map
    def parsedDepends = (parsedMetadata.depends ?: [:]) as Map
    if (parsedDepends.get("minecraft") != versionDir.name) {
        throw new GradleException(
                "${relativePath(metadataFile)} declares minecraft ${parsedDepends.get('minecraft')} " +
                        "but lives under versions/${versionDir.name}/")
    }
    def shape = new LinkedHashMap(parsedMetadata)
    def shapeDepends = new LinkedHashMap(parsedDepends)
    shapeDepends.remove("fabricloader")
    shapeDepends.remove("minecraft")
    shape.remove("depends")
    shape.put("depends", shapeDepends)
    if (canonicalMetadata == null) {
        canonicalMetadata = shape
        canonicalMetadataName = versionDir.name
    } else if (shape != canonicalMetadata) {
        throw new GradleException(
                "${relativePath(metadataFile)} differs from versions/${canonicalMetadataName}/" +
                        "src/main/resources/fabric.mod.json in more than the version-dependent " +
                        "'fabricloader'/'minecraft' entries; the twelve 1.21 metadata files have to " +
                        "stay one shape or one of them silently ships a different mod")
    }
}

processResources {
    inputs.property "version", project.version
    // The declared loader floor is derived from the loader this target is actually compiled
    // against, instead of being hand-written into twelve fabric.mod.json files. Those twelve were
    // written by hand and drifted: 1.21.11 declared ">=0.18.1" (its real build loader) while the
    // other eleven declared ">=0.19.3", so the same tree advertised two different minimums and
    // nothing compared the number with the property. Rewriting the line here keeps the value honest
    // for every version, including any future one that reuses the global loader_version key.
    // Read once into a local so the filter below never touches `project` at execution time.
    def loaderFloor = project.ext.fabricLoaderVersion.toString()
    def loaderFloorLine = /"fabricloader": ">=[^"]*"/
    def sourceMetadata = fileTree(projectDir) {
        include "src/main/resources/fabric.mod.json"
        exclude "**/build/**"
    }
    inputs.property "loaderFloor", loaderFloor
    // The filter only rewrites a line that still has exactly this shape. A reformatted fabric.mod.json
    // (a multi-line depends block, a tab, four spaces before the value) made the replaceAll miss in
    // silence and the hand-written floor shipped instead — that is the drift this block exists to
    // remove, so the shape is asserted before the filter runs.
    doFirst {
        sourceMetadata.files.each { metadata ->
            if (!(metadata.getText("UTF-8") =~ loaderFloorLine).find()) {
                throw new GradleException(
                        "${project.path}: ${metadata.name} has no single-line " +
                                "'\"fabricloader\": \">=…\"' entry, so the declared loader floor cannot be " +
                                "rewritten from fabricLoaderVersion")
            }
        }
    }
    filesMatching("fabric.mod.json") {
        expand "version": project.version
        filter { line ->
            line.replaceAll(loaderFloorLine, "\"fabricloader\": \">=${loaderFloor}\"")
        }
    }
}

def javaReleaseTarget = gradle.ext.treeJavaTarget("platforms/fabric/1.21/")
// Handed to the class-file gate applied below, so the bytecode is checked against the same number the
// compiler is given instead of a second copy of it.
ext.fabricReleaseJava = javaReleaseTarget
// The same number under the name gradle/bundle-metadata-verify.gradle reads (legacyJavaRelease), so
// the bundle floor check compares against real members instead of an empty list.
ext.legacyJavaRelease = javaReleaseTarget.toString()
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    // Read from settings.gradle's treeJavaRelease so the compile target and the Mixin bounds derived
    // from that same table cannot disagree.
    options.release = javaReleaseTarget
}

java {
    withSourcesJar()
}

apply from: rootProject.file("gradle/jar-contents.gradle")
apply from: rootProject.file("gradle/fabric-release-jar-verify.gradle")
// A mixin class that no shipped mixins.json lists is compiled, shipped and never applied, and
// required:true never complains about that direction.
apply from: rootProject.file("gradle/fabric-mixin-config-verify.gradle")

ext.modmenuApiFamily = "yarn"
ext.modmenuClientSourceSet = "client"
apply from: rootProject.file("platforms/fabric/modmenu/modmenu.gradle")
