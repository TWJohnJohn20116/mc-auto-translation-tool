def requiredProperties = [
        "fabricMinecraftVersion",
        "fabricYarnMappings",
        "fabricLoaderVersion",
        "fabricApiVersion"
]
requiredProperties.each { propertyName ->
    if (!project.ext.has(propertyName)) {
        throw new GradleException("Missing ${propertyName} before applying Fabric 1.21 shared.gradle")
    }
}

def sourceLayers = [
        "1.21"   : ["runtime/pre-1.21.9", "draw/1.21-1.21.5", "text-renderer/1.21-1.21.1", "input/pre-1.21.9"],
        "1.21.1" : ["runtime/pre-1.21.9", "draw/1.21-1.21.5", "text-renderer/1.21-1.21.1", "input/pre-1.21.9"],
        "1.21.2" : ["runtime/pre-1.21.9", "draw/1.21-1.21.5", "text-renderer/1.21.2-1.21.5", "input/pre-1.21.9"],
        "1.21.3" : ["runtime/pre-1.21.9", "draw/1.21-1.21.5", "text-renderer/1.21.2-1.21.5", "input/pre-1.21.9"],
        "1.21.4" : ["runtime/pre-1.21.9", "draw/1.21-1.21.5", "text-renderer/1.21.2-1.21.5", "input/pre-1.21.9"],
        "1.21.5" : ["runtime/pre-1.21.9", "draw/1.21-1.21.5", "text-renderer/1.21.2-1.21.5", "input/pre-1.21.9"],
        "1.21.6" : ["runtime/pre-1.21.9", "draw/1.21.6-plus", "text-renderer/1.21.6-1.21.10", "input/pre-1.21.9"],
        "1.21.7" : ["runtime/pre-1.21.9", "draw/1.21.6-plus", "text-renderer/1.21.6-1.21.10", "input/pre-1.21.9"],
        "1.21.8" : ["runtime/pre-1.21.9", "draw/1.21.6-plus", "text-renderer/1.21.6-1.21.10", "input/pre-1.21.9"],
        "1.21.9" : ["runtime/1.21.9-plus", "draw/1.21.6-plus", "text-renderer/1.21.6-1.21.10", "input/1.21.9-plus"],
        "1.21.10": ["runtime/1.21.9-plus", "draw/1.21.6-plus", "text-renderer/1.21.6-1.21.10", "input/1.21.9-plus"],
        "1.21.11": ["runtime/1.21.9-plus", "draw/1.21.6-plus", "text-renderer/1.21.11", "input/1.21.9-plus"]
]

def sourceVersion = project.ext.has("fabricSourceVersion") ?
        project.ext.fabricSourceVersion.toString() : project.name - "platform-fabric-"
def layers = sourceLayers[sourceVersion]
if (layers == null) {
    throw new GradleException("No Fabric 1.21 source layers are registered for ${sourceVersion}")
}

def sharedRoot = rootProject.file("platforms/fabric/1.21/shared")
def archiveVersion = project.ext.has("fabricArchiveVersion") ?
        project.ext.fabricArchiveVersion : project.ext.fabricMinecraftVersion

version = project.mod_version
group = project.maven_group

base {
    archivesName = "mc-auto-translation-tool-fabric-${archiveVersion}"
}

repositories {
    maven {
        name = "MavenCentralMirror"
        url = uri("https://repo1.maven.org/maven2/")
    }
    maven {
        name = "Minecraft libraries"
        url = uri("https://libraries.minecraft.net/")
    }
    maven {
        name = "Fabric"
        url = uri("https://maven.fabricmc.net/")
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.ext.fabricMinecraftVersion}"
    mappings "net.fabricmc:yarn:${project.ext.fabricYarnMappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.ext.fabricLoaderVersion}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.ext.fabricApiVersion}"
}

sourceSets {
    main {
        java.srcDir project(":translator-core").file("src/main/java")
        resources.srcDir new File(sharedRoot, "common/src/main/resources")
        resources.srcDir rootProject.file("platforms/shared/lang/json")
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "universal_translator" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    client {
        java.srcDir new File(sharedRoot, "common/src/client/java")
        java.srcDir rootProject.file("platforms/fabric/shared/settings/modern/src/main/java")
        // Byte-identical in every Fabric tree from 1.14 up; see platforms/fabric/shared/common.
        java.srcDir rootProject.file("platforms/fabric/shared/common/src/client/java")
        // 1.21 through 1.21.8 share the runtime with the legacy trees; 1.21.9+ has its own copy
        // in runtime/1.21.9-plus, so the shared layer is only added for the pre-1.21.9 layer.
        if (layers.contains("runtime/pre-1.21.9")) {
            java.srcDir rootProject.file("platforms/fabric/shared/runtime-common/src/client/java")
        }
        // DrawContextMixin is shared with Fabric 1.20.x; 1.21.6+ has its own (the draw context
        // gained a new entry point there).
        if (layers.contains("draw/1.21-1.21.5")) {
            java.srcDir rootProject.file("platforms/fabric/shared/draw-context/src/client/java")
        }
        // UniversalTranslatorFabricClient is shared with Fabric 1.20.1; 1.21.9+ has its own.
        if (layers.contains("runtime/pre-1.21.9")) {
            java.srcDir rootProject.file("platforms/fabric/shared/client-1.20-1.21/src/client/java")
        }
        // TextRendererMixin is shared with Fabric 1.20.1 for 1.21.0–1.21.1 only.
        if (layers.contains("text-renderer/1.21-1.21.1")) {
            java.srcDir rootProject.file("platforms/fabric/shared/text-renderer-1.20-1.21/src/client/java")
        }
        // TitleScreenMixin is shared with Fabric 1.19.3+ and 1.20.x.
        java.srcDir rootProject.file("platforms/fabric/shared/title-screen-1.19-1.21/src/client/java")
        // Three small screen/HUD mixins are shared with Fabric 1.20.x.
        java.srcDir rootProject.file("platforms/fabric/shared/mixin-1.20-1.21/src/client/java")
        // FabricLocalTextGuard is identical for 1.14 through 1.21; 26.x keeps its own copy
        // because it reads the chat field through the newer EditBox API.
        java.srcDir rootProject.file("platforms/fabric/shared/legacy-common/src/client/java")
        // RenderedTextBridge is identical for 1.19 through 1.21; 1.14–1.18 keep their own copies
        // (the 1.14/1.15 one predates OrderedText, the 1.16 one predates the 1.19 render API).
        java.srcDir rootProject.file("platforms/fabric/shared/rendered-common/src/client/java")
        // The settings screens are shared with Fabric 1.20.x as well, so they sit in their own layer.
        java.srcDir new File(sharedRoot, "screens/1.20.1-1.21.11/src/client/java")
        // The settings screen body is also shared with the 1.19 tree.
        java.srcDir rootProject.file("platforms/fabric/shared/screens-shared/src/client/java")
        layers.each { layer ->
            java.srcDir new File(sharedRoot, "${layer}/src/client/java")
        }
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

java {
    withSourcesJar()
}

apply from: rootProject.file("gradle/jar-contents.gradle")

ext.modmenuApiFamily = "yarn"
ext.modmenuClientSourceSet = "client"
apply from: rootProject.file("platforms/fabric/modmenu/modmenu.gradle")
