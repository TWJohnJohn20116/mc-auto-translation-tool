plugins {
    id "net.fabricmc.fabric-loom-remap" version "${loom_version}"
}

// One build script for the twelve 1.21 modules; the tree's shared.gradle already owns everything else.
ext.fabricMinecraftVersion = gradle.ext.fabricVersionCoordinate(project, "minecraft", "minecraft", "_version")
ext.fabricYarnMappings = gradle.ext.fabricVersionCoordinate(project, "yarnMappings", "yarn", "_mappings")
ext.fabricLoaderVersion = gradle.ext.fabricVersionCoordinate(project, "loader", "loader", "_version")
ext.fabricApiVersion = gradle.ext.fabricVersionCoordinate(project, "fabricApi", "fabric_api", "_version")

apply from: rootProject.file("platforms/fabric/1.21/shared.gradle")
