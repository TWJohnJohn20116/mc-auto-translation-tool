def requiredProperties = [
        "ornitheMinecraftVersion",
        "ornitheFeatherBuild",
        "ornitheLoaderVersion"
]
requiredProperties.each { propertyName ->
    if (!project.ext.has(propertyName)) {
        throw new GradleException("Missing ${propertyName} before applying Ornithe 1.8.9-1.12.2 shared.gradle")
    }
}

def gameVersion = project.ext.ornitheMinecraftVersion.toString()
def sharedRoot = rootProject.file("platforms/fabric/1.8-1.12/shared/common")

version = project.mod_version
group = project.maven_group

base {
    archivesName = "mc-auto-translation-tool-fabric-${gameVersion}"
}

repositories {
    maven { url = "https://maven.ornithemc.net/releases/" }
    maven { url = "https://maven.ornithemc.net/snapshots/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${gameVersion}"
    mappings ploceus.featherMappings(project.ext.ornitheFeatherBuild)
    modImplementation "net.fabricmc:fabric-loader:${project.ext.ornitheLoaderVersion}"
}

sourceSets {
    main {
        java.srcDir project(":translator-core").file("src/main/java")
        java.srcDir rootProject.file("platforms/fabric/shared/settings/legacy/src/main/java")
        // FabricTranslationRuntimeBase is the single copy of the runtime body every Fabric tree
        // shares; each tree keeps only its generation-specific FabricTranslationRuntime.
        java.srcDir rootProject.file("platforms/fabric/shared/base/src/main/java")
        java.srcDir new File(sharedRoot, "src/main/java")
        java.srcDir rootProject.file("platforms/fabric/shared/rendered-legacy/src/main/java")
        // TextRendererMixin is shared with Fabric 1.0–1.8; 1.13 has its own.
        java.srcDir rootProject.file("platforms/fabric/shared/text-renderer-legacy/src/main/java")
        // FabricLocalTextGuard is shared with Fabric 1.0–1.8; 1.13+ has its own.
        java.srcDir rootProject.file("platforms/fabric/shared/guard-legacy/src/main/java")
        // ChatGuiMixin and SignEditScreenMixin are shared with 1.0–1.8 and 1.13.0/1.13.1.
        java.srcDir rootProject.file("platforms/fabric/shared/mixin-legacy-1.0-1.13/src/main/java")
        // TitleScreenMixin and TextFieldWidgetMixin use the pre-1.13 widget API.
        java.srcDir rootProject.file("platforms/fabric/shared/mixin-legacy-1.0-1.12/src/main/java")
        java.srcDir rootProject.file("platforms/fabric/shared/render-context-legacy/src/main/java")
        java.srcDir rootProject.file("platforms/fabric/shared/runtime-legacy/src/main/java")
        // UniversalTranslatorFabricClient is shared with Fabric 1.13.0/1.13.1; 1.13.2 keeps its
        // own copy and 1.0–1.8 differs in the client entrypoint API.
        java.srcDir rootProject.file("platforms/fabric/shared/client-1.8-1.13/src/main/java")
        java.srcDir new File(rootProject.file("platforms/fabric/1.0-1.12/shared/screens"), "src/main/java")
        resources.srcDir new File(sharedRoot, "src/main/resources")
        resources.srcDir rootProject.file("platforms/shared/lang/legacy")
    }
}

// Minecraft 1.11 renamed the language files from en_US.lang to en_us.lang, while 1.10 and earlier only
// read the uppercase name and one source directory can hold one spelling. The lowercase alias is
// generated at build time instead of being committed, so the two spellings cannot drift apart, and
// only for the versions that resolve the lowercase name.
def lowerCaseLangRoots = []
if (gameVersion.startsWith("1.11") || gameVersion.startsWith("1.12")) {
    lowerCaseLangRoots = sourceSets.main.resources.srcDirs.findAll {
        new File(it, "assets/universal_translator/lang").isDirectory()
    }
}

processResources {
    // expand() reads the template with the platform default charset unless this is set, so a jar
    // built on a Windows dev box decoded the UTF-8 fabric.mod.json differently than CI did.
    filteringCharset = "UTF-8"
    inputs.properties(
            "version": project.version,
            "minecraftVersion": gameVersion,
            "loaderVersion": project.ext.ornitheLoaderVersion
    )
    filesMatching("fabric.mod.json") {
        expand(
                "version": project.version,
                "minecraftVersion": gameVersion,
                "loaderVersion": project.ext.ornitheLoaderVersion
        )
    }
    lowerCaseLangRoots.each { resourceRoot ->
        from(new File(resourceRoot, "assets/universal_translator/lang")) {
            include "*.lang"
            rename { String name -> name.toLowerCase(Locale.ROOT) }
            into "assets/universal_translator/lang"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 8
}

// options.release already pins both the language level and the API table for every JavaCompile task
// in this project, so repeating the 1.8 pair here only gave "what does this build target" a second,
// contradicting answer.
java {
    withSourcesJar()
}

apply from: rootProject.file("gradle/jar-contents.gradle")
// A mixin class that no shipped mixins.json lists is compiled, shipped and never applied — the
// failure mode 1.19.3-1.19.4 shipped with — and required:true never complains about the reverse.
// This tree is only built by the scheduled legacy-targets run, so without this check nothing looks
// at the class-to-config mapping it ships at all.
apply from: rootProject.file("gradle/fabric-mixin-config-verify.gradle")

// Nothing read this tree's produced classes back: options.release was the whole story. These versions
// are only built by the scheduled legacy-targets run and verify_release_jars.py never sees them (the
// 1.8-1.12 bundle is not one of the published assets), so the header half below is the only proof that
// the shipped bytecode really is Java 8. Loom writes compile options of its own, so the
// declared-release half stays off - the same shape the 1.13 tree uses.
ext.fabricReleaseJava = gradle.ext.treeJavaTarget("platforms/fabric/1.8-1.12/")
ext.fabricReleaseJarSkipReleaseCheck = true
apply from: rootProject.file("gradle/fabric-release-jar-verify.gradle")

