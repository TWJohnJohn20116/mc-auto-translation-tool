def requiredProperties = [
        "legacyMinecraftVersion",
        "legacyForgeVersion",
        "legacyForgeLoaderMajor",
        "legacyMinecraftNextVersion",
        "legacyJavaRelease",
        "legacyPackFormat",
        "legacyAuthors"
]
requiredProperties.each { propertyName ->
    if (!project.ext.has(propertyName)) {
        throw new GradleException("Missing ${propertyName} before applying Forge legacy shared.gradle")
    }
}

def gameVersion = project.ext.legacyMinecraftVersion.toString()
def sourceLayers = [
        "1.16.5": [],
        "1.19.2": ["family/1.19.2-plus"],
        "1.20.1": ["family/1.19.2-plus"]
]
def layers = sourceLayers[gameVersion]
if (layers == null) {
    throw new GradleException("No Forge legacy source layers are registered for ${gameVersion}")
}
def sharedRoot = rootProject.file("platforms/forge/modern/shared")

version = project.mod_version
group = project.maven_group

base {
    archivesName = "mc-auto-translation-tool-forge-${gameVersion}"
}

minecraft {
    mappings channel: "official", version: gameVersion
    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir("run")
            args "--mixin.config=universal-translator.forge.mixins.json"
            if (System.getProperty("os.name").startsWith("Mac")) {
                jvmArgs "-XstartOnFirstThread"
            }
        }
        register("client")
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency(
            "net.minecraftforge:forge:${gameVersion}-${project.ext.legacyForgeVersion}")
    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
}

sourceSets {
    main {
        java.srcDir project(":translator-core").file("src/main/java")
        java.srcDir new File(sharedRoot, "common/src/main/java")
        layers.each { layer ->
            java.srcDir new File(sharedRoot, "${layer}/src/main/java")
        }
        resources.srcDir new File(sharedRoot, "common/src/main/resources")
    }
}

renamer.enableMixinRefmaps {
    config "universal-translator.forge.mixins.json"
}

renamer.classes(tasks.named("jar", Jar)) {
    archiveClassifier = "runtime"
    mappings renamer.mixin.generatedMappings
}
renamer.mappings(minecraft.dependency.toSrg)

tasks.named("processResources", ProcessResources).configure {
    inputs.properties(
            "version": project.version,
            "loaderMajor": project.ext.legacyForgeLoaderMajor,
            "forgeVersion": project.ext.legacyForgeVersion,
            "minecraftVersion": gameVersion,
            "minecraftNextVersion": project.ext.legacyMinecraftNextVersion,
            "packFormat": project.ext.legacyPackFormat,
            "authors": project.ext.legacyAuthors
    )
    filesMatching("META-INF/mods.toml") {
        expand(
                "version": project.version,
                "loaderMajor": project.ext.legacyForgeLoaderMajor,
                "forgeVersion": project.ext.legacyForgeVersion,
                "minecraftVersion": gameVersion,
                "minecraftNextVersion": project.ext.legacyMinecraftNextVersion,
                "authors": project.ext.legacyAuthors
        )
    }
    filesMatching("pack.mcmeta") {
        expand "packFormat": project.ext.legacyPackFormat
    }
}

tasks.named("jar", Jar).configure {
    archiveClassifier = "dev"
    manifest {
        attributes "MixinConfigs": "universal-translator.forge.mixins.json"
    }
    from(rootProject.file("LICENSE")) {
        rename { "LICENSE_universal_translator" }
    }
    from(rootProject.file("docs/en/THIRD_PARTY_OFFLINE.md")) {
        rename { "THIRD_PARTY_OFFLINE.md" }
    }
}

tasks.register("releaseJar", Copy) {
    dependsOn tasks.named("renameJar")
    from(tasks.named("renameJar").flatMap { it.output })
    into(layout.buildDirectory.dir("release"))
    rename { "mc-auto-translation-tool-forge-${gameVersion}-${project.version}.jar" }
}

def normalizedReleaseJar = layout.buildDirectory.file(
        "release/mc-auto-translation-tool-forge-${gameVersion}-${project.version}.jar")

tasks.register("verifyBuiltJar", Exec) {
    group = "verification"
    description = "Validates the SRG-remapped Forge release JAR."
    dependsOn tasks.named("releaseJar")
    inputs.file(normalizedReleaseJar)
    inputs.file(rootProject.file("scripts/verify_release_jars.py"))
    doFirst {
        commandLine(
                "python",
                rootProject.file("scripts/verify_release_jars.py"),
                normalizedReleaseJar.get().asFile
        )
    }
}

tasks.named("build").configure {
    dependsOn tasks.named("releaseJar"), tasks.named("verifyBuiltJar")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    if ((project.ext.legacyJavaRelease as int) == 8) {
        sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
    } else {
        options.release = project.ext.legacyJavaRelease as int
    }
}
