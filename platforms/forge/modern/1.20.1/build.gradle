plugins {
    id "java"
    id "net.minecraftforge.gradle" version "[7.0.29,8.0)"
    id "net.minecraftforge.renamer" version "1.0.14"
}

ext.legacyMinecraftVersion = "1.20.1"
ext.legacyForgeVersion = "47.4.10"
ext.legacyForgeLoaderMajor = "47"
ext.legacyMinecraftNextVersion = "1.20.2"
ext.legacyJavaRelease = 17
ext.legacyPackFormat = 15
ext.legacyAuthors = "我小张7272635"

apply from: rootProject.file("platforms/forge/modern/shared.gradle")

// The settings screens are shared with the Forge 1.21 tree, so they live outside both trees.
sourceSets {
    main {
        java.srcDir new File(rootProject.file("platforms/forge/shared/screens/1.20.1-1.21.11"),
                "src/main/java")
    }
}
