plugins {
    id "java"
    id "net.minecraftforge.gradle" version "[7.0.29,8.0)"
    id "net.minecraftforge.renamer" version "1.0.14"
}

ext.legacyMinecraftVersion = "1.18.2"
ext.legacyForgeVersion = "40.2.21"
ext.legacyForgeLoaderMajor = "40"
ext.legacyMinecraftNextVersion = "1.19"
// settings.gradle's treeJavaRelease is the one table the Mixin compatibilityLevel bounds come from;
// reading it here keeps this module from being compiled for a level those bounds do not describe.
ext.legacyJavaRelease = gradle.ext.treeJavaTarget("platforms/forge/modern/1.18.2/")
ext.legacyPackFormat = 8
ext.legacyAuthors = "我小张7272635"

apply from: rootProject.file("platforms/forge/modern/shared.gradle")
