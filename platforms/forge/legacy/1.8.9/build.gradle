buildscript {
    repositories {
        maven { url = "https://maven.minecraftforge.net" }
        mavenCentral()
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT"
    }
}

apply plugin: "net.minecraftforge.gradle.forge"

def releaseProperties = new Properties()
file("../../../../gradle.properties").withInputStream { releaseProperties.load(it) }

version = releaseProperties.getProperty("mod_version")
group = "org.universaltranslator"
archivesBaseName = "mc-auto-translation-tool-forge-1.8.9"

sourceCompatibility = targetCompatibility = "1.8"

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
}

sourceSets.main.java.srcDirs += [
        "../../../../translator-core/src/main/java",
        "../../shared/legacy-common/src/main/java"
]
sourceSets.main.resources.srcDir file("../../../../platforms/shared/lang/legacy-forge")

processResources {
    filteringCharset = "UTF-8"
    inputs.property "version", project.version
    // The mod-list icon is the same 4,004-byte file every other release JAR ships, and it has one
    // source: platforms/shared/lang/json. This build is standalone, so
    // rootProject.file("gradle/bundle-icon.gradle") is out of reach and the single entry is copied
    // by path. Only the icon: that directory also holds the 1.13+ lang JSON, which 1.8.9 never reads.
    // mcmod.info's logoFile is read by net.minecraftforge.fml.client.GuiModList#updateCache through
    // getClass().getResourceAsStream(logoFile) on Forge's own class, so the value declared there is a
    // leading-slash classpath name: a bare "assets/…" would resolve against net/minecraftforge/fml/client/.
    from("../../../../platforms/shared/lang/json/assets/universal_translator/icon.png") {
        into "assets/universal_translator"
    }
    filesMatching("mcmod.info") {
        expand version: project.version
    }
}

jar {
    // These two builds are standalone Gradle builds whose rootProject is this directory, so
    // gradle/jar-contents.gradle (which resolves rootProject.file("LICENSE")) cannot be applied
    // here. The attachment names are repeated instead, matching the other 46 release JARs; the
    // verifier only requires a name starting with "LICENSE", so a bare LICENSE went unnoticed.
    from("../../../../LICENSE") {
        rename { "LICENSE_universal_translator" }
    }
    from("../../../../docs/en/THIRD_PARTY_OFFLINE.md") {
        rename { "THIRD_PARTY_OFFLINE.md" }
    }
    manifest {
        attributes(
                "FMLCorePlugin": "org.universaltranslator.forge.v189.LegacyCorePlugin",
                "FMLCorePluginContainsFMLMod": "true",
                "ForceLoadAsMod": "true"
        )
    }
}
