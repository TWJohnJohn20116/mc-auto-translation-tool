buildscript {
    repositories {
        maven { url = "https://maven.minecraftforge.net" }
        mavenCentral()
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:3.0.197"
    }
}

apply plugin: "net.minecraftforge.gradle"

def releaseProperties = new Properties()
file("../../../../gradle.properties").withInputStream { releaseProperties.load(it) }

version = releaseProperties.getProperty("mod_version")
group = "org.universaltranslator"
archivesBaseName = "mc-auto-translation-tool-forge-1.12.2"

sourceCompatibility = targetCompatibility = "1.8"

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

minecraft {
    mappings channel: "stable", version: "39-1.12"
}

dependencies {
    minecraft "net.minecraftforge:forge:1.12.2-14.23.5.2860"
}

sourceSets.main.java.srcDirs += [
        "../../../../translator-core/src/main/java",
        "../../shared/legacy-common/src/main/java"
]
sourceSets.main.resources.srcDir file("../../../../platforms/shared/lang/legacy-forge")

processResources {
    filteringCharset = "UTF-8"
    inputs.property "version", project.version
    // Same one-source icon as 1.8.9 (and as every other release JAR): the entry is copied from
    // platforms/shared/lang/json by path because this build is standalone. Only the icon — the
    // 1.13+ lang JSON in that directory is never read by 1.12.2.
    // mcmod.info's logoFile goes through the same getClass().getResourceAsStream(logoFile) as 1.8.9
    // (see that build), hence the leading slash: it is a classpath name, not an assets/ path.
    from("../../../../platforms/shared/lang/json/assets/universal_translator/icon.png") {
        into "assets/universal_translator"
    }
    filesMatching("mcmod.info") {
        expand version: project.version
    }
    // Minecraft 1.11 renamed the language files from en_US.lang to en_us.lang while 1.8.9, which
    // shares this resource directory, still reads the uppercase name and one directory can hold one
    // spelling. The lowercase alias is generated here so the two spellings cannot drift apart.
    project.sourceSets.main.resources.srcDirs.each { resourceRoot ->
        def langDir = new File(resourceRoot, "assets/universal_translator/lang")
        if (langDir.isDirectory()) {
            from(langDir) {
                include "*.lang"
                rename { String name -> name.toLowerCase(Locale.ROOT) }
                into "assets/universal_translator/lang"
            }
        }
    }
}

jar {
    // These two builds are standalone Gradle builds whose rootProject is this directory, so
    // gradle/jar-contents.gradle (which resolves rootProject.file("LICENSE")) cannot be applied
    // here. The attachment names are repeated instead, matching the other 46 release JARs; the
    // verifier only requires a name starting with "LICENSE", so a bare LICENSE went unnoticed.
    from("../../../../LICENSE") {
        rename { "LICENSE_universal_translator" }
    }
    from("../../../../docs/en/THIRD_PARTY_OFFLINE.md") {
        rename { "THIRD_PARTY_OFFLINE.md" }
    }
    manifest {
        attributes(
                "FMLCorePlugin": "org.universaltranslator.forge.v1122.LegacyCorePlugin",
                "FMLCorePluginContainsFMLMod": "true",
                "ForceLoadAsMod": "true"
        )
    }
}

jar.finalizedBy("reobfJar")
