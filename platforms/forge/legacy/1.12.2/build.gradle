buildscript {
    repositories {
        maven { url = "https://maven.minecraftforge.net" }
        mavenCentral()
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:3.0.197"
    }
}

apply plugin: "net.minecraftforge.gradle"

def releaseProperties = new Properties()
file("../../../../gradle.properties").withInputStream { releaseProperties.load(it) }

version = releaseProperties.getProperty("mod_version")
group = "org.universaltranslator"
archivesBaseName = "mc-auto-translation-tool-forge-1.12.2"

sourceCompatibility = targetCompatibility = "1.8"

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
}

minecraft {
    mappings channel: "stable", version: "39-1.12"
}

dependencies {
    minecraft "net.minecraftforge:forge:1.12.2-14.23.5.2860"
}

sourceSets.main.java.srcDirs += [
        "../../../../translator-core/src/main/java",
        "../../shared/legacy-common/src/main/java"
]
sourceSets.main.resources.srcDir file("../../../../platforms/shared/lang/legacy-forge")

processResources {
    filteringCharset = "UTF-8"
    inputs.property "version", project.version
    filesMatching("mcmod.info") {
        expand version: project.version
    }
}

jar {
    // These two builds are standalone Gradle builds whose rootProject is this directory, so
    // gradle/jar-contents.gradle (which resolves rootProject.file("LICENSE")) cannot be applied
    // here. The attachment names are repeated instead, matching the other 46 release JARs; the
    // verifier only requires a name starting with "LICENSE", so a bare LICENSE went unnoticed.
    from("../../../../LICENSE") {
        rename { "LICENSE_universal_translator" }
    }
    from("../../../../docs/en/THIRD_PARTY_OFFLINE.md") {
        rename { "THIRD_PARTY_OFFLINE.md" }
    }
    manifest {
        attributes(
                "FMLCorePlugin": "org.universaltranslator.forge.v1122.LegacyCorePlugin",
                "FMLCorePluginContainsFMLMod": "true",
                "ForceLoadAsMod": "true"
        )
    }
}

jar.finalizedBy("reobfJar")
