def requiredProperties = [
        "forgeMinecraftVersion",
        "forgeVersion",
        "forgeLoaderMajor",
        "forgeMinecraftNextVersion",
        "forgeJavaRelease"
]
requiredProperties.each { propertyName ->
    if (!project.ext.has(propertyName)) {
        throw new GradleException("Missing ${propertyName} before applying Forge shared.gradle")
    }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "mc-auto-translation-tool-forge-${project.ext.forgeMinecraftVersion}"
}

minecraft {
    mappings channel: "official", version: project.ext.forgeMinecraftVersion
    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir("run")
            args "--mixin.config=universal-translator.forge.mixins.json"
            if (System.getProperty("os.name").startsWith("Mac")) {
                jvmArgs "-XstartOnFirstThread"
            }
        }
        register("client") {
            // Explicitly join the compiled classes and processed resources into one
            // development mod. Forge 61 otherwise discovers mods.toml as a resources-only
            // mod file and cannot see the @Mod class from our shared source directories.
            mods.create("universal_translator") {
                source(sourceSets.main)
            }
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency(
            "net.minecraftforge:forge:${project.ext.forgeMinecraftVersion}-${project.ext.forgeVersion}")
    if (project.ext.has("forgeUseEventBusValidator") && project.ext.forgeUseEventBusValidator) {
        annotationProcessor "net.minecraftforge:eventbus-validator:7.0.5"
    }
    annotationProcessor "org.spongepowered:mixin:0.8.7:processor"
}

def globalSharedRoot = rootProject.file("platforms/forge/shared")
sourceSets {
    main {
        // ForgeConfig is identical in every Forge tree (1.21, 26.x, modern), so it lives here
        // once. Targets that do not apply this script (the modern tree) add this one directory
        // themselves; see platforms/forge/modern/shared.gradle.
        java.srcDir new File(globalSharedRoot, "common/src/main/java")
        resources.srcDir new File(globalSharedRoot, "common/src/main/resources")
        resources.srcDir rootProject.file("platforms/shared/lang/json")
    }
}

// Forge 61 and newer treat Java classes and processed resources as independent
// userdev mod roots unless both outputs share a directory. Keep mods.toml beside
// the @Mod class, matching the layout of the published JAR.
if ((project.ext.forgeLoaderMajor as String).toInteger() >= 61) {
    sourceSets.main.output.resourcesDir = sourceSets.main.java.classesDirectory.get().asFile
}

tasks.named("processResources", ProcessResources).configure {
    inputs.properties(
            "version": project.version,
            "forgeLoaderMajor": project.ext.forgeLoaderMajor,
            "forgeDependencyVersion": project.ext.forgeVersion,
            "minecraftVersion": project.ext.forgeMinecraftVersion,
            "minecraftNextVersion": project.ext.forgeMinecraftNextVersion
    )
    filesMatching("META-INF/mods.toml") {
        expand(
                "version": project.version,
                "forgeLoaderMajor": project.ext.forgeLoaderMajor,
                "forgeDependencyVersion": project.ext.forgeVersion,
                "minecraftVersion": project.ext.forgeMinecraftVersion,
                "minecraftNextVersion": project.ext.forgeMinecraftNextVersion
        )
    }
}

tasks.named("jar", Jar).configure {
    manifest {
        attributes "MixinConfigs": "universal-translator.forge.mixins.json"
    }
    // When resourcesDir is pointed at the classes directory (loader >= 61) the same resource reaches
    // the archive from both classesDirs and resourcesDir; Jar defaults to INCLUDE, so mods.toml,
    // pack.mcmeta and the mixin config were each written twice per jar.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Mixin's refmap is produced by an annotation processor whose key order follows HashMap iteration,
// so two builds of identical inputs produce different bytes. Only the modern tree opted out of the
// build cache, which left the 15 targets on this script (all of 1.21 and 26.x) free to swap refmaps
// between projects that share platforms/forge/shared/** — and a swapped refmap makes Forge silently
// apply no mixin at all when defaultRequire is 0.
tasks.named("compileJava", JavaCompile).configure {
    outputs.cacheIf { false }
    outputs.file(layout.buildDirectory.file("tmp/compileJava/compileJava-refmap.json"))
            .withPropertyName("mixinRefmap")
            .optional()
    outputs.file(layout.buildDirectory.file("tmp/compileJava/compileJava-mappings.tsrg"))
            .withPropertyName("mixinMappings")
            .optional()
}

apply from: rootProject.file("gradle/jar-contents.gradle")

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = project.ext.forgeJavaRelease as int
}
