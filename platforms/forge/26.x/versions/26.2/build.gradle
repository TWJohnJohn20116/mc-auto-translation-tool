plugins {
    id "java"
    id "net.minecraftforge.gradle" version "[7.0.29,8.0)"
}

ext.forgeMinecraftVersion = "26.2"
ext.forgeVersion = "65.1.1"
ext.forgeLoaderMajor = "65"
ext.forgeMinecraftNextVersion = "26.3"
ext.forgeUseEventBusValidator = true
// Resource pack format from the client's version.json (26.2 = 88.0), not the data pack format (107).
ext.forgeResourcePackFormat = 88

apply from: rootProject.file("platforms/forge/26.x/shared.gradle")
