// This tree expands ${resourcePackFormat} in pack.mcmeta unconditionally, so a version module that
// forgets the coordinate used to fail inside processResources with "Cannot get property
// 'forgeResourcePackFormat' on extra properties extension" pointing at this file instead of at the
// version directory that is missing the line.
if (!project.ext.has("forgeResourcePackFormat")) {
    throw new GradleException(
            "Missing forgeResourcePackFormat before applying Forge 26.x shared.gradle for ${project.path}")
}

def sourceLayers = [
        "26.1"  : "api/26.1-26.1.2",
        "26.1.1": "api/26.1-26.1.2",
        "26.1.2": "api/26.1-26.1.2",
        "26.2"  : "api/26.2"
]

def gameVersion = project.name - "platform-forge-"
def sourceLayer = sourceLayers[gameVersion]
if (sourceLayer == null) {
    throw new GradleException("No Forge 26.x source layer is registered for ${gameVersion}")
}

def sharedRoot = rootProject.file("platforms/forge/26.x/shared")
sourceSets {
    main {
        java.srcDir project(":translator-core").file("src/main/java")
        java.srcDir new File(sharedRoot, "common/src/main/java")
        // RenderedTextBridge is shared with the 1.21 tree and Forge 1.19.2+; see
        // platforms/forge/shared/rendered-1.19.2-plus.
        java.srcDir new File(rootProject.file("platforms/forge/shared"),
                "rendered-1.19.2-plus/src/main/java")
        // ForgeLocalTextGuard is shared with Forge 1.18.2+ and 1.21; 26.2 reads the chat field
        // through client.gui.screen() and keeps its own copy.
        if (sourceLayer == "api/26.1-26.1.2") {
            java.srcDir new File(rootProject.file("platforms/forge/shared"),
                    "local-guard-1.18.2-plus/src/main/java")
        }
        // ForgeTranslationRuntime is shared with Forge 1.21.9–1.21.11.
        java.srcDir new File(rootProject.file("platforms/forge/shared"),
                "runtime-1.21.9-plus/src/main/java")
        java.srcDir new File(sharedRoot, "${sourceLayer}/src/main/java")
        resources.srcDir new File(sharedRoot, "common/src/main/resources")
    }
}

project.ext.forgeJavaRelease = 25
apply from: rootProject.file("platforms/forge/shared.gradle")

tasks.named("processResources", ProcessResources).configure {
    inputs.property "resourcePackFormat", project.ext.forgeResourcePackFormat
    filesMatching("pack.mcmeta") {
        expand "resourcePackFormat": project.ext.forgeResourcePackFormat
    }
}
