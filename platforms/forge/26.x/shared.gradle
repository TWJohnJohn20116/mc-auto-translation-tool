// This tree expands ${resourcePackFormat} in pack.mcmeta unconditionally, so a version module that
// forgets the coordinate used to fail inside processResources with "Cannot get property
// 'forgeResourcePackFormat' on extra properties extension" pointing at this file instead of at the
// version directory that is missing the line.
if (!project.ext.has("forgeResourcePackFormat")) {
    throw new GradleException(
            "Missing forgeResourcePackFormat before applying Forge 26.x shared.gradle for ${project.path}")
}

def sourceLayers = [
        "26.1"  : "api/26.1-26.1.2",
        "26.1.1": "api/26.1-26.1.2",
        "26.1.2": "api/26.1-26.1.2",
        "26.2"  : "api/26.2"
]

// Groovy's String.minus removes the first occurrence of the substring, not a prefix, so this only
// derived the right version while the project name contained "platform-forge-" exactly once. Strip the
// prefix explicitly so the value the sourceLayers lookup uses cannot differ from the directory name.
def gameVersion = project.name.startsWith("platform-forge-")
        ? project.name.substring("platform-forge-".length())
        : project.name
def sourceLayer = sourceLayers[gameVersion]
if (sourceLayer == null) {
    throw new GradleException("No Forge 26.x source layer is registered for ${gameVersion}")
}

// The number pack.mcmeta has to carry is the client's resource pack format, which only exists inside the
// client jar (version.json), so it cannot be derived here. Every 26.x module declared the data pack
// format instead, which made the pack incompatible with its own client and every language file
// unreadable while the build stayed green; this table is what makes that mistake fail.
def resourcePackFormats = [
        "26.1"  : 84,
        "26.1.1": 84,
        "26.1.2": 84,
        "26.2"  : 88
]
def expectedResourcePackFormat = resourcePackFormats[gameVersion]
if (expectedResourcePackFormat == null || project.ext.forgeResourcePackFormat != expectedResourcePackFormat) {
    throw new GradleException(
            "Forge 26.x '${gameVersion}' declares forgeResourcePackFormat " +
                    "${project.ext.forgeResourcePackFormat}, but its client's version.json resource " +
                    "format is ${expectedResourcePackFormat}; add the version and its resource_major to " +
                    "resourcePackFormats in platforms/forge/26.x/shared.gradle")
}

def sharedRoot = rootProject.file("platforms/forge/26.x/shared")
sourceSets {
    main {
        java.srcDir project(":translator-core").file("src/main/java")
        java.srcDir new File(sharedRoot, "common/src/main/java")
        // RenderedTextBridge is shared with the 1.21 tree and Forge 1.19.2+; see
        // platforms/forge/shared/rendered-1.19.2-plus.
        java.srcDir new File(rootProject.file("platforms/forge/shared"),
                "rendered-1.19.2-plus/src/main/java")
        // ForgeLocalTextGuard is shared with Forge 1.18.2+ and 1.21, but each 26.x generation reaches the
        // chat field differently - client.gui.screen() here, client.screen under 26.1-26.1.2 - so both
        // api layers keep their own copy instead of mounting local-guard-1.18.2-plus.
        // ForgeTranslationRuntime is shared with Forge 1.21.9–1.21.11.
        java.srcDir new File(rootProject.file("platforms/forge/shared"),
                "runtime-1.21.9-plus/src/main/java")
        java.srcDir new File(sharedRoot, "${sourceLayer}/src/main/java")
        resources.srcDir new File(sharedRoot, "common/src/main/resources")
    }
}

// The release this tree compiles for comes from settings.gradle's treeJavaRelease — the same table the
// Mixin compatibilityLevel bounds are derived from — instead of being a second copy of the number that
// the bounds would not follow.
project.ext.forgeJavaRelease = gradle.ext.treeJavaTarget("platforms/forge/26.x/")
apply from: rootProject.file("platforms/forge/shared.gradle")

tasks.named("processResources", ProcessResources).configure {
    inputs.property "resourcePackFormat", project.ext.forgeResourcePackFormat
    filesMatching("pack.mcmeta") {
        expand "resourcePackFormat": project.ext.forgeResourcePackFormat
    }
}

// The reverse mixin check is applied by platforms/forge/shared.gradle, which this tree applies above, so
// these four assets run it without a second apply here: registering verifyMixinConfigCoverage twice in
// one project is a configuration-time failure, not a stricter check.
