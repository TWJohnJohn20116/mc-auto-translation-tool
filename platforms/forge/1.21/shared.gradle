def versionFamilies = [
        "1.21-1.21.5"  : ["1.21", "1.21.1", "1.21.3", "1.21.4", "1.21.5"],
        "1.21.6-1.21.8": ["1.21.6", "1.21.7", "1.21.8"],
        "1.21.9-1.21.11": ["1.21.9", "1.21.10", "1.21.11"]
]

def gameVersion = project.name - "platform-forge-"
def family = versionFamilies.find { entry -> entry.value.contains(gameVersion) }?.key
if (family == null) {
    throw new GradleException("No Forge 1.21 source family is registered for ${project.name}")
}
def modFamily = versionFamilies["1.21-1.21.5"].contains(gameVersion) ||
        versionFamilies["1.21.6-1.21.8"].contains(gameVersion) ?
        "1.21-1.21.8" : "1.21.9-1.21.11"

def sharedRoot = rootProject.file("platforms/forge/1.21/shared")
// The settings screens are shared with Forge 1.20.1 as well, so they live outside the 1.21 tree.
def screensRoot = rootProject.file("platforms/forge/shared/screens/1.18.2-1.21.11")
def widgetsRoot = rootProject.file("platforms/forge/shared/widgets/1.20.1-1.21.11")
// Files that adjacent families compile identically live in their own layer instead of being
// copied into every family directory.
def sharedLayers = []
if (family != "1.21.9-1.21.11") {
    sharedLayers << "runtime/1.21-1.21.8"
}
if (family != "1.21-1.21.5") {
    sharedLayers << "draw-context/1.21.6-1.21.11"
}
sourceSets {
    main {
        java.srcDir project(":translator-core").file("src/main/java")
        java.srcDir new File(sharedRoot, "common/src/main/java")
        // RenderedTextBridge is shared with the 26.x tree and Forge 1.19.2+; see
        // platforms/forge/shared/rendered-1.19.2-plus.
        java.srcDir new File(rootProject.file("platforms/forge/shared"),
                "rendered-1.19.2-plus/src/main/java")
        // ForgeLocalTextGuard is shared with Forge 1.18.2+ and 26.1–26.1.2; 1.16.5 and 26.2 keep
        // their own copies because they read the chat field through a different API.
        java.srcDir new File(rootProject.file("platforms/forge/shared"),
                "local-guard-1.18.2-plus/src/main/java")
        java.srcDir new File(screensRoot, "src/main/java")
        java.srcDir new File(widgetsRoot, "src/main/java")
        sharedLayers.each { layer ->
            java.srcDir new File(sharedRoot, "${layer}/src/main/java")
        }
        java.srcDir new File(sharedRoot, "${family}/src/main/java")
        java.srcDir new File(sharedRoot, "mod/${modFamily}/src/main/java")
        resources.srcDir new File(sharedRoot, "common/src/main/resources")
    }
}

project.ext.forgeJavaRelease = 21
apply from: rootProject.file("platforms/forge/shared.gradle")
