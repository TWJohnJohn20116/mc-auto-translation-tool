name: 帶重試的 Gradle 建置
description: >-
  執行 Gradle 建置。只有在失敗原因看起來是網路或依賴解析問題時才自動重試，
  避免暫時性的 Maven 故障讓整個 run 變成假紅燈（neoforge-1.20.1 曾因此失敗過一次）。

inputs:
  args:
    description: 傳給 Gradle 的參數與任務。
    required: true
  working-directory:
    description: 執行目錄；獨立 Gradle 建置（舊版 Forge 1.8.9／1.12.2）使用。
    required: false
    default: .
  attempts:
    description: 最多嘗試次數。
    required: false
    default: "3"
  cache-key:
    description: >-
      這個建置的快取識別，通常傳目標名稱。只有名稱含 forge 的目標會真的用到：ForgeGradle 的
      Minecraft Mavenizer 在**配置階段**就要跑 3～4 分鐘（2026-10-04 實測 forge-1.21.11 的
      Gradle 建置 4m44s 裡有 3m57s 是它），而 setup-gradle 的 basic 快取模式所有 job 共用同一把
      key（官方文件：`setup-java-{RUNNER_OS}-{arch}-gradle-{hash}`，不含 job 名稱，且不支援
      restore keys 與覆寫），所以第一個存進去的 job 就決定了內容，Mavenizer 的快取永遠是冷的。
      這裡改用每目標一把 key 的 actions/cache 補上。留空則完全略過。
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: 快取 ForgeGradle Mavenizer
      if: contains(inputs.cache-key, 'forge')
      uses: actions/cache@v6
      with:
        # Mavenizer 的快取目錄在 Gradle User Home 裡；它的輸出（轉換後的 Maven repo）
        # 則在工作區的 .gradle/mavenizer。舊版 Forge 是獨立 Gradle 建置，輸出會在它自己的
        # 工作目錄下，所以用 ** 比對。
        path: |
          ~/.gradle/caches/minecraftforge
          **/.gradle/mavenizer
        # key 刻意不雜湊 Gradle 檔案的內容：gradle.properties 裡有 mod_version，每次發布都會變，
        # 雜湊進去的話每次發版都會讓所有 Mavenizer 快取失效。Mavenizer 的快取本身是以 Minecraft
        # 版本為單位、內容有校驗，留著舊版本只會多佔一點空間，不會用錯。
        # restore-keys 只認 OS 是刻意的：新目標可以沿用別的目標已經抓好的 ForgeGradle 工具
        # （installertools／mergetool／ForgeAutoRenamingTool／forgeflower）。
        key: mavenizer-${{ runner.os }}-${{ inputs.cache-key }}
        restore-keys: |
          mavenizer-${{ runner.os }}-

    - name: 執行 Gradle
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GRADLE_ARGS: ${{ inputs.args }}
        MAX_ATTEMPTS: ${{ inputs.attempts }}
      run: |
        # GitHub 是用 `bash -e` 執行 run:（log 裡的 shell 就是 /usr/bin/bash -e），
        # errexit 預設是開的。那會讓失敗的 `./gradlew | tee` 直接結束整個 script
        # （pipefail 把 gradle 的狀態傳出來），底下的重試邏輯永遠跑不到——這個 bug
        # 讓這個 action 上線後其實一次都沒重試過。這裡明確關掉 errexit，改用自己的
        # 狀態判斷。要驗證時必須用 `bash -e script.sh` 模擬 runner，否則測不出來。
        set +e
        set -uo pipefail
        read -r -a gradle_args <<< "$GRADLE_ARGS"
        log="$(mktemp)"
        attempt=1
        while true; do
          # tee 會覆寫 log，所以底下的 grep 只看得到本次嘗試的輸出。
          ./gradlew "${gradle_args[@]}" 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi
          if [[ "$attempt" -ge "$MAX_ATTEMPTS" ]]; then
            echo "::error::Gradle 建置連續失敗 $attempt 次，放棄"
            exit "$status"
          fi
          # -i 很重要：Gradle 的訊息大小寫不一致。實際案例是 ForgeGradle 外掛解析失敗
          # 時吐的是小寫的 "could not resolve plugin artifact"，用區分大小寫的 grep
          # 會漏掉，於是明明該重試卻直接放棄（2026-10-04 三個 job 同時中）。
          if grep -qiE 'Could not resolve|Could not GET|Could not HEAD|Connection reset|Read timed out|Temporary failure in name resolution|502 Bad Gateway|503 Service Unavailable|Received status code 5' "$log"; then
            attempt=$((attempt + 1))
            echo "::warning::疑似網路或依賴解析失敗，10 秒後重試（第 $attempt 次，最多 $MAX_ATTEMPTS 次）"
            sleep 10
            continue
          fi
          echo "::error::建置失敗，且原因不像網路問題，不重試"
          exit "$status"
        done
