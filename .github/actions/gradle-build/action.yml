name: 帶重試的 Gradle 建置
description: >-
  執行 Gradle 建置。只有在失敗原因看起來是網路或依賴解析問題時才自動重試，
  避免暫時性的 Maven 故障讓整個 run 變成假紅燈（neoforge-1.20.1 曾因此失敗過一次）。

inputs:
  args:
    description: 傳給 Gradle 的參數與任務。
    required: true
  working-directory:
    description: 執行目錄；獨立 Gradle 建置（舊版 Forge 1.8.9／1.12.2）使用。
    required: false
    default: .
  attempts:
    description: 最多嘗試次數。
    required: false
    default: "3"

runs:
  using: composite
  steps:
    - name: 執行 Gradle
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GRADLE_ARGS: ${{ inputs.args }}
        MAX_ATTEMPTS: ${{ inputs.attempts }}
      run: |
        # GitHub 是用 `bash -e` 執行 run:（log 裡的 shell 就是 /usr/bin/bash -e），
        # errexit 預設是開的。那會讓失敗的 `./gradlew | tee` 直接結束整個 script
        # （pipefail 把 gradle 的狀態傳出來），底下的重試邏輯永遠跑不到——這個 bug
        # 讓這個 action 上線後其實一次都沒重試過。這裡明確關掉 errexit，改用自己的
        # 狀態判斷。要驗證時必須用 `bash -e script.sh` 模擬 runner，否則測不出來。
        set +e
        set -uo pipefail
        read -r -a gradle_args <<< "$GRADLE_ARGS"
        log="$(mktemp)"
        attempt=1
        while true; do
          # tee 會覆寫 log，所以底下的 grep 只看得到本次嘗試的輸出。
          ./gradlew "${gradle_args[@]}" 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          if [[ "$status" -eq 0 ]]; then
            exit 0
          fi
          if [[ "$attempt" -ge "$MAX_ATTEMPTS" ]]; then
            echo "::error::Gradle 建置連續失敗 $attempt 次，放棄"
            exit "$status"
          fi
          # -i 很重要：Gradle 的訊息大小寫不一致。實際案例是 ForgeGradle 外掛解析失敗
          # 時吐的是小寫的 "could not resolve plugin artifact"，用區分大小寫的 grep
          # 會漏掉，於是明明該重試卻直接放棄（2026-10-04 三個 job 同時中）。
          # 下載類的訊息也要納入：Loom 抓 Minecraft 失敗時只吐
          # "Failed to setup Minecraft, ...DownloadException: Failed to download"，
          # 不在原本的清單裡，於是 2026-10-06 的 fabric-1.19.2 暫時性網路失敗被當成
          # 程式錯誤、一次都沒重試（同一個 PR 的其他目標全綠，紅燈純屬假警報）。
          if grep -qiE 'Could not resolve|Could not GET|Could not HEAD|Connection reset|Read timed out|Temporary failure in name resolution|502 Bad Gateway|503 Service Unavailable|Received status code 5|Failed to download|Could not download|DownloadException|Failed to setup Minecraft' "$log"; then
            attempt=$((attempt + 1))
            echo "::warning::疑似網路或依賴解析失敗，10 秒後重試（第 $attempt 次，最多 $MAX_ATTEMPTS 次）"
            sleep 10
            continue
          fi
          echo "::error::建置失敗，且原因不像網路問題，不重試"
          exit "$status"
        done
