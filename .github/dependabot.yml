version: 2

updates:
  # workflow 內用到的 action 版本。一次開一個 PR 更新所有 action，避免五個 PR 各跑一輪
  # 25 個 job 的建置。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:40"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # website/ 是 Next.js + pnpm，package.json 與 pnpm-lock.yaml 都有進版控。
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
      time: "03:50"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      # 只把 minor／patch 合成一個 PR。major 會個別開 PR：它們會改變行為、需要單獨審查與
      # 測試，混在一起會讓整個 PR 無法合併。2026-10-04 的 #69 就是 23 個更新裡夾了
      # eslint 9→10、typescript 5→7、@types/node 22→26，網站檢查（lint + build）直接紅燈。
      website:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # 刻意沒有加 gradle 生態：這個專案的 Loom／ForgeGradle 版本與各 Minecraft 版本綁死
  # （例如 loom_version 必須配合 Gradle 9），自動開的升級 PR 大多是壞的，而每個 PR 都會
  # 跑一輪 25 個 job 的完整建置。Gradle 相依的安全性警示仍由 Dependabot alerts 涵蓋，
  # 不需要這個檔案。
