name: 舊版目標

# The Ornithe/legacy Fabric bundles (Minecraft 1.0-1.15) and the two standalone
# Forge 1.8.9 / 1.12.2 Gradle builds are the slowest work in this repository:
# they download and remap/decompile many old Minecraft versions. They are kept
# out of the pull-request path on purpose so that `Build` stays fast, and are
# verified here on a schedule and on demand instead.
#
# Scheduled workflows only run from the default branch, so this file starts
# running after it lands on `main`.

on:
  schedule:
    # Mondays 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      targets:
        description: >-
          Comma-separated targets to build, for example
          "fabric-1.13.x,forge-legacy-1.8.9". Leave empty to build every legacy
          target.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: legacy-targets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: 解析建置目標
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - name: 解析要建置的目標
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.targets }}
        run: |
          set -euo pipefail
          # Whitespace is stripped here because GitHub expressions provide no
          # replace()/trim(); the jobs below match comma-wrapped target names.
          requested="$(printf '%s' "${REQUESTED:-}" | tr -d '[:space:]')"
          if [[ "${EVENT_NAME:-}" != "workflow_dispatch" || -z "$requested" ]]; then
            echo "targets=" >> "$GITHUB_OUTPUT"
          else
            echo "targets=,$requested," >> "$GITHUB_OUTPUT"
          fi

  legacy-fabric:
    name: 建置舊版 Fabric ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fabric-1.0-1.8.x
          - target: fabric-1.8-1.12.x
          - target: fabric-1.13.x
          - target: fabric-1.14-1.15.x
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 設定 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 建置舊版 Fabric 整合包
        if: needs.plan.outputs.targets == '' || contains(needs.plan.outputs.targets, format(',{0},', matrix.target))
        run: ./gradlew --no-daemon --max-workers=2 -PtargetPlatform=${{ matrix.target }} :platform-${{ matrix.target }}:build

      - name: 上傳舊版 Fabric JAR
        if: >-
          success() && (needs.plan.outputs.targets == '' ||
          contains(needs.plan.outputs.targets, format(',{0},', matrix.target)))
        uses: actions/upload-artifact@v4
        with:
          name: legacy-fabric-${{ matrix.target }}
          path: platforms/**/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30

  legacy-forge:
    name: 建置舊版 Forge ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: forge-legacy-1.8.9
            dir: platforms/forge/legacy/1.8.9
          - target: forge-legacy-1.12.2
            dir: platforms/forge/legacy/1.12.2
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      # Standalone Gradle builds (Gradle 2.14.1 and 4.10.3 with ForgeGradle
      # 2.1 / 3.0) that need a full JDK 8.
      - name: 設定 Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: 建置舊版 Forge
        if: needs.plan.outputs.targets == '' || contains(needs.plan.outputs.targets, format(',{0},', matrix.target))
        working-directory: ${{ matrix.dir }}
        run: ./gradlew --no-daemon build

      - name: 上傳舊版 Forge JAR
        if: >-
          success() && (needs.plan.outputs.targets == '' ||
          contains(needs.plan.outputs.targets, format(',{0},', matrix.target)))
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.dir }}/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 30
