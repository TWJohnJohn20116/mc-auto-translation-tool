name: 舊版目標

# The Ornithe/legacy Fabric bundles (Minecraft 1.0-1.15) and the two standalone
# Forge 1.8.9 / 1.12.2 Gradle builds are the slowest work in this repository:
# they download and remap/decompile many old Minecraft versions. They are kept
# out of the pull-request path on purpose so that `Build` stays fast, and are
# verified here on a schedule and on demand instead.
#
# Scheduled workflows only run from the default branch, so this file starts
# running after it lands on `main`.

on:
  schedule:
    # Mondays 03:17 UTC.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      targets:
        description: >-
          Comma-separated targets to build, for example
          "fabric-1.13.x,forge-legacy-1.8.9". Leave empty to build every legacy
          target.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: legacy-targets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: 解析建置目標
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - name: 解析要建置的目標
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.targets }}
        run: |
          set -euo pipefail
          # Whitespace is stripped here because GitHub expressions provide no
          # replace()/trim(); the jobs below match comma-wrapped target names.
          requested="$(printf '%s' "${REQUESTED:-}" | tr -d '[:space:]')"
          if [[ "${EVENT_NAME:-}" != "workflow_dispatch" || -z "$requested" ]]; then
            echo "targets=" >> "$GITHUB_OUTPUT"
          else
            echo "targets=,$requested," >> "$GITHUB_OUTPUT"
          fi

  legacy-fabric:
    name: 建置舊版 Fabric ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # fabric-1.0-1.8.x 曾經長期紅燈（feather 版本對應錯誤），2026-10-04 已修好：12 個上游 mappings
    # 有問題的版本（1.0.0～1.2.5 與 1.6.2／1.7.3／1.7.5／1.7.7）從 bundle 移除，保留的 26 個版本
    # 都用 feather build.31，所以不再需要 continue-on-error。
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fabric-1.0-1.8.x
          - target: fabric-1.8-1.12.x
          - target: fabric-1.13.x
          - target: fabric-1.14-1.15.x
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v7

      - name: 設定 Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # v6 的預設快取是 Gradle 的商業服務（gradle-actions-caching），這裡明確
          # 用回開源的 GitHub Actions 快取實作，維持原本的行為與相依性。
          cache-provider: basic
          # 這個 action 的摘要只有英文且無法翻譯，成功時改由下面「寫入建置摘要」
          # 提供繁中摘要，失敗時才顯示它的英文面板方便對照 log。
          add-job-summary: on-failure

      - name: 建置舊版 Fabric 整合包
        id: build
        if: needs.plan.outputs.targets == '' || contains(needs.plan.outputs.targets, format(',{0},', matrix.target))
        uses: ./.github/actions/gradle-build
        with:
          args: --no-daemon --max-workers=2 -PtargetPlatform=${{ matrix.target }} :platform-${{ matrix.target }}:build

      - name: 上傳舊版 Fabric JAR
        if: >-
          success() && (needs.plan.outputs.targets == '' ||
          contains(needs.plan.outputs.targets, format(',{0},', matrix.target)))
        uses: actions/upload-artifact@v7
        with:
          name: legacy-fabric-${{ matrix.target }}
          path: platforms/**/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 3

      - name: 寫入建置摘要
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          OUTCOME: ${{ steps.build.outcome }}
          ARTIFACT: legacy-fabric-${{ matrix.target }}
        run: |
          case "${OUTCOME:-}" in
            success) result="成功" ;;
            failure) result="失敗" ;;
            skipped) result="略過（本次未要求）" ;;
            *) result="未知（${OUTCOME:-未執行}）" ;;
          esac
          version="$(sed -n 's|.*gradle-\([0-9][0-9.]*\)-.*|\1|p' gradle/wrapper/gradle-wrapper.properties | head -n 1 || true)"
          {
            echo "## 建置摘要"
            echo
            echo "| 項目 | 內容 |"
            echo "| --- | --- |"
            echo "| 目標 | ${TARGET:-未指定} |"
            echo "| Gradle 版本 | ${version:-未知} |"
            echo "| 結果 | ${result} |"
            echo "| artifact | ${ARTIFACT:-無} |"
          } >> "$GITHUB_STEP_SUMMARY"

  legacy-forge:
    name: 建置舊版 Forge ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: forge-legacy-1.8.9
            dir: platforms/forge/legacy/1.8.9
          - target: forge-legacy-1.12.2
            dir: platforms/forge/legacy/1.12.2
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v7

      # Standalone Gradle builds (Gradle 2.14.1 and 4.10.3 with ForgeGradle
      # 2.1 / 3.0) that need a full JDK 8.
      - name: 設定 Java 8
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "8"

      - name: 建置舊版 Forge
        id: build
        if: needs.plan.outputs.targets == '' || contains(needs.plan.outputs.targets, format(',{0},', matrix.target))
        uses: ./.github/actions/gradle-build
        with:
          args: --no-daemon build
          working-directory: ${{ matrix.dir }}

      - name: 上傳舊版 Forge JAR
        if: >-
          success() && (needs.plan.outputs.targets == '' ||
          contains(needs.plan.outputs.targets, format(',{0},', matrix.target)))
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.dir }}/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 3

      - name: 寫入建置摘要
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          OUTCOME: ${{ steps.build.outcome }}
          ARTIFACT: ${{ matrix.target }}
        run: |
          case "${OUTCOME:-}" in
            success) result="成功" ;;
            failure) result="失敗" ;;
            skipped) result="略過（本次未要求）" ;;
            *) result="未知（${OUTCOME:-未執行}）" ;;
          esac
          version="$(sed -n 's|.*gradle-\([0-9][0-9.]*\)-.*|\1|p' gradle/wrapper/gradle-wrapper.properties | head -n 1 || true)"
          {
            echo "## 建置摘要"
            echo
            echo "| 項目 | 內容 |"
            echo "| --- | --- |"
            echo "| 目標 | ${TARGET:-未指定} |"
            echo "| Gradle 版本 | ${version:-未知} |"
            echo "| 結果 | ${result} |"
            echo "| artifact | ${ARTIFACT:-無} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # NeoForge 各版本要跑 Minecraft Mavenizer 與 ForgeGradle 的 decompile，單一目標就要
  # 3～5 分鐘，依 AGENTS.md 的規則放在這裡（排程／手動），不放進 PR 必經的 build.yml。
  # 這些目標過去只存在於 settings.gradle，從來沒有被任何 workflow 建置，也沒有發布過。
  neoforge-targets:
    name: 建置 NeoForge ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: neoforge-1.20.2
            java: "21"
          - target: neoforge-1.20.4
            java: "21"
          - target: neoforge-1.20.6
            java: "21"
          - target: neoforge-1.21
            java: "21"
          - target: neoforge-1.21.2
            java: "21"
          - target: neoforge-1.21.4
            java: "21"
          - target: neoforge-1.21.5
            java: "21"
          - target: neoforge-1.21.6
            java: "21"
          - target: neoforge-1.21.7
            java: "21"
          - target: neoforge-1.21.8
            java: "21"
          - target: neoforge-1.21.9
            java: "21"
          - target: neoforge-1.21.10
            java: "21"
          - target: neoforge-26.1
            java: "25"
          - target: neoforge-26.1.1
            java: "25"
          - target: neoforge-26.1.2
            java: "25"
          - target: neoforge-26.2
            java: "25"
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v7

      - name: 設定 Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          add-job-summary: on-failure

      - name: 建置 NeoForge 平台
        id: build
        if: needs.plan.outputs.targets == '' || contains(needs.plan.outputs.targets, format(',{0},', matrix.target))
        uses: ./.github/actions/gradle-build
        with:
          args: --no-daemon --max-workers=2 -PtargetPlatform=${{ matrix.target }} :platform-${{ matrix.target }}:build

      - name: 上傳 NeoForge JAR
        if: >-
          success() && (needs.plan.outputs.targets == '' ||
          contains(needs.plan.outputs.targets, format(',{0},', matrix.target)))
        uses: actions/upload-artifact@v7
        with:
          name: platform-${{ matrix.target }}
          path: platforms/**/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 3

      - name: 寫入建置摘要
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          OUTCOME: ${{ steps.build.outcome }}
          ARTIFACT: platform-${{ matrix.target }}
        run: |
          case "${OUTCOME:-}" in
            success) result="成功" ;;
            failure) result="失敗" ;;
            skipped) result="略過（本次未要求）" ;;
            *) result="未知（${OUTCOME:-未執行}）" ;;
          esac
          version="$(sed -n 's|.*gradle-\([0-9][0-9.]*\)-.*|\1|p' gradle/wrapper/gradle-wrapper.properties | head -n 1 || true)"
          {
            echo "## 建置摘要"
            echo
            echo "| 項目 | 內容 |"
            echo "| --- | --- |"
            echo "| 目標 | ${TARGET:-未指定} |"
            echo "| Gradle 版本 | ${version:-未知} |"
            echo "| 結果 | ${result} |"
            echo "| artifact | ${ARTIFACT:-無} |"
          } >> "$GITHUB_STEP_SUMMARY"
