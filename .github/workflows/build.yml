name: 主要建置

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      targets:
        description: >-
          Comma-separated platform targets to build, for example
          "fabric-1.21.x,forge-1.21.11". Add the keywords "legacy" and/or
          "release" for the legacy and release-asset jobs. Leave empty to run
          every job.
        required: false
        default: ""
        type: string

permissions:
  contents: read

# group 只含 workflow 與 ref 時，同一個 ref 上的 push 與 workflow_dispatch 共用一組，於是
# 連續兩個 commit 推上 main（或 push 後立刻手動 dispatch）會取消前一個執行：被取消的 run 不會
# 上傳 release-assets 產物，ci-status 的結果是 cancelled（不是 success／skipped），
# 在 main 與 PR 上都留下一筆查不到原因的失敗紀錄。只有 PR 才互相取消。
concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: 核心檢查
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v7

      - name: 設定 Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: 設定 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # v6 的預設快取是 Gradle 的商業服務（gradle-actions-caching），這裡明確
          # 用回開源的 GitHub Actions 快取實作，維持原本的行為與相依性。
          cache-provider: basic
          # 這個 action 的摘要只有英文且無法翻譯，成功時改由下面「寫入建置摘要」
          # 提供繁中摘要，失敗時才顯示它的英文面板方便對照 log。
          add-job-summary: on-failure

      - name: 執行檢查
        id: checks
        uses: ./.github/actions/gradle-build
        with:
          args: --no-daemon check

      - name: 檢查版本號一致性
        shell: bash
        run: |
          set -euo pipefail
          # 版本號在四個地方各有一份。過去漂移過一次（2026-10-06：UserAgent 停在 1.1，
          # 當時版本已是 1.3.11，每次下載模型都對外宣告三版前的版本號），這裡讓漂移在
          # PR 上就紅，而不是等使用者發現。
          version="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "::error::gradle.properties 讀不到 mod_version"
            exit 1
          fi
          agent="$(sed -n 's/.*MCAutoTranslationTool\/\([^"]*\)".*/\1/p' \
            translator-core/src/main/java/org/universaltranslator/core/UserAgent.java | head -n 1)"
          web="$(sed -n 's/^const releaseVersion = "\([^"]*\)";/\1/p' website/app/page.tsx | head -n 1)"
          failed=0
          check() {
            local label="$1"
            local value="$2"
            if [[ "$value" != "$version" ]]; then
              echo "::error::${label} 是 '${value}'，但 mod_version 是 '${version}'"
              failed=1
            fi
          }
          check "UserAgent.VALUE" "$agent"
          check "website 的 releaseVersion" "$web"
          # website/app/page.tsx 的版本號必須由 `const releaseVersion` 推導：metadata.title／
          # metadata.description／hero 按鈕／下載區 kicker 先前各自寫死，於是 bump 只改
          # releaseVersion 就全綠，而分頁標題、og:title 與首頁文案停在舊版。
          hardcoded="$(grep -nE '^  (title|description):' website/app/page.tsx \
            | grep -v 'releaseVersion' | grep -E '[0-9]+[.][0-9]+' || true)"
          if [[ -n "$hardcoded" ]]; then
            echo "::error::website/app/page.tsx 的 metadata 寫死了版本號，必須用 \${releaseVersion}：${hardcoded}"
            failed=1
          fi
          for derived in '^  title:' '^  description:' 'primaryButton' 'sectionKicker'; do
            # -A2：description 的值寫在下一行（模板字串），只看那一行會誤判。
            # 用 grep -c 而不是 grep -q：pipefail 下 grep -q 提早結束會讓上游收到 SIGPIPE，
            # 管線狀態變成 141，這個判斷就永遠成立。
            hits="$(grep -A2 -E "$derived" website/app/page.tsx | grep -c 'releaseVersion' || true)"
            if [[ "${hits:-0}" -eq 0 ]]; then
              echo "::error::website/app/page.tsx 的 ${derived} 沒有用 releaseVersion 推導版本號"
              failed=1
            fi
          done
          for readme in README.md docs/Zh-cn/README.md docs/Zh-tw/README.md docs/en/README.md; do
            # 必須「唯一」，不是「取第一個」。`head -n 1` 只看每份文件的第一個下載連結，於是
            # 其餘 15 個 Forge／NeoForge 連結即使整批留在舊版本號，這一步照樣輸出「版本號一致」
            # 並讓 CI 綠燈，合併後那些連結 404。這正是這條檢查存在的唯一目的（見上面註解）。
            linked="$(grep -o 'releases/download/v[^/]*/' "$readme" \
              | sed 's|releases/download/v||; s|/$||' | sort -u)"
            count="$(printf '%s\n' "$linked" | grep -c . || true)"
            if [[ "$count" -ne 1 ]]; then
              echo "::error::${readme} 的下載連結混用了 ${count} 個版本：$(printf '%s' "$linked" | tr '\n' ' ')"
              failed=1
              continue
            fi
            check "${readme} 的下載連結" "$linked"
          done
          # 這個常數只能有一份：兩份就會各自漂移。
          copies="$(grep -rl 'MCAutoTranslationTool/' translator-core/src/main/java | wc -l)"
          if [[ "$copies" -ne 1 ]]; then
            echo "::error::MCAutoTranslationTool/ 出現在 ${copies} 個檔案，應該只有 UserAgent.java 一處"
            failed=1
          fi
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
          echo "版本號一致：${version}"

      - name: 上傳檢查報告
        # Same artifact policy as the other three uploads: a PR run keeps nothing.
        if: failure() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 3

      - name: 寫入建置摘要
        if: always()
        env:
          TARGET: 核心檢查
          OUTCOME: ${{ steps.checks.outcome }}
          ARTIFACT: check-reports
        # 摘要本文只留一份：scripts/ci/write-build-summary.sh（差異只在上面三個 env）。
        run: bash scripts/ci/write-build-summary.sh

  lint:
    name: 檢查 workflow 與腳本
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v7

      # runner 映像已內建 shellcheck，actionlint 會自動用它檢查每個 run: 區塊。
      # 版本與 sha256 都寫死，避免上游被竄改時執行到別的東西。
      - name: 安裝 actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="/tmp/actionlint.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version
          shellcheck --version | sed -n '2,3p'

      - name: 檢查所有 workflow
        run: actionlint -color

      # actionlint 的預設掃描範圍只有 .github/workflows/*.yml，composite action 不在裡面，
      # 但它才是 6 個呼叫端（build.yml 4 處、legacy-targets.yml 3 處、prepare-release.yml 1 處）
      # 唯一的建置入口。少了這一步，errexit 復辟、重試 grep 掉了 -i、PIPESTATUS 被換成 $? 這類
      # 回歸會完全靜默，只表現為「重試變成死碼」或某次 Maven 抖動造成假紅燈（2026-10-04 兩次）。
      - name: 檢查 composite action
        run: |
          set -euo pipefail
          # 這一版的 actionlint 支不支援 action metadata，先用一個最小合法的 fixture 探測，不要
          # 事後猜訊息：`unexpected key` 同時是「不支援 metadata」與「真的打錯 key」的訊息，用樣式
          # 判斷會把後者降級成 ::notice::，於是寫壞的 composite action 在 PR 上完全不會紅。
          probe="$RUNNER_TEMP/action-metadata-probe"
          mkdir -p "$probe"
          cat > "$probe/action.yml" <<'YAML'
          name: probe
          description: probe
          runs:
            using: composite
            steps:
              - shell: bash
                run: echo probe
          YAML
          if actionlint -color "$probe/action.yml" >/dev/null 2>&1; then
            actionlint -color .github/actions/gradle-build/action.yml
            echo "actionlint 已檢查 composite action"
          else
            actionlint -color .github/actions/gradle-build/action.yml > "$RUNNER_TEMP/actionlint-action.log" 2>&1 || true
            echo "::notice::這一版 actionlint 不支援 action metadata，改用下列契約斷言檢查 composite action"
            {
              echo "## actionlint 對 composite action 的原始輸出（不支援 metadata，僅供人工複核）"
              echo '```'
              cat "$RUNNER_TEMP/actionlint-action.log" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          action="${GITHUB_WORKSPACE:-.}/.github/actions/gradle-build/action.yml"
          # AGENTS.md 的兩條硬契約只存在於註解裡，這裡讓它們在 PR 上就紅：
          # 1) `set +e` 必須在，否則 bash -e 會讓失敗的 `./gradlew | tee` 直接結束，
          #    底下的重試邏輯變成死碼。
          grep -qE '^[[:space:]]*set \+e$' "$action" \
            || { echo "::error::gradle-build/action.yml 缺少 set +e（errexit 會讓重試變死碼）"; exit 1; }
          # 2) 重試的 grep 必須不區分大小寫（ForgeGradle 吐的是小寫的
          #    "could not resolve plugin artifact"）。
          grep -q 'grep -qiE' "$action" \
            || { echo "::error::gradle-build/action.yml 的重試 grep 缺少 -i"; exit 1; }
          # 3) 離開碼必須取自 PIPESTATUS[0]，取 $? 會拿到 tee 的狀態而永遠是 0。
          grep -q 'PIPESTATUS\[0\]' "$action" \
            || { echo "::error::gradle-build/action.yml 必須用 PIPESTATUS[0] 取 Gradle 的離開碼"; exit 1; }
          # 摘要腳本現在是全專案共用的一份（7 個 job 都呼叫它），先做語法檢查。
          bash -n scripts/ci/write-build-summary.sh
          echo "composite action 與摘要腳本檢查通過"

      # scripts/*.py 的單元測試原本沒有任何 CI 入口（AGENTS.md 也禁止本機執行），於是
      # 「有測試」等於紙上覆蓋：600 KiB 分片尺寸、ZIP metadata、Forge 版本範圍這些契約
      # 都沒有東西守著。這裡只跑純 Python、不裝第三方依賴、不碰 Gradle，成本是幾秒。
      - name: 設定 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 執行腳本單元測試
        run: python -m unittest discover -s scripts -p "test_*.py" -v

  plan:
    name: 解析建置目標
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
      forge_changed: ${{ steps.forge.outputs.changed }}
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v7

      - name: 解析要建置的目標
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.targets }}
        run: |
          set -euo pipefail
          # Whitespace is stripped here because GitHub expressions provide no
          # replace()/trim(); the jobs below match comma-wrapped target names.
          requested="$(printf '%s' "${REQUESTED:-}" | tr -d '[:space:]')"
          if [[ "${EVENT_NAME:-}" != "workflow_dispatch" || -z "$requested" ]]; then
            echo "targets=" >> "$GITHUB_OUTPUT"
          else
            echo "targets=,$requested," >> "$GITHUB_OUTPUT"
          fi
          if [[ "${EVENT_NAME:-}" == "workflow_dispatch" && -n "$requested" ]]; then
            # 名稱打錯時兩群 job 的建置步驟全部被 if 略過，每個 job 仍回報 success、CI 總結 綠燈
            # ——這正是 AGENTS.md 記載的假綠燈。legacy-targets.yml 與 prepare-release.yml 已經用
            # ::error:: 擋掉未知名稱，這裡補上同一道關卡。清單直接從本檔的 matrix 取，所以
            # 「驗證清單」與「matrix 名稱」不可能分叉。
            python3 - "$requested" <<'PY'
          import re, sys
          from pathlib import Path

          requested = [name for name in sys.argv[1].split(",") if name]
          keywords = {"legacy", "release"}
          if not requested:
              print("::error::targets 只給了逗號或空白，沒有任何目標名稱", file=sys.stderr)
              sys.exit(1)
          section = None
          known = set()
          for line in Path(".github/workflows/build.yml").read_text(encoding="utf-8").splitlines():
              header = re.match(r"^  ([A-Za-z][A-Za-z0-9_-]*):\s*$", line)
              if header:
                  section = header.group(1)
              entry = re.match(r"^\s+- target:\s*(\S+)\s*$", line)
              if entry and section in ("platform-build", "legacy-build"):
                  known.add(entry.group(1))
          unknown = [name for name in requested if name not in known and name not in keywords]
          if unknown:
              print("::error::不存在的目標：" + "、".join(unknown), file=sys.stderr)
              print("可用目標：" + "、".join(sorted(known | keywords)), file=sys.stderr)
              sys.exit(1)
          PY
          fi

      # Forge／NeoForge 的建置要跑 Minecraft Mavenizer 與 ForgeGradle 的 decompile，
      # 單一目標就要 3～5 分鐘。只動到文件、網站或 Fabric 的 PR 不可能影響它們，
      # 因此略過「建置步驟」——job 本身仍會執行並回報成功，CI 總結 才不會卡在 waiting。
      - name: 判斷有沒有動到 Forge／NeoForge
        id: forge
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" || -z "$BASE_REF" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "非 PR 觸發，一律建置 Forge／NeoForge"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          # 保守策略：只有「所有變更都落在與 Forge 無關的路徑」時才略過。
          # 文件、網站、下載資產與 Fabric 平台都是獨立專案，改動它們不會影響 Forge。
          # 但 LICENSE 與 docs/en/THIRD_PARTY_OFFLINE.md 會被 gradle/jar-contents.gradle 打包進
          # 每一顆 JAR（含 19 個 Forge 與 19 個 NeoForge），改到它們就是改到產物；`from(...)` 在
          # 檔案被刪或改名時甚至會讓 configuration 失敗。這兩個路徑不能用「文件」的名義略過。
          paths="$(git diff --name-only FETCH_HEAD HEAD)"
          unrelated='^(docs/|website/|downloads/|platforms/fabric/)|\.md$|^\.gitignore$'
          jar_contents='^(LICENSE.*|docs/en/THIRD_PARTY_OFFLINE\.md)$'
          relevant="$(printf '%s\n' "$paths" | grep -vE "$unrelated" || true)"
          jar_changed="$(printf '%s\n' "$paths" | grep -E "$jar_contents" || true)"
          if [[ -n "$relevant" || -n "$jar_changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "這個 PR 有動到 Forge／NeoForge 相關路徑"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "這個 PR 只動到文件、網站、下載資產或 Fabric，略過 Forge／NeoForge 建置"
          fi

      # 發布資產驗證不再由 PR 的路徑 diff 決定要不要跑（第二輪審計 C2-163 的互鎖會被裝回去）：
      # 只改 gradle.properties（升版）或只改 scripts/verify_release_jars.py 的 PR 都會被要求先
      # 產生 downloads/<新版本> 才能合併，而那個目錄是 10～20 分鐘的 prepare-release 才會產生的。
      # 現在它只由「非 PR 觸發」或 workflow_dispatch 的 release 關鍵字驅動；發布流程本身由
      # prepare-release.yml 的「用專案的驗證器檢查」負責。
  platform-build:
    name: 建置 ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fabric-1.16.x
            java: "21"
            bundle: true
          - target: fabric-1.17-1.18.x
            java: "21"
            bundle: true
          - target: fabric-1.19.x
            java: "21"
            bundle: true
          - target: fabric-1.20.x
            java: "21"
            bundle: true
          - target: fabric-1.21.x
            java: "21"
            bundle: true
          - target: fabric-1.21.4-1.21.5
            java: "21"
          - target: fabric-26.x
            java: "25"
            bundle: true
          - target: neoforge-1.20.1
            java: "21"
          - target: forge-1.21.1
            java: "21"
          - target: forge-1.21.7
            java: "21"
          - target: forge-1.21.9
            java: "21"
          - target: forge-1.21.11
            java: "21"
          - target: forge-26.1.1
            java: "25"
          - target: forge-26.2
            java: "25"
          - target: neoforge-1.21.1
            java: "21"
          - target: neoforge-1.21.3
            java: "21"
          - target: neoforge-1.21.11
            java: "21"
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v7

      - name: 設定 Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # v6 的預設快取是 Gradle 的商業服務（gradle-actions-caching），這裡明確
          # 用回開源的 GitHub Actions 快取實作，維持原本的行為與相依性。
          cache-provider: basic
          # 這個 action 的摘要只有英文且無法翻譯，成功時改由下面「寫入建置摘要」
          # 提供繁中摘要，失敗時才顯示它的英文面板方便對照 log。
          add-job-summary: on-failure

      - name: 建置平台
        id: build
        if: >-
          (needs.plan.outputs.targets == '' &&
          (needs.plan.outputs.forge_changed == 'true' ||
          (!startsWith(matrix.target, 'forge-') && !startsWith(matrix.target, 'neoforge-')))) ||
          contains(needs.plan.outputs.targets, format(',{0},', matrix.target))
        uses: ./.github/actions/gradle-build
        with:
          args: --no-daemon --max-workers=2 -PtargetPlatform=${{ matrix.target }} :platform-${{ matrix.target }}:build

      # PR 是最頻繁的觸發來源，而 PR 的產物對審查沒有幫助，卻會佔用儲存與頻寬。
      # 需要產物時改用 workflow_dispatch 或 push main 的執行。
      - name: 上傳平台 JAR
        if: >-
          success() && steps.build.outcome == 'success' &&
          github.event_name != 'pull_request' &&
          (needs.plan.outputs.targets == '' ||
          contains(needs.plan.outputs.targets, format(',{0},', matrix.target)))
        uses: actions/upload-artifact@v7
        with:
          name: platform-${{ matrix.target }}
          # bundle 目標的 build 會連帶建置旗下的單版本子專案，它們的
          # platforms/<線>/versions/<版本>/build/libs/*.jar 也符合 platforms/** → 產物會從 1 顆
          # 變成整包（AGENTS.md 警告過的「舊 JAR 混進產物」就是這個形狀）。bundle 專案的輸出
          # 固定在 platforms/<線>/bundle/，所以只上傳那一個目錄。
          path: ${{ matrix.bundle && 'platforms/*/*/bundle/build/libs/*.jar' || 'platforms/**/build/libs/*.jar' }}
          if-no-files-found: warn
          retention-days: 3

      - name: 寫入建置摘要
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          OUTCOME: ${{ steps.build.outcome }}
          ARTIFACT: platform-${{ matrix.target }}
        # 摘要本文只留一份：scripts/ci/write-build-summary.sh（差異只在上面三個 env）。
        run: bash scripts/ci/write-build-summary.sh

  legacy-build:
    name: 建置舊版 ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One job per target. These ForgeGradle builds decompile Minecraft, so
        # running all seven in a single Gradle invocation made every run wait
        # for the sum of the targets instead of the slowest one.
        include:
          - target: fabric-1.16.5
          - target: fabric-1.19.2
          - target: fabric-1.20.1
          - target: forge-1.16.5
          - target: forge-1.18.2
          - target: forge-1.19.2
          - target: forge-1.20.1
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v7

      - name: 設定 Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: 設定 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # v6 的預設快取是 Gradle 的商業服務（gradle-actions-caching），這裡明確
          # 用回開源的 GitHub Actions 快取實作，維持原本的行為與相依性。
          cache-provider: basic
          # 這個 action 的摘要只有英文且無法翻譯，成功時改由下面「寫入建置摘要」
          # 提供繁中摘要，失敗時才顯示它的英文面板方便對照 log。
          add-job-summary: on-failure

      - name: 建置舊版平台
        id: build
        if: >-
          contains(needs.plan.outputs.targets, ',legacy,') ||
          (needs.plan.outputs.targets == '' &&
          (needs.plan.outputs.forge_changed == 'true' ||
          !startsWith(matrix.target, 'forge-'))) ||
          contains(needs.plan.outputs.targets, format(',{0},', matrix.target))
        uses: ./.github/actions/gradle-build
        with:
          args: --no-daemon --max-workers=2 -PtargetPlatform=${{ matrix.target }} :platform-${{ matrix.target }}:build

      - name: 上傳舊版 JAR
        if: >-
          success() && steps.build.outcome == 'success' &&
          github.event_name != 'pull_request' &&
          (needs.plan.outputs.targets == '' ||
          contains(needs.plan.outputs.targets, format(',{0},', matrix.target)) ||
          contains(needs.plan.outputs.targets, ',legacy,'))
        uses: actions/upload-artifact@v7
        with:
          name: legacy-${{ matrix.target }}
          # Forge 1.16.5-1.20.1 emit their distributable JAR to build/release;
          # Fabric targets and the other loaders use build/libs.
          path: |
            platforms/**/build/libs/*.jar
            platforms/**/build/release/*.jar
          if-no-files-found: warn
          retention-days: 3

      - name: 寫入建置摘要
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          OUTCOME: ${{ steps.build.outcome }}
          ARTIFACT: legacy-${{ matrix.target }}
        # 摘要本文只留一份：scripts/ci/write-build-summary.sh（差異只在上面三個 env）。
        run: bash scripts/ci/write-build-summary.sh

  release-assets:
    name: 驗證縮減後的發布 JAR
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v7

      - name: 設定 Java 25
        if: >-
          contains(needs.plan.outputs.targets, ',release,') ||
          (needs.plan.outputs.targets == '' && github.event_name != 'pull_request')
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: 設定 Python
        if: >-
          contains(needs.plan.outputs.targets, ',release,') ||
          (needs.plan.outputs.targets == '' && github.event_name != 'pull_request')
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 設定 Gradle
        if: >-
          contains(needs.plan.outputs.targets, ',release,') ||
          (needs.plan.outputs.targets == '' && github.event_name != 'pull_request')
        uses: gradle/actions/setup-gradle@v6
        with:
          # v6 的預設快取是 Gradle 的商業服務（gradle-actions-caching），這裡明確
          # 用回開源的 GitHub Actions 快取實作，維持原本的行為與相依性。
          cache-provider: basic
          # 這個 action 的摘要只有英文且無法翻譯，成功時改由下面「寫入建置摘要」
          # 提供繁中摘要，失敗時才顯示它的英文面板方便對照 log。
          add-job-summary: on-failure

      # `check` 已不再包含發布驗證（第二輪審計 C2-163）：它需要 downloads/<mod_version>，而那個
      # 目錄是「發布後」才存在的，掛在 PR 必經路徑等同讓改版本號與必經檢查互鎖。聚合任務
      # verifyPublishedRelease（根 build.gradle，dependsOn verifyPreparedReleaseAssets）留給 release
      # 流程明確呼叫，這裡是呼叫點之一（另一個是 prepare-release.yml 的收集後驗證）。
      - name: 驗證所有發布 JAR 與 Fabric 選版
        id: build
        if: >-
          contains(needs.plan.outputs.targets, ',release,') ||
          (needs.plan.outputs.targets == '' && github.event_name != 'pull_request')
        uses: ./.github/actions/gradle-build
        with:
          # 逐一呼叫要驗的 fabric bundle：驗證器本體收斂在 gradle/fabric-bundle-aggregate-verify.gradle，
          # 但每個 bundle 專案各自編譯自己的 BundleResolutionVerifier 測試類別，所以要各自被叫到。
          # 26.x 之前完全沒有 aggregate 覆蓋，是這次補上的重點。
          # -PtargetPlatform 必須同時列出這些 bundle，settings.gradle 才會把它們 include 進來
          # （只列 fabric-1.21.x 時 :platform-fabric-26.x 會直接「專案不存在」）。
          # 先前只叫了 1.21.x 與 26.x，於是 1.17、1.17.1、1.18、1.18.1、1.18.2、1.19–1.19.4、
          # 1.20–1.20.6 這 17 個版本的選版正確性從來沒有被驗過（任務不在任務圖裡，連「略過」都算不上）。
          args: >-
            --no-daemon --max-workers=2
            -PtargetPlatform=fabric-1.17-1.18.x,fabric-1.19.x,fabric-1.20.x,fabric-1.21.x,fabric-26.x
            verifyPublishedRelease
            :platform-fabric-1.17-1.18.x:verifyPreparedReleaseBundle
            :platform-fabric-1.19.x:verifyPreparedReleaseBundle
            :platform-fabric-1.20.x:verifyPreparedReleaseBundle
            :platform-fabric-1.21.x:verifyPreparedReleaseBundle
            :platform-fabric-26.x:verifyPreparedReleaseBundle

      - name: 上傳縮減後的發布 JAR
        if: >-
          success() && github.event_name != 'pull_request' &&
          (needs.plan.outputs.targets == '' ||
          contains(needs.plan.outputs.targets, ',release,'))
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            build/release-assets/*.jar
            build/release-assets/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 3

      - name: 寫入建置摘要
        if: always()
        env:
          TARGET: 發布資產
          OUTCOME: ${{ steps.build.outcome }}
          ARTIFACT: release-assets
        # 摘要本文只留一份：scripts/ci/write-build-summary.sh（差異只在上面三個 env）。
        run: bash scripts/ci/write-build-summary.sh

  # 網站（website/）目前沒有其他檢查。這個 job 只在 PR 有動到 website/ 時才真的跑，
  # 所以一般 PR 幾乎零成本；Dependabot 的 npm 更新 PR 才會被實際驗證。
  website:
    name: 網站檢查
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 判斷有沒有動到 website
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" || -z "$BASE_REF" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "非 PR 觸發，一律執行網站檢查"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          if git diff --name-only FETCH_HEAD HEAD | grep -q '^website/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "這個 PR 有動到 website/"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "這個 PR 沒有動到 website/，略過網站檢查"
          fi

      - name: 設定 Node
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 啟用 pnpm
        if: steps.changed.outputs.run == 'true'
        run: corepack enable

      - name: 安裝相依
        if: steps.changed.outputs.run == 'true'
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: 檢查與測試
        if: steps.changed.outputs.run == 'true'
        working-directory: website
        run: |
          pnpm run lint
          # pnpm test = pnpm run build + node --test（比對渲染出的 HTML 與原始碼是否一致）
          pnpm test

  # Single stable check for branch protection: every other job is aggregated
  # here, so required status checks do not have to list every matrix target.
  ci-status:
    name: CI 總結
    needs:
      - check
      - lint
      - plan
      - platform-build
      - legacy-build
      - release-assets
      - website
    if: always()
    runs-on: ubuntu-24.04
    steps:
      # 讀 .github/workflows/build.yml 自己的 jobs 清單，用來比對 needs 有沒有漏掉 job。新增 job
      # 而忘記加進 needs 時，那個 job 失敗不會讓 CI 總結 變紅、分支保護照樣放行，而 AGENTS.md 只把
      # 「必須加進 needs」寫成規則，沒有任何程式檢查。
      - name: 取出原始碼
        uses: actions/checkout@v7

      - name: 確認每個 job 都成功，且 needs 涵蓋所有 job
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          python3 - <<'PY'
          import json, os, re, sys
          from pathlib import Path

          labels = {
              "check": "核心檢查",
              "lint": "Workflow 與腳本檢查",
              "plan": "解析建置目標",
              "platform-build": "平台建置",
              "legacy-build": "舊版建置",
              "release-assets": "發布資產",
              "website": "網站檢查",
          }
          results = {"success": "成功", "failure": "失敗", "skipped": "略過", "cancelled": "已取消"}
          needs = json.loads(os.environ["NEEDS"])
          jobs_block = Path(".github/workflows/build.yml").read_text(encoding="utf-8").split("\njobs:\n", 1)[1]
          # jobs: 底下縮排兩格的 key 才是 job 名稱（其餘層級都更深），ci-status 自己不算在 needs 裡。
          declared = []
          for line in jobs_block.splitlines():
              match = re.match(r"^  ([A-Za-z][A-Za-z0-9_-]*):\s*$", line)
              if match and match.group(1) != "ci-status":
                  declared.append(match.group(1))
          lines = ["## CI 總結", "", "| Job | 結果 |", "| --- | --- |"]
          for name, info in needs.items():
              lines.append("| %s | %s |" % (labels.get(name, name), results.get(info["result"], info["result"])))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          failed = False
          missing = [name for name in declared if name not in needs]
          if missing:
              print("::error::ci-status 的 needs 漏掉這些 job，它們失敗不會讓 CI 總結 變紅：" + "、".join(missing))
              failed = True
          extra = [name for name in needs if name not in declared]
          if extra:
              print("::error::ci-status 的 needs 列了 workflow 裡不存在的 job：" + "、".join(extra))
              failed = True
          # 只接受 success。這個 workflow 沒有任何 job 層級的 if，需要省成本的地方一律用「步驟略過、
          # job 成功」表達，所以 skipped 不該出現；把它當通過會讓「job 什麼都沒驗」與「job 真的過了」
          # 在彙總表上長得一樣。
          bad = {k: v["result"] for k, v in needs.items() if v["result"] != "success"}
          if bad:
              print("::error::以下 job 沒有成功：" + "、".join("%s=%s" % (k, v) for k, v in bad.items()))
              failed = True
          if failed:
              sys.exit(1)
          print("所有 job 都成功，needs 涵蓋全部 %d 個 job。" % len(declared))
          PY
