name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      targets:
        description: >-
          Comma-separated platform targets to build, for example
          "fabric-1.21.x,forge-1.21.11". Add the keywords "legacy" and/or
          "release" for the legacy and release-asset jobs. Leave empty to run
          every job.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Core checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run checks
        run: ./gradlew --no-daemon check

      - name: Upload check reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  plan:
    name: Plan requested targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - name: Resolve requested targets
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.targets }}
        run: |
          set -euo pipefail
          # Whitespace is stripped here because GitHub expressions provide no
          # replace()/trim(); the jobs below match comma-wrapped target names.
          requested="$(printf '%s' "${REQUESTED:-}" | tr -d '[:space:]')"
          if [[ "${EVENT_NAME:-}" != "workflow_dispatch" || -z "$requested" ]]; then
            echo "targets=" >> "$GITHUB_OUTPUT"
          else
            echo "targets=,$requested," >> "$GITHUB_OUTPUT"
          fi

  platform-build:
    name: Build ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fabric-1.16.x
            java: "21"
          - target: fabric-1.17-1.18.x
            java: "21"
          - target: fabric-1.19.x
            java: "21"
          - target: fabric-1.20.x
            java: "21"
          - target: fabric-1.21.x
            java: "21"
          - target: fabric-1.21.4-1.21.5
            java: "21"
          - target: fabric-26.x
            java: "25"
          - target: neoforge-1.20.1
            java: "21"
          - target: forge-1.21.1
            java: "21"
          - target: forge-1.21.7
            java: "21"
          - target: forge-1.21.9
            java: "21"
          - target: forge-1.21.11
            java: "21"
          - target: forge-26.1.1
            java: "25"
          - target: forge-26.2
            java: "25"
          - target: neoforge-1.21.1
            java: "21"
          - target: neoforge-1.21.3
            java: "21"
          - target: neoforge-1.21.11
            java: "21"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build platform
        if: needs.plan.outputs.targets == '' || contains(needs.plan.outputs.targets, format(',{0},', matrix.target))
        run: ./gradlew --no-daemon --max-workers=2 -PtargetPlatform=${{ matrix.target }} :platform-${{ matrix.target }}:build

      - name: Upload platform JARs
        if: >-
          success() && (needs.plan.outputs.targets == '' ||
          contains(needs.plan.outputs.targets, format(',{0},', matrix.target)))
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.target }}
          path: platforms/**/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14

  legacy-build:
    name: Build legacy Fabric and Forge
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build legacy platforms
        if: needs.plan.outputs.targets == '' || contains(needs.plan.outputs.targets, ',legacy,')
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -PtargetPlatform=fabric-1.16.5,fabric-1.19.2,fabric-1.20.1,forge-1.16.5,forge-1.18.2,forge-1.19.2,forge-1.20.1
          :platform-fabric-1.16.5:build
          :platform-fabric-1.19.2:build
          :platform-fabric-1.20.1:build
          :platform-forge-1.16.5:build
          :platform-forge-1.18.2:build
          :platform-forge-1.19.2:build
          :platform-forge-1.20.1:build

      - name: Upload legacy JARs
        if: >-
          success() && (needs.plan.outputs.targets == '' ||
          contains(needs.plan.outputs.targets, ',legacy,'))
        uses: actions/upload-artifact@v4
        with:
          name: legacy-platforms
          path: platforms/**/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14

  release-assets:
    name: Verify reduced release JARs
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify every prepared release JAR and Fabric selection
        if: needs.plan.outputs.targets == '' || contains(needs.plan.outputs.targets, ',release,')
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -PtargetPlatform=fabric-1.21.x
          verifyPreparedReleaseAssets
          :platform-fabric-1.21.x:verifyPreparedReleaseBundle

      - name: Upload reduced release JARs
        if: >-
          success() && (needs.plan.outputs.targets == '' ||
          contains(needs.plan.outputs.targets, ',release,'))
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            build/release-assets/*.jar
            build/release-assets/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30
