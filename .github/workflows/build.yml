name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Core checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run checks
        run: ./gradlew --no-daemon check

  platform-build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fabric-1.21.x
            java: "21"
          - target: fabric-1.21.4-1.21.5
            java: "21"
          - target: fabric-26.x
            java: "25"
          - target: forge-1.20.1
            java: "21"
          - target: neoforge-1.20.1
            java: "21"
          - target: forge-1.21.1
            java: "21"
          - target: forge-1.21.7
            java: "21"
          - target: forge-1.21.9
            java: "21"
          - target: forge-1.21.11
            java: "21"
          - target: forge-26.1.1
            java: "25"
          - target: forge-26.2
            java: "25"
          - target: neoforge-1.21.1
            java: "21"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build platform
        run: ./gradlew --no-daemon --max-workers=2 -PtargetPlatform=${{ matrix.target }} :platform-${{ matrix.target }}:build
