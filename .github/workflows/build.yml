name: 主要建置

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      targets:
        description: >-
          Comma-separated platform targets to build, for example
          "fabric-1.21.x,forge-1.21.11". Add the keywords "legacy" and/or
          "release" for the legacy and release-asset jobs. Leave empty to run
          every job.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 核心檢查
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 設定 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 執行檢查
        run: ./gradlew --no-daemon check

      - name: 上傳檢查報告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  plan:
    name: 解析建置目標
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.resolve.outputs.targets }}
    steps:
      - name: 解析要建置的目標
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ github.event.inputs.targets }}
        run: |
          set -euo pipefail
          # Whitespace is stripped here because GitHub expressions provide no
          # replace()/trim(); the jobs below match comma-wrapped target names.
          requested="$(printf '%s' "${REQUESTED:-}" | tr -d '[:space:]')"
          if [[ "${EVENT_NAME:-}" != "workflow_dispatch" || -z "$requested" ]]; then
            echo "targets=" >> "$GITHUB_OUTPUT"
          else
            echo "targets=,$requested," >> "$GITHUB_OUTPUT"
          fi

  platform-build:
    name: 建置 ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: fabric-1.16.x
            java: "21"
          - target: fabric-1.17-1.18.x
            java: "21"
          - target: fabric-1.19.x
            java: "21"
          - target: fabric-1.20.x
            java: "21"
          - target: fabric-1.21.x
            java: "21"
          - target: fabric-1.21.4-1.21.5
            java: "21"
          - target: fabric-26.x
            java: "25"
          - target: neoforge-1.20.1
            java: "21"
          - target: forge-1.21.1
            java: "21"
          - target: forge-1.21.7
            java: "21"
          - target: forge-1.21.9
            java: "21"
          - target: forge-1.21.11
            java: "21"
          - target: forge-26.1.1
            java: "25"
          - target: forge-26.2
            java: "25"
          - target: neoforge-1.21.1
            java: "21"
          - target: neoforge-1.21.3
            java: "21"
          - target: neoforge-1.21.11
            java: "21"
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 設定 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 建置平台
        if: needs.plan.outputs.targets == '' || contains(needs.plan.outputs.targets, format(',{0},', matrix.target))
        run: ./gradlew --no-daemon --max-workers=2 -PtargetPlatform=${{ matrix.target }} :platform-${{ matrix.target }}:build

      - name: 上傳平台 JAR
        if: >-
          success() && (needs.plan.outputs.targets == '' ||
          contains(needs.plan.outputs.targets, format(',{0},', matrix.target)))
        uses: actions/upload-artifact@v4
        with:
          name: platform-${{ matrix.target }}
          path: platforms/**/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14

  legacy-build:
    name: 建置舊版 ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One job per target. These ForgeGradle builds decompile Minecraft, so
        # running all seven in a single Gradle invocation made every run wait
        # for the sum of the targets instead of the slowest one.
        include:
          - target: fabric-1.16.5
          - target: fabric-1.19.2
          - target: fabric-1.20.1
          - target: forge-1.16.5
          - target: forge-1.18.2
          - target: forge-1.19.2
          - target: forge-1.20.1
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 設定 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 建置舊版平台
        if: >-
          needs.plan.outputs.targets == '' ||
          contains(needs.plan.outputs.targets, format(',{0},', matrix.target)) ||
          contains(needs.plan.outputs.targets, ',legacy,')
        run: ./gradlew --no-daemon --max-workers=2 -PtargetPlatform=${{ matrix.target }} :platform-${{ matrix.target }}:build

      - name: 上傳舊版 JAR
        if: >-
          success() && (needs.plan.outputs.targets == '' ||
          contains(needs.plan.outputs.targets, format(',{0},', matrix.target)) ||
          contains(needs.plan.outputs.targets, ',legacy,'))
        uses: actions/upload-artifact@v4
        with:
          name: legacy-${{ matrix.target }}
          # Forge 1.16.5-1.20.1 emit their distributable JAR to build/release;
          # Fabric targets and the other loaders use build/libs.
          path: |
            platforms/**/build/libs/*.jar
            platforms/**/build/release/*.jar
          if-no-files-found: warn
          retention-days: 14

  release-assets:
    name: 驗證縮減後的發布 JAR
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v4

      - name: 設定 Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 驗證所有發布 JAR 與 Fabric 選版
        if: needs.plan.outputs.targets == '' || contains(needs.plan.outputs.targets, ',release,')
        run: >-
          ./gradlew --no-daemon --max-workers=2
          -PtargetPlatform=fabric-1.21.x
          verifyPreparedReleaseAssets
          :platform-fabric-1.21.x:verifyPreparedReleaseBundle

      - name: 上傳縮減後的發布 JAR
        if: >-
          success() && (needs.plan.outputs.targets == '' ||
          contains(needs.plan.outputs.targets, ',release,'))
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            build/release-assets/*.jar
            build/release-assets/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 30

  # Single stable check for branch protection: every other job is aggregated
  # here, so required status checks do not have to list every matrix target.
  ci-status:
    name: CI 總結
    needs:
      - check
      - plan
      - platform-build
      - legacy-build
      - release-assets
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 確認每個 job 都成功或被刻意略過
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS"
          printf '%s' "$NEEDS" | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {k: v["result"] for k, v in needs.items() if v["result"] not in ("success", "skipped")}
          if bad:
              print("::error::Jobs that did not succeed: " + ", ".join("%s=%s" % (k, v) for k, v in bad.items()))
              sys.exit(1)
          print("All jobs succeeded; skipped targets are allowed.")
          '
