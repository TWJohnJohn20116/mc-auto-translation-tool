name: Publish release downloads

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-release.yml"
      - "downloads/**"
      - "gradle.properties"
      - "CHANGELOG.md"
      - "scripts/prepare_release_assets.py"
      - "scripts/verify_release_jars.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          if [[ -z "$version" || ! "$version" =~ ^[0-9]+([.][0-9]+)*([_-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid or missing mod_version in gradle.properties" >&2
            exit 1
          fi
          release_dir="downloads/$version"
          if [[ ! -d "$release_dir" ]]; then
            echo "Missing release directory: $release_dir" >&2
            exit 1
          fi
          shopt -s nullglob
          for first_part in "$release_dir"/*.jar.part-aa; do
            jar="${first_part%.part-aa}"
            parts=("$jar".part-*)
            if [[ -e "$jar" ]]; then
              echo "Both assembled JAR and split parts are present: $jar" >&2
              exit 1
            fi
            if [[ "${#parts[@]}" -lt 2 ]]; then
              echo "Incomplete split JAR: $jar" >&2
              exit 1
            fi
            cat "${parts[@]}" > "$jar"
            rm -- "${parts[@]}"
          done
          expected=(
            "MCAutoTranslationTool-$version-mc1.8.9-forge.jar"
            "MCAutoTranslationTool-$version-mc1.12.2-forge.jar"
            "MCAutoTranslationTool-$version-mc1.16.5-fabric.jar"
            "MCAutoTranslationTool-$version-mc1.16.5-forge.jar"
            "MCAutoTranslationTool-$version-mc1.19.2-fabric.jar"
            "MCAutoTranslationTool-$version-mc1.19.2-forge.jar"
            "MCAutoTranslationTool-$version-mc1.20.1-fabric.jar"
            "MCAutoTranslationTool-$version-mc1.20.1-forge.jar"
            "MCAutoTranslationTool-$version-mc1.20.1-neoforge.jar"
            "MCAutoTranslationTool-$version-mc1.21.1-neoforge.jar"
            "MCAutoTranslationTool-$version-mc1.21.x-fabric.jar"
            "MCAutoTranslationTool-$version-mc1.21-forge.jar"
            "MCAutoTranslationTool-$version-mc1.21.1-forge.jar"
            "MCAutoTranslationTool-$version-mc1.21.3-forge.jar"
            "MCAutoTranslationTool-$version-mc1.21.4-forge.jar"
            "MCAutoTranslationTool-$version-mc1.21.5-forge.jar"
            "MCAutoTranslationTool-$version-mc1.21.6-forge.jar"
            "MCAutoTranslationTool-$version-mc1.21.7-forge.jar"
            "MCAutoTranslationTool-$version-mc1.21.8-forge.jar"
            "MCAutoTranslationTool-$version-mc1.21.9-forge.jar"
            "MCAutoTranslationTool-$version-mc1.21.10-forge.jar"
            "MCAutoTranslationTool-$version-mc1.21.11-forge.jar"
            "MCAutoTranslationTool-$version-mc26.x-fabric.jar"
            "MCAutoTranslationTool-$version-mc26.1-forge.jar"
            "MCAutoTranslationTool-$version-mc26.1.1-forge.jar"
            "MCAutoTranslationTool-$version-mc26.1.2-forge.jar"
            "MCAutoTranslationTool-$version-mc26.2-forge.jar"
          )
          mapfile -t jars < <(find "$release_dir" -maxdepth 1 -type f -name '*.jar' -print | sort)
          if [[ "${#jars[@]}" -ne "${#expected[@]}" || ! -f "$release_dir/SHA256SUMS.txt" ]]; then
            echo "Release must contain exactly ${#expected[@]} target JARs and SHA256SUMS.txt" >&2
            exit 1
          fi
          for file in "${expected[@]}"; do
            if [[ ! -f "$release_dir/$file" ]]; then
              echo "Missing release target: $release_dir/$file" >&2
              exit 1
            fi
          done
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "release_dir=$release_dir" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Verify release JARs and checksums
        shell: bash
        env:
          RELEASE_DIR: ${{ steps.version.outputs.release_dir }}
        run: |
          set -euo pipefail
          mapfile -t jars < <(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.jar' -print | sort)
          python scripts/verify_release_jars.py \
            --checksum-file "$RELEASE_DIR/SHA256SUMS.txt" \
            --require-complete-checksums \
            "${jars[@]}"

      - name: Prepare and verify fewer directly installable JARs
        shell: bash
        env:
          RELEASE_DIR: ${{ steps.version.outputs.release_dir }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET_DIR: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          python scripts/prepare_release_assets.py \
            --release-dir "$RELEASE_DIR" \
            --output-dir "$ASSET_DIR" \
            --version "$VERSION"
          mapfile -t jars < <(find "$ASSET_DIR" -maxdepth 1 -type f -name '*.jar' -print | sort)
          python scripts/verify_release_jars.py \
            --checksum-file "$ASSET_DIR/SHA256SUMS.txt" \
            --require-complete-checksums \
            "${jars[@]}"

      - name: Create or refresh GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ASSET_DIR: ${{ runner.temp }}/release-assets
        run: |
          set -euo pipefail
          mapfile -t assets < <(find "$ASSET_DIR" -maxdepth 1 -type f \( -name '*.jar' -o -name 'SHA256SUMS.txt' \) -print | sort)
          if [[ "${#assets[@]}" -ne 15 ]]; then
            echo "Expected fourteen compatible JARs and SHA256SUMS.txt" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            mapfile -t old_jars < <(gh release view "$TAG" --json assets --jq '.assets[].name | select(endswith(".jar"))')
            for asset in "${old_jars[@]}"; do
              if [[ ! -f "$ASSET_DIR/$asset" ]]; then
                gh release delete-asset "$TAG" "$asset" --yes
              fi
            done
          else
            release_flags=(
              --target "$GITHUB_SHA"
              --title "MC 自动翻译工具 $VERSION"
              --notes-file CHANGELOG.md
            )
            if [[ "${{ steps.version.outputs.prerelease }}" == "true" ]]; then
              release_flags+=(--prerelease --latest=false)
            else
              release_flags+=(--latest)
            fi
            gh release create "$TAG" "${assets[@]}" "${release_flags[@]}"
          fi
