name: 準備發布資產

# 一鍵把 downloads/<mod_version> 準備好：建置 33 個目標、用標準檔名收集、產生
# SHA256SUMS.txt、跑 verify_release_jars.py 驗證，然後開 PR。
# 原本這一步是在本機手動做的（見 AGENTS.md 的發布流程）。
#
# 刻意不放在 PR 路徑上：33 個目標各要 2-8 分鐘，一次約 10 分鐘牆鐘時間。

on:
  workflow_dispatch:
    inputs:
      version:
        description: 要準備的版本；留空則讀 gradle.properties 的 mod_version。
        required: false
        default: ""
        type: string
      targets:
        description: >-
          逗號分隔的目標名稱（例如 mc1.21.7-forge），留空則全部 33 個。
          只指定部分目標時不會開 PR，僅用來煙霧測試。
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  plan:
    name: 解析版本與目標
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      targets: ${{ steps.resolve.outputs.targets }}
      full: ${{ steps.resolve.outputs.full }}
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v7

      - name: 解析版本與要建置的目標
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          REQUESTED: ${{ github.event.inputs.targets }}
        run: |
          set -euo pipefail
          version="${REQUESTED_VERSION:-}"
          if [[ -z "$version" ]]; then
            version="$(sed -n 's/^mod_version=//p' gradle.properties | head -n 1)"
          fi
          if [[ -z "$version" ]]; then
            echo "gradle.properties 讀不到 mod_version，請用 version 輸入指定" >&2
            exit 1
          fi
          requested="$(printf '%s' "${REQUESTED:-}" | tr -d '[:space:]')"
          if [[ "${EVENT_NAME:-}" != "workflow_dispatch" || -z "$requested" ]]; then
            echo "targets=" >> "$GITHUB_OUTPUT"
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "要準備 $version 的全部 33 個目標"
          else
            echo "targets=,$requested," >> "$GITHUB_OUTPUT"
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "只建置指定的目標：$requested（不會開 PR）"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-target:
    name: 建置 ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # 獨立 Gradle 建置（自己的 wrapper、需要 JDK 8），不屬於根專案。
          - target: mc1.8.9-forge
            project: ""
            jar_dir: platforms/forge/legacy/1.8.9
            standalone: true
            java: "8"
          - target: mc1.12.2-forge
            project: ""
            jar_dir: platforms/forge/legacy/1.12.2
            standalone: true
            java: "8"
          # Fabric 整合包：build/release-assets 下的 -fabric-all.jar。
          - target: mc1.13.x-fabric
            project: platform-fabric-1.13.x
            jar_dir: platforms/fabric/1.13/bundle
            java: "21"
          - target: mc1.14-1.15.x-fabric
            project: platform-fabric-1.14-1.15.x
            jar_dir: platforms/fabric/1.14-1.15/bundle
            java: "21"
          - target: mc1.16.5-fabric
            project: platform-fabric-1.16.5
            jar_dir: platforms/fabric/1.16/versions/1.16.5
            java: "21"
          - target: mc1.17-1.18.x-fabric
            project: platform-fabric-1.17-1.18.x
            jar_dir: platforms/fabric/1.17-1.18/bundle
            java: "21"
          - target: mc1.19.x-fabric
            project: platform-fabric-1.19.x
            jar_dir: platforms/fabric/1.19/bundle
            java: "21"
          - target: mc1.20.x-fabric
            project: platform-fabric-1.20.x
            jar_dir: platforms/fabric/1.20/bundle
            java: "21"
          - target: mc1.21.x-fabric
            project: platform-fabric-1.21.x
            jar_dir: platforms/fabric/1.21/bundle
            java: "21"
          - target: mc26.x-fabric
            project: platform-fabric-26.x
            jar_dir: platforms/fabric/26.x/bundle
            java: "25"
          # Forge 1.16.5-1.20.1：發行 JAR 在 build/release。
          - target: mc1.16.5-forge
            project: platform-forge-1.16.5
            jar_dir: platforms/forge/modern/1.16.5
            java: "17"
          - target: mc1.18.2-forge
            project: platform-forge-1.18.2
            jar_dir: platforms/forge/modern/1.18.2
            java: "17"
          - target: mc1.19.2-forge
            project: platform-forge-1.19.2
            jar_dir: platforms/forge/modern/1.19.2
            java: "17"
          - target: mc1.20.1-forge
            project: platform-forge-1.20.1
            jar_dir: platforms/forge/modern/1.20.1
            java: "17"
          # Forge 1.21.x：發行 JAR 在 build/libs。
          - target: mc1.21-forge
            project: platform-forge-1.21
            jar_dir: platforms/forge/1.21/versions/1.21
            java: "21"
          - target: mc1.21.1-forge
            project: platform-forge-1.21.1
            jar_dir: platforms/forge/1.21/versions/1.21.1
            java: "21"
          - target: mc1.21.3-forge
            project: platform-forge-1.21.3
            jar_dir: platforms/forge/1.21/versions/1.21.3
            java: "21"
          - target: mc1.21.4-forge
            project: platform-forge-1.21.4
            jar_dir: platforms/forge/1.21/versions/1.21.4
            java: "21"
          - target: mc1.21.5-forge
            project: platform-forge-1.21.5
            jar_dir: platforms/forge/1.21/versions/1.21.5
            java: "21"
          - target: mc1.21.6-forge
            project: platform-forge-1.21.6
            jar_dir: platforms/forge/1.21/versions/1.21.6
            java: "21"
          - target: mc1.21.7-forge
            project: platform-forge-1.21.7
            jar_dir: platforms/forge/1.21/versions/1.21.7
            java: "21"
          - target: mc1.21.8-forge
            project: platform-forge-1.21.8
            jar_dir: platforms/forge/1.21/versions/1.21.8
            java: "21"
          - target: mc1.21.9-forge
            project: platform-forge-1.21.9
            jar_dir: platforms/forge/1.21/versions/1.21.9
            java: "21"
          - target: mc1.21.10-forge
            project: platform-forge-1.21.10
            jar_dir: platforms/forge/1.21/versions/1.21.10
            java: "21"
          - target: mc1.21.11-forge
            project: platform-forge-1.21.11
            jar_dir: platforms/forge/1.21/versions/1.21.11
            java: "21"
          # Forge 26.x
          - target: mc26.1-forge
            project: platform-forge-26.1
            jar_dir: platforms/forge/26.x/versions/26.1
            java: "25"
          - target: mc26.1.1-forge
            project: platform-forge-26.1.1
            jar_dir: platforms/forge/26.x/versions/26.1.1
            java: "25"
          - target: mc26.1.2-forge
            project: platform-forge-26.1.2
            jar_dir: platforms/forge/26.x/versions/26.1.2
            java: "25"
          - target: mc26.2-forge
            project: platform-forge-26.2
            jar_dir: platforms/forge/26.x/versions/26.2
            java: "25"
          # NeoForge
          - target: mc1.20.1-neoforge
            project: platform-neoforge-1.20.1
            jar_dir: platforms/neoforge/1.20.1
            java: "21"
          - target: mc1.21.1-neoforge
            project: platform-neoforge-1.21.1
            jar_dir: platforms/neoforge/1.21/versions/1.21.1
            java: "21"
          - target: mc1.21.3-neoforge
            project: platform-neoforge-1.21.3
            jar_dir: platforms/neoforge/1.21/versions/1.21.3
            java: "21"
          - target: mc1.21.11-neoforge
            project: platform-neoforge-1.21.11
            jar_dir: platforms/neoforge/1.21/versions/1.21.11
            java: "21"
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v7

      - name: 設定 Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          add-job-summary: on-failure

      - name: 建置目標
        id: build
        if: >-
          needs.plan.outputs.targets == '' ||
          contains(needs.plan.outputs.targets, format(',{0},', matrix.target))
        uses: ./.github/actions/gradle-build
        with:
          args: ${{ matrix.standalone && '--no-daemon build' || format('--no-daemon --max-workers=2 -PtargetPlatform={0} :{1}:build', matrix.target, matrix.project) }}
          working-directory: ${{ matrix.standalone && matrix.jar_dir || '.' }}

      - name: 用標準檔名收集
        if: >-
          success() && (needs.plan.outputs.targets == '' ||
          contains(needs.plan.outputs.targets, format(',{0},', matrix.target)))
        env:
          JAR_DIR: ${{ matrix.jar_dir }}
          VERSION: ${{ needs.plan.outputs.version }}
          ASSET_NAME: MCAutoTranslationTool-${{ needs.plan.outputs.version }}-${{ matrix.target }}.jar
        run: |
          set -euo pipefail
          mkdir -p dist
          # 用版本號精確比對，避免撿到舊版本殘留的 JAR（本機建置目錄常常有）。
          # 依序找：整合包的 release-assets、Forge 1.16.5-1.20.1 的 release、其餘的 libs。
          jar=""
          for dir in "$JAR_DIR/build/release-assets" "$JAR_DIR/build/release" "$JAR_DIR/build/libs"; do
            [[ -d "$dir" ]] || continue
            mapfile -t found < <(find "$dir" -maxdepth 1 -type f -name "*-$VERSION.jar" \
              ! -name '*-dev.jar' ! -name '*-sources.jar' | sort)
            if [[ "${#found[@]}" -eq 1 ]]; then
              jar="${found[0]}"
              break
            fi
            if [[ "${#found[@]}" -gt 1 ]]; then
              echo "在 $dir 找到多個版本為 $VERSION 的 JAR，無法決定要用哪一個：" >&2
              printf '%s\n' "${found[@]}" >&2
              exit 1
            fi
          done
          if [[ -z "$jar" ]]; then
            echo "在 $JAR_DIR 找不到版本 $VERSION 的 JAR，以下是找到的檔案：" >&2
            find "$JAR_DIR/build" -maxdepth 3 -name '*.jar' 2>/dev/null | sort | head -50 >&2 || true
            exit 1
          fi
          cp "$jar" "dist/$ASSET_NAME"
          ls -l "dist/$ASSET_NAME"

      - name: 上傳 ${{ matrix.target }}
        if: >-
          success() && (needs.plan.outputs.targets == '' ||
          contains(needs.plan.outputs.targets, format(',{0},', matrix.target)))
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: 彙整並開 PR
    needs: [plan, build-target]
    if: always() && needs.plan.result == 'success' && needs['build-target'].result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v7

      - name: 設定 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 下載所有目標的 JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir dist
          find dist -type f -name '*.jar' | sort

      - name: 收集到 downloads 並產生 checksum
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          target_dir="downloads/$VERSION"
          mkdir -p "$target_dir"
          find dist -type f -name '*.jar' -exec cp {} "$target_dir/" \;
          count="$(find "$target_dir" -maxdepth 1 -type f -name '*.jar' | wc -l)"
          echo "收集到 $count 顆 JAR"
          if [[ "$count" -eq 0 ]]; then
            echo "沒有收集到任何 JAR" >&2
            exit 1
          fi
          ( cd "$target_dir" && sha256sum -- *.jar > SHA256SUMS.txt )
          ls -l "$target_dir"

      - name: 用專案的驗證器檢查
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          target_dir="downloads/$VERSION"
          mapfile -t jars < <(find "$target_dir" -maxdepth 1 -type f -name '*.jar' | sort)
          python3 scripts/verify_release_jars.py \
            --checksum-file "$target_dir/SHA256SUMS.txt" \
            --require-complete-checksums \
            "${jars[@]}"

      - name: 檢查目標數量是否為 33
        if: needs.plan.outputs.full == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          count="$(find "downloads/$VERSION" -maxdepth 1 -type f -name '*.jar' | wc -l)"
          if [[ "$count" -ne 33 ]]; then
            echo "發布目錄必須剛好有 33 顆目標 JAR，實際 $count 顆" >&2
            exit 1
          fi

      - name: 開 PR
        if: needs.plan.outputs.full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          branch="release/prepare-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add "downloads/$VERSION"
          if git diff --cached --quiet; then
            echo "downloads/$VERSION 與目前內容相同，不需要開 PR"
            exit 0
          fi
          git commit -m "chore(release): 準備 $VERSION 的發布資產"
          git push --force-with-lease origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(release): 準備 $VERSION 的發布資產" \
            --body "由「準備發布資產」workflow 自動產生。合併後 push 到 main 會觸發發布流程。" \
            || echo "PR 可能已存在，繼續。"
          # 用 GITHUB_TOKEN 開的 PR 不會觸發其他 workflow，所以手動觸發一次建置，
          # 讓分支保護要求的 CI 總結 能在這個 PR 上產生。
          gh workflow run build.yml --ref "$branch"
