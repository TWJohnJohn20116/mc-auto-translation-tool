name: 準備發布資產

# 一鍵把 downloads/<mod_version> 準備好：建置 48 個目標、用標準檔名收集、產生
# SHA256SUMS.txt、跑 verify_release_jars.py 驗證，然後開 PR。
# 原本這一步是在本機手動做的（見 AGENTS.md 的發布流程）。
#
# 刻意不放在 PR 路徑上：48 個目標各要 2-8 分鐘，一次約 10～20 分鐘牆鐘時間。

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          要準備的版本；留空則讀 gradle.properties 的 mod_version。
          指定的值必須與 mod_version 一致（JAR 檔名由 Gradle 的 mod_version 決定），
          不一致會在 plan 階段直接失敗。
        required: false
        default: ""
        type: string
      targets:
        description: >-
          逗號分隔的目標名稱（例如 mc1.21.7-forge），留空則全部 48 個。
          只指定部分目標時不會開 PR，僅用來煙霧測試。
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  plan:
    name: 解析版本與目標
    runs-on: ubuntu-24.04
    # 與 build.yml 的 plan 同值。這一支卡住時佔的是 concurrency: prepare-release（不取消），
    # 後面所有發布都會排隊等它吃滿預設的 360 分鐘。
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      matrix: ${{ steps.resolve.outputs.matrix }}
      full: ${{ steps.resolve.outputs.full }}
      target_count: ${{ steps.resolve.outputs.target_count }}
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v7

      - name: 解析版本與要建置的目標
        id: resolve
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
          REQUESTED: ${{ github.event.inputs.targets }}
        run: |
          set -euo pipefail
          # 平台 JAR 的檔名由 Gradle 的 mod_version 決定，但 version 只被當成檔名與目錄名。
          # 兩者不一致時（例如 version=1.5 而 mod_version=1.4），收集步驟會用
          # "*-<version>.jar" 找不到任何產物，48 個 build-target 全部建完（10～20 分鐘）才在
          # 最後一步集體失敗，assemble 也跟著不執行。這裡在幾秒內就擋下來。
          # 讀取與字元白名單都在 scripts/ci/read-mod-version.sh，與 publish-release.yml 共用。
          mod_version="$(bash scripts/ci/read-mod-version.sh)"
          version="${REQUESTED_VERSION:-}"
          if [[ -z "$version" ]]; then
            version="$mod_version"
          elif [[ "$version" != "$mod_version" ]]; then
            echo "::error::version=$version 與 gradle.properties 的 mod_version=$mod_version 不一致；請先在同一個 commit 改 gradle.properties，或省略 version 讓它讀 mod_version" >&2
            exit 1
          fi
          requested="$(printf '%s' "${REQUESTED:-}" | tr -d '[:space:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ -z "$requested" ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

          # 48 個發布目標的權威清單，必須與 publish-release.yml 的 expected 陣列一致。
          # 放在這裡才能用動態 matrix：只有被要求的目標會開 runner。
          TARGETS_JSON="$(cat <<'JSON'
          [
            {"target": "mc1.8.9-forge", "project": "", "jar_dir": "platforms/forge/legacy/1.8.9", "standalone": true, "java": "8"},
            {"target": "mc1.12.2-forge", "project": "", "jar_dir": "platforms/forge/legacy/1.12.2", "standalone": true, "java": "8"},
            {"target": "mc1.13.x-fabric", "project": "platform-fabric-1.13.x", "jar_dir": "platforms/fabric/1.13/bundle", "java": "21"},
            {"target": "mc1.14-1.15.x-fabric", "project": "platform-fabric-1.14-1.15.x", "jar_dir": "platforms/fabric/1.14-1.15/bundle", "java": "21"},
            {"target": "mc1.16.x-fabric", "project": "platform-fabric-1.16.x", "jar_dir": "platforms/fabric/1.16/bundle", "java": "21"},
            {"target": "mc1.17-1.18.x-fabric", "project": "platform-fabric-1.17-1.18.x", "jar_dir": "platforms/fabric/1.17-1.18/bundle", "java": "21"},
            {"target": "mc1.19.x-fabric", "project": "platform-fabric-1.19.x", "jar_dir": "platforms/fabric/1.19/bundle", "java": "21"},
            {"target": "mc1.20.x-fabric", "project": "platform-fabric-1.20.x", "jar_dir": "platforms/fabric/1.20/bundle", "java": "21"},
            {"target": "mc1.21.x-fabric", "project": "platform-fabric-1.21.x", "jar_dir": "platforms/fabric/1.21/bundle", "java": "21"},
            {"target": "mc26.x-fabric", "project": "platform-fabric-26.x", "jar_dir": "platforms/fabric/26.x/bundle", "java": "25"},
            {"target": "mc1.16.5-forge", "project": "platform-forge-1.16.5", "jar_dir": "platforms/forge/modern/1.16.5", "java": "17"},
            {"target": "mc1.18.2-forge", "project": "platform-forge-1.18.2", "jar_dir": "platforms/forge/modern/1.18.2", "java": "17"},
            {"target": "mc1.19.2-forge", "project": "platform-forge-1.19.2", "jar_dir": "platforms/forge/modern/1.19.2", "java": "17"},
            {"target": "mc1.20.1-forge", "project": "platform-forge-1.20.1", "jar_dir": "platforms/forge/modern/1.20.1", "java": "17"},
            {"target": "mc1.21-forge", "project": "platform-forge-1.21", "jar_dir": "platforms/forge/1.21/versions/1.21", "java": "21"},
            {"target": "mc1.21.1-forge", "project": "platform-forge-1.21.1", "jar_dir": "platforms/forge/1.21/versions/1.21.1", "java": "21"},
            {"target": "mc1.21.3-forge", "project": "platform-forge-1.21.3", "jar_dir": "platforms/forge/1.21/versions/1.21.3", "java": "21"},
            {"target": "mc1.21.4-forge", "project": "platform-forge-1.21.4", "jar_dir": "platforms/forge/1.21/versions/1.21.4", "java": "21"},
            {"target": "mc1.21.5-forge", "project": "platform-forge-1.21.5", "jar_dir": "platforms/forge/1.21/versions/1.21.5", "java": "21"},
            {"target": "mc1.21.6-forge", "project": "platform-forge-1.21.6", "jar_dir": "platforms/forge/1.21/versions/1.21.6", "java": "21"},
            {"target": "mc1.21.7-forge", "project": "platform-forge-1.21.7", "jar_dir": "platforms/forge/1.21/versions/1.21.7", "java": "21"},
            {"target": "mc1.21.8-forge", "project": "platform-forge-1.21.8", "jar_dir": "platforms/forge/1.21/versions/1.21.8", "java": "21"},
            {"target": "mc1.21.9-forge", "project": "platform-forge-1.21.9", "jar_dir": "platforms/forge/1.21/versions/1.21.9", "java": "21"},
            {"target": "mc1.21.10-forge", "project": "platform-forge-1.21.10", "jar_dir": "platforms/forge/1.21/versions/1.21.10", "java": "21"},
            {"target": "mc1.21.11-forge", "project": "platform-forge-1.21.11", "jar_dir": "platforms/forge/1.21/versions/1.21.11", "java": "21"},
            {"target": "mc26.1-forge", "project": "platform-forge-26.1", "jar_dir": "platforms/forge/26.x/versions/26.1", "java": "25"},
            {"target": "mc26.1.1-forge", "project": "platform-forge-26.1.1", "jar_dir": "platforms/forge/26.x/versions/26.1.1", "java": "25"},
            {"target": "mc26.1.2-forge", "project": "platform-forge-26.1.2", "jar_dir": "platforms/forge/26.x/versions/26.1.2", "java": "25"},
            {"target": "mc26.2-forge", "project": "platform-forge-26.2", "jar_dir": "platforms/forge/26.x/versions/26.2", "java": "25"},
            {"target": "mc1.20.1-neoforge", "project": "platform-neoforge-1.20.1", "jar_dir": "platforms/neoforge/1.20.1", "java": "21"},
            {"target": "mc1.21.1-neoforge", "project": "platform-neoforge-1.21.1", "jar_dir": "platforms/neoforge/1.21/versions/1.21.1", "java": "21"},
            {"target": "mc1.21.3-neoforge", "project": "platform-neoforge-1.21.3", "jar_dir": "platforms/neoforge/1.21/versions/1.21.3", "java": "21"},
            {"target": "mc1.21.11-neoforge", "project": "platform-neoforge-1.21.11", "jar_dir": "platforms/neoforge/1.21/versions/1.21.11", "java": "21"},
            {"target": "mc1.20.4-neoforge", "project": "platform-neoforge-1.20.4", "jar_dir": "platforms/neoforge/1.20/versions/1.20.4", "java": "21"},
            {"target": "mc1.20.6-neoforge", "project": "platform-neoforge-1.20.6", "jar_dir": "platforms/neoforge/1.20/versions/1.20.6", "java": "21"},
            {"target": "mc1.21-neoforge", "project": "platform-neoforge-1.21", "jar_dir": "platforms/neoforge/1.21/versions/1.21", "java": "21"},
            {"target": "mc1.21.2-neoforge", "project": "platform-neoforge-1.21.2", "jar_dir": "platforms/neoforge/1.21/versions/1.21.2", "java": "21"},
            {"target": "mc1.21.4-neoforge", "project": "platform-neoforge-1.21.4", "jar_dir": "platforms/neoforge/1.21/versions/1.21.4", "java": "21"},
            {"target": "mc1.21.5-neoforge", "project": "platform-neoforge-1.21.5", "jar_dir": "platforms/neoforge/1.21/versions/1.21.5", "java": "21"},
            {"target": "mc1.21.6-neoforge", "project": "platform-neoforge-1.21.6", "jar_dir": "platforms/neoforge/1.21/versions/1.21.6", "java": "21"},
            {"target": "mc1.21.7-neoforge", "project": "platform-neoforge-1.21.7", "jar_dir": "platforms/neoforge/1.21/versions/1.21.7", "java": "21"},
            {"target": "mc1.21.8-neoforge", "project": "platform-neoforge-1.21.8", "jar_dir": "platforms/neoforge/1.21/versions/1.21.8", "java": "21"},
            {"target": "mc1.21.9-neoforge", "project": "platform-neoforge-1.21.9", "jar_dir": "platforms/neoforge/1.21/versions/1.21.9", "java": "21"},
            {"target": "mc1.21.10-neoforge", "project": "platform-neoforge-1.21.10", "jar_dir": "platforms/neoforge/1.21/versions/1.21.10", "java": "21"},
            {"target": "mc26.1-neoforge", "project": "platform-neoforge-26.1", "jar_dir": "platforms/neoforge/26.x/versions/26.1", "java": "25"},
            {"target": "mc26.1.1-neoforge", "project": "platform-neoforge-26.1.1", "jar_dir": "platforms/neoforge/26.x/versions/26.1.1", "java": "25"},
            {"target": "mc26.1.2-neoforge", "project": "platform-neoforge-26.1.2", "jar_dir": "platforms/neoforge/26.x/versions/26.1.2", "java": "25"},
            {"target": "mc26.2-neoforge", "project": "platform-neoforge-26.2", "jar_dir": "platforms/neoforge/26.x/versions/26.2", "java": "25"}
          ]
          JSON
          )"
          export TARGETS_JSON

          # -PtargetPlatform 吃的是平台名稱（forge-1.21.7、fabric-1.13.x），不是發布資產名稱
          # （mc1.21.7-forge）。這裡從目標名稱推導；推錯會在 settings 評估階段就失敗。
          # 推導邏輯在 scripts/ci/derive-prepare-targets.py：寫在 run 內的 Python 需要單引號
          # heredoc，會觸發 shellcheck SC2016，而那段程式碼也要能被單獨測試。
          TARGETS_JSON="$(python3 scripts/ci/derive-prepare-targets.py "$TARGETS_JSON")"
          export TARGETS_JSON

          if [[ -z "$requested" ]]; then
            python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os
          targets = json.loads(os.environ["TARGETS_JSON"])
          print("matrix=" + json.dumps({"include": targets}))
          # 目標數由這份清單自己算，不要讓 workflow 裡另外寫一個 48。
          print("target_count=" + str(len(targets)))
          PY
            echo "要準備 $version 的全部目標"
          else
            python3 - "$requested" >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          requested = [name for name in sys.argv[1].split(",") if name]
          # targets 只打了逗號或空白時 requested 是空清單：既不報錯也不選任何目標，於是照樣輸出
          # matrix={"include": []}，build-target 在展開階段就以 GitHub 的「Matrix vector … does not
          # contain any values」失敗（訊息完全不提 targets），assemble 也永遠不會執行。另外兩支
          # workflow 早就擋掉這個輸入（build.yml 的 ::error::、legacy-targets.yml 的哨兵），
          # prepare-release 是唯一漏掉的第三支。
          if not requested:
              print("::error::targets 只給了逗號或空白，沒有指定任何目標；留空才會執行全部目標",
                    file=sys.stderr)
              sys.exit(1)
          targets = json.loads(os.environ["TARGETS_JSON"])
          known = {entry["target"] for entry in targets}
          unknown = [name for name in requested if name not in known]
          if unknown:
              print("::error::不存在的目標：" + "、".join(unknown), file=sys.stderr)
              print("可用目標：" + "、".join(sorted(known)), file=sys.stderr)
              sys.exit(1)
          selected = [entry for entry in targets if entry["target"] in requested]
          print("matrix=" + json.dumps({"include": selected}))
          print("target_count=" + str(len(selected)))
          PY
            echo "只建置指定的目標：$requested（不會開 PR，也不會動 downloads/）"
          fi

  build-target:
    name: 建置 ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v7

      - name: 設定 Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          add-job-summary: on-failure

      - name: 建置目標
        uses: ./.github/actions/gradle-build
        with:
          args: ${{ matrix.standalone && '--no-daemon build' || format('--no-daemon --max-workers=2 -PtargetPlatform={0} :{1}:build', matrix.platform, matrix.project) }}
          working-directory: ${{ matrix.standalone && matrix.jar_dir || '.' }}

      - name: 用標準檔名收集
        env:
          JAR_DIR: ${{ matrix.jar_dir }}
          VERSION: ${{ needs.plan.outputs.version }}
          ASSET_NAME: MCAutoTranslationTool-${{ needs.plan.outputs.version }}-${{ matrix.target }}.jar
        run: |
          set -euo pipefail
          mkdir -p dist
          # 用版本號精確比對，避免撿到舊版本殘留的 JAR（本機建置目錄常常有）。
          # 三個目錄全部掃描：bundle 的 release-assets 與 libs 可能同時存在，只取「第一個命中的
          # 目錄」會讓「同一顆同時存在於兩個目錄」這種佈局錯誤默默過關（_assemble_*.py 已複製
          # 同一套邏輯，本機執行時真的會踩到）。
          candidates=()
          for dir in "$JAR_DIR/build/release-assets" "$JAR_DIR/build/release" "$JAR_DIR/build/libs"; do
            [[ -d "$dir" ]] || continue
            mapfile -t found < <(find "$dir" -maxdepth 1 -type f -name "*-$VERSION.jar" \
              ! -name '*-dev.jar' ! -name '*-sources.jar' | sort)
            if [[ "${#found[@]}" -gt 0 ]]; then
              candidates+=("${found[@]}")
            fi
          done
          if [[ "${#candidates[@]}" -ne 1 ]]; then
            echo "在 $JAR_DIR 找到 ${#candidates[@]} 顆版本為 $VERSION 的 JAR，必須剛好 1 顆：" >&2
            printf '%s\n' "${candidates[@]:-}" >&2
            find "$JAR_DIR/build" -maxdepth 3 -name '*.jar' 2>/dev/null | sort | head -50 >&2 || true
            exit 1
          fi
          jar="${candidates[0]}"
          cp "$jar" "dist/$ASSET_NAME"
          ls -l "dist/$ASSET_NAME"

      - name: 上傳 ${{ matrix.target }}
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 3

  assemble:
    name: 彙整並開 PR
    needs: [plan, build-target]
    if: always() && needs.plan.result == 'success' && needs['build-target'].result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: 取出原始碼
        uses: actions/checkout@v7
        with:
          # 需要完整的 ref 歷史：下面要用 origin/release/prepare-<version> 的實際 commit 當
          # --force-with-lease 的預期值，並確認那個分支上只有本 workflow 產生的 commit。
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: 下載所有目標的 JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir dist
          find dist -type f -name '*.jar' | sort

      - name: 確認 plan 至少選了一個目標
        env:
          TARGET_COUNT: ${{ needs.plan.outputs.target_count }}
        run: |
          set -euo pipefail
          # 第二道防線：plan 的空輸入守衛被改掉時，這裡仍然不會讓「0 顆 JAR 也算彙整成功」成立。
          if [[ -z "${TARGET_COUNT:-}" || "$TARGET_COUNT" -le 0 ]]; then
            echo "plan 沒有選到任何目標（target_count=${TARGET_COUNT:-}），不彙整" >&2
            exit 1
          fi

      - name: 收集到 downloads 並產生 checksum
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          set -euo pipefail
          if [[ "$FULL" == "true" ]]; then
            target_dir="downloads/$VERSION"
          else
            # 煙霧測試（只指定部分目標）永遠不碰 downloads/：先前它會先 rm -rf downloads/<version>
            # 再只寫入那幾顆，於是「驗證通過」只描述了 2 顆，而版控裡的目標目錄已經被刪掉，
            # 之後一個 git add -A 就會把殘缺佈局提交進去。
            target_dir="build/partial-release/$VERSION"
          fi
          # 整個目錄重新產生，避免舊版本殘留的檔案或分片（沿用 scripts/tools/_assemble_*.py）。
          rm -rf "$target_dir"
          mkdir -p "$target_dir"
          find dist -type f -name '*.jar' -exec cp {} "$target_dir/" \;
          count="$(find "$target_dir" -maxdepth 1 -type f -name '*.jar' | wc -l)"
          echo "收集到 $count 顆 JAR"
          if [[ "$count" -eq 0 ]]; then
            echo "沒有收集到任何 JAR" >&2
            exit 1
          fi
          # checksum 記的是「完整 JAR」的雜湊，而 fabric 的 JAR 超過 600 KiB 要切成
          # .part-aa／.part-ab…，所以先算雜湊再切。分片之後就沒有完整檔了。
          # 門檻與後綴公式只有一份定義：scripts/release_layout.py（驗證端也 import 同一份）。
          python3 - "$target_dir" <<'PY'
          import hashlib, pathlib, sys

          sys.path.insert(0, "scripts")
          from release_layout import PART_SIZE, part_suffix

          target = pathlib.Path(sys.argv[1])
          lines = []
          for jar in sorted(target.glob("*.jar")):
              data = jar.read_bytes()
              lines.append(f"{hashlib.sha256(data).hexdigest()}  {jar.name}")
              if jar.name.endswith("-fabric.jar") and len(data) > PART_SIZE:
                  for index in range(0, len(data), PART_SIZE):
                      part = index // PART_SIZE
                      suffix = part_suffix(part)
                      (jar.parent / f"{jar.name}.part-{suffix}").write_bytes(data[index:index + PART_SIZE])
                  jar.unlink()
          (target / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"寫入 {len(lines)} 顆邏輯 JAR 的 checksum")
          PY
          find "$target_dir" -maxdepth 1 -type f -printf '%10s  %f\n' | sort -k2

      - name: 用專案的驗證器檢查
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          FULL: ${{ needs.plan.outputs.full }}
        run: |
          set -euo pipefail
          if [[ "$FULL" == "true" ]]; then
            target_dir="downloads/$VERSION"
          else
            target_dir="build/partial-release/$VERSION"
          fi
          # 被分片的 JAR 要用邏輯名稱餵給驗證器，它自己會把分片接回來（同 build.gradle 的作法）。
          mapfile -t jars < <(
            {
              find "$target_dir" -maxdepth 1 -type f -name '*.jar'
              while IFS= read -r part; do printf '%s\n' "${part%.part-aa}"; done \
                < <(find "$target_dir" -maxdepth 1 -type f -name '*.jar.part-aa')
            } | sort
          )
          echo "驗證 ${#jars[@]} 顆邏輯 JAR"
          python3 scripts/verify_release_jars.py \
            --checksum-file "$target_dir/SHA256SUMS.txt" \
            --require-complete-checksums \
            "${jars[@]}"

      - name: 檢查目標數量是否符合 plan 的清單
        if: needs.plan.outputs.full == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          EXPECTED_COUNT: ${{ needs.plan.outputs.target_count }}
        run: |
          set -euo pipefail
          target_dir="downloads/$VERSION"
          count="$(
            {
              find "$target_dir" -maxdepth 1 -type f -name '*.jar'
              find "$target_dir" -maxdepth 1 -type f -name '*.jar.part-aa'
            } | wc -l
          )"
          # 這個數字來自 plan 的 TARGETS_JSON 長度，不是另外手寫的常數：新增或移除一個目標時
          # 只改 JSON，這裡跟著走（先前寫死 48，訊息還會誤導成「建置少了／多了」）。
          if [[ "$count" -ne "$EXPECTED_COUNT" ]]; then
            echo "發布目錄必須剛好有 $EXPECTED_COUNT 顆目標 JAR，實際 $count 顆" >&2
            exit 1
          fi

      - name: 產生可安裝清單（release-assets.txt）
        if: needs.plan.outputs.full == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # downloads/<版本>/release-assets.txt 是四份 README 與官網唯一的「真實檔名」權威：
          # 31 個可安裝檔名只有 prepare_release_assets.py 推得出來（fabric-all 加四個 Forge
          # 家族合併），而 downloads/ 只由這支 workflow 提交，所以在這裡跑同一支腳本、只留清單。
          # 少了這一步，網站測試裡「有 manifest 就以它為權威」的分支永遠走不到。
          python3 scripts/prepare_release_assets.py \
            --release-dir "downloads/$VERSION" \
            --output-dir build/release-assets \
            --version "$VERSION"
          cp build/release-assets/release-assets.txt "downloads/$VERSION/release-assets.txt"
          echo "可安裝清單 $(grep -c . "downloads/$VERSION/release-assets.txt") 行"

      - name: 移除舊版本的 downloads 目錄
        if: needs.plan.outputs.full == 'true'
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # downloads/ 只是發布資產的暫存區：舊版本早已隨 Release 發布出去，
          # 目錄留在倉庫裡只會累積體積（2026-10-05 清理前有 22 個殘留目錄、235 MB）。
          # 只保留目前 mod_version 的目錄。
          find downloads -mindepth 1 -maxdepth 1 -type d ! -name "$VERSION" -print -exec rm -rf {} +

      - name: 開 PR
        if: needs.plan.outputs.full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          branch="release/prepare-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          # 用 -A：除了新增／更新目前版本，也要把上面移除的舊版本目錄一併納入。
          git add -A downloads
          if git diff --cached --quiet; then
            echo "downloads/$VERSION 與目前內容相同，不需要開 PR"
            exit 0
          fi
          git commit -m "chore(release): 準備 $VERSION 的發布資產"
          # 「重跑」是這支 workflow 最常見的情境，而 actions/checkout 預設 fetch-depth: 1 不會建立
          # refs/remotes/origin/release/prepare-<version>，於是 --force-with-lease 的語意變成
          # 「遠端不得存在這個 ref」：分支一存在，push 必被拒（! [rejected] ... stale info）。
          # 這裡先 fetch，再用明確的預期 SHA 當 lease；同時確認遠端分支上只有本 workflow 產生的
          # commit——AGENTS.md 要求在 release PR 裡人工補 CHANGELOG 區段、四份 README 的下載連結與
          # website/app/page.tsx 的版本文案，那些 commit 不能被下一次重跑無聲覆蓋。
          lease=()
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            # main 一起抓：下面的守衛要比對「main 之後的 commit」，不能假設 origin/main 已經存在。
            git fetch --no-tags origin "refs/heads/$branch:refs/remotes/origin/$branch" \
              "refs/heads/main:refs/remotes/origin/main"
            remote_sha="$(git rev-parse "refs/remotes/origin/$branch")"
            # 比較基準必須是 origin/main，不能是 `--not --remotes=origin`：上一行剛把 $remote_sha
            # 建成 refs/remotes/origin/$branch，那個旗標於是把要比對的 commit 自己也排除掉，集合
            # 恆為空、守衛永遠放行，重跑就無聲覆蓋分支上的人工 commit（AGENTS.md 要求在 release
            # PR 裡手改 CHANGELOG／README／website，那些 commit 正是受害者）。逐個 commit 比對
            # author 而不只比對 subject，才不會把別人的同名 commit 當成自己人。
            bot_commit="$(printf 'github-actions[bot]\t%s' "chore(release): 準備 $VERSION 的發布資產")"
            unexpected="$(git log --format='%an%x09%s' "$remote_sha" --not refs/remotes/origin/main \
              | grep -vxF -- "$bot_commit" || true)"
            if [[ -n "$unexpected" ]]; then
              echo "::error::$branch 上有非本 workflow 產生的 commit（author 與 subject 以 tab 分隔），不覆蓋：" >&2
              printf '%s\n' "$unexpected" >&2
              exit 1
            fi
            lease=(--force-with-lease="refs/heads/$branch:$remote_sha")
          fi
          git push "${lease[@]}" origin "$branch"
          # 不要用 `gh pr create ... || echo`：那會讓建立失敗（權限、暫時性 API 錯誤）變成
          # 綠燈，2026-10-21 與 2026-10-21 之後各發生一次，兩次都是人工補開 PR。
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "PR 已存在（$branch），略過建立"
          else
            gh pr create --base main --head "$branch" \
              --title "chore(release): 準備 $VERSION 的發布資產" \
              --body "由「準備發布資產」workflow 自動產生。合併後 push 到 main 會觸發發布流程。"
          fi
          # 用 GITHUB_TOKEN 開的 PR 不會觸發其他 workflow，所以手動觸發一次建置，
          # 讓分支保護要求的 CI 總結 能在這個 PR 上產生。
          gh workflow run build.yml --ref "$branch"
