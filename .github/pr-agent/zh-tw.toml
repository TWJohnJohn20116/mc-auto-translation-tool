# PR-Agent 固定文字語系表（繁體中文）。鍵名以套件內的 en.toml 為準，
# PR-Agent 0.50.0 只內建 en／es 兩份，繁體中文這份由 .github/workflows/ai-review.yml
# 在 runner 上複製到 pr_agent/settings/i18n/zh-tw.toml 後生效。
# 缺鍵或 {placeholder} 對不上時，該則文字自動回退英文，不會讓留言壞掉。
# 升級 pr-agent 版本時，請比對新版 en.toml 是否新增鍵。

[review]
intro = "以下是協助審查的重點觀察："
estimated_effort = "預估審查工作量"
no_relevant_tests = "沒有相關測試"
contains_tests = "PR 含有測試"
security_concerns = "安全性疑慮"
no_security_concerns = "未發現安全性疑慮"
focus_areas = "建議優先審查的範圍"
no_major_issues = "未發現重大問題"
possible_issue = "可能問題"
resolved_findings = "已解決的發現"
progress = "正在準備審查……"
updated_until_commit = "審查已更新至 commit {commit}"
persistent_link = "持續性審查"
persistent_updated = "{link} 已更新至最新 commit {commit}"

[improve]
no_suggestions = "這個 PR 沒有可改進的建議。"
no_suggestions_for_pr = "沒有找到可套用於這個 PR 的程式碼建議。"
no_suggestions_in_chunks = "在成功分析的片段中沒有找到程式碼建議。"
no_suggestions_in_chunks_inline = "在成功分析的片段中沒有找到建議。"
optional_intro = "以下是可選的程式碼建議："
category = "類別"
suggestion = "建議"
impact = "影響"
importance = "建議重要度"
why = "理由"
high = "高"
medium = "中"
low = "低"

[run_details]
title = "代理執行詳細資訊"
model = "模型"
models = "模型"
fallback = "備援"
includes_fallback = "含備援"
tokens = "Token"
tokens_in = "輸入"
tokens_out = "輸出"
tokens_total = "合計"
prompt_cache = "提示快取"
cache_read = "讀取"
cache_written = "寫入"
time_cost = "耗時"
ai_calls = "AI 呼叫次數"
