plugins {
    id "base"
}

group = "org.universaltranslator"
version = project.mod_version

// Gradle itself runs on a modern JDK. Toolchains make compilation reproducible while
// each module's existing options.release setting preserves its Java 8/17/21 bytecode target.
subprojects {
    def requestedToolchain = providers.gradleProperty("toolchainVersion").orNull
    def requiredToolchain = requestedToolchain == null
            ? (project.name.startsWith("platform-fabric-26.") ||
               project.name.startsWith("platform-forge-26.") ||
               project.name.startsWith("platform-neoforge-26.") ? 25 : 21)
            : Integer.parseInt(requestedToolchain)

    pluginManager.withPlugin("java") {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(requiredToolchain)
            }
        }
    }
}

tasks.register("validateMixinConfigs") {
    group = "verification"
    description = "Validates every source Mixin config and rejects unsupported Java compatibility levels."

    doLast {
        def compatibilityLevels = [
                "JAVA_6", "JAVA_7", "JAVA_8", "JAVA_9", "JAVA_10", "JAVA_11",
                "JAVA_12", "JAVA_13", "JAVA_14", "JAVA_15", "JAVA_16", "JAVA_17",
                "JAVA_18", "JAVA_19", "JAVA_20", "JAVA_21"
        ]
        def configs = fileTree("platforms") {
            include "**/src/**/*.mixins.json"
        }

        configs.each { config ->
            def parsed
            try {
                parsed = new groovy.json.JsonSlurper().parse(config)
            } catch (Exception error) {
                throw new GradleException("Invalid Mixin JSON: ${relativePath(config)}", error)
            }

            def level = parsed.compatibilityLevel
            if (level != null && !compatibilityLevels.contains(level)) {
                throw new GradleException(
                        "Unsupported Mixin compatibilityLevel '${level}' in ${relativePath(config)}; " +
                                "the bundled Mixin 0.8.7 runtime supports at most JAVA_21"
                )
            }

            def relativeConfigPath = relativePath(config).replace('\\', '/')
            def maximumLevel = relativeConfigPath.contains("/1.16.5/") ? "JAVA_8" :
                    (relativeConfigPath.contains("/1.18.2/") || relativeConfigPath.contains("/1.19.2/") || relativeConfigPath.contains("/1.20.1/")) ?
                            "JAVA_17" : "JAVA_21"
            if (level != null && compatibilityLevels.indexOf(level) > compatibilityLevels.indexOf(maximumLevel)) {
                throw new GradleException(
                        "Mixin compatibilityLevel '${level}' exceeds ${maximumLevel} for ${relativeConfigPath}"
                )
            }
            if ((relativeConfigPath.contains("/forge/modern/1.16.5/") ||
                    relativeConfigPath.contains("/forge/modern/1.18.2/") ||
                    relativeConfigPath.contains("/forge/modern/1.19.2/")) &&
                    parsed.injectors?.defaultRequire != 0) {
                throw new GradleException(
                        "Legacy Forge Mixin hooks must remain tolerant (defaultRequire 0): ${relativeConfigPath}"
                )
            }
        }
    }
}

tasks.register("validateSharedPlatformLayouts") {
    group = "verification"
    description = "Ensures modern multi-version platforms keep sources in shared layers."

    doLast {
        // Java sources never belong in a version directory. For NeoForge the loader
        // entrypoints live in platforms/neoforge/shared/entrypoints/<layer> and the
        // mixin config in platforms/neoforge/shared/metadata/<layer>. Only
        // META-INF/*.toml stays per version, because its versionRange is real
        // per-version data.
        def versionOwnedSources = fileTree("platforms") {
            include "fabric/26.x/26.*/src/**"
            include "forge/1.21/versions/*/src/**"
            include "forge/26.x/versions/*/src/**"
            include "neoforge/1.20/versions/*/src/**/*.java"
            include "neoforge/1.21/versions/*/src/**/*.java"
            include "neoforge/26.x/versions/*/src/**/*.java"
            include "neoforge/1.20/versions/*/src/**/*.mixins.json"
            include "neoforge/1.21/versions/*/src/**/*.mixins.json"
            include "neoforge/26.x/versions/*/src/**/*.mixins.json"
            include "neoforge/1.20/versions/*/src/**/assets/**"
            include "neoforge/1.21/versions/*/src/**/assets/**"
            include "neoforge/26.x/versions/*/src/**/assets/**"
        }.files.findAll { it.isFile() }

        if (!versionOwnedSources.isEmpty()) {
            throw new GradleException(
                    "Modern version directories must remain coordinate-only; move source differences " +
                            "into a shared API family:\n" +
                            versionOwnedSources.collect { relativePath(it) }.sort().join("\n")
            )
        }

        def requiredSharedFiles = [
                "platforms/fabric/legacy/shared.gradle",
                "platforms/fabric/legacy/shared/common/src/main/resources/fabric.mod.json",
                "platforms/fabric/26.x/shared.gradle",
                "platforms/fabric/26.x/shared/common/src/main/resources/fabric.mod.json",
                "platforms/forge/modern/shared.gradle",
                "platforms/forge/modern/shared/common/src/main/resources/META-INF/mods.toml",
                "platforms/forge/shared.gradle",
                "platforms/forge/shared/common/src/main/resources/META-INF/mods.toml",
                "platforms/forge/26.x/shared.gradle",
                "platforms/forge/26.x/shared/common/src/main/resources/pack.mcmeta",
                "platforms/neoforge/shared.gradle",
                "platforms/neoforge/shared/metadata/1.20-1.20.4/src/main/resources/universal-translator.neoforge.mixins.json",
                "platforms/neoforge/shared/metadata/1.20.6/src/main/resources/universal-translator.neoforge.mixins.json",
                "platforms/neoforge/shared/metadata/1.21/src/main/resources/universal-translator.neoforge.mixins.json",
                "platforms/neoforge/shared/metadata/26.x/src/main/resources/universal-translator.neoforge.mixins.json",
                "platforms/neoforge/shared/entrypoints/1.20.2-1.20.4/src/main/java/org/universaltranslator/forge/UniversalTranslatorNeoForgeMod.java",
                "platforms/neoforge/shared/entrypoints/1.20.6/src/main/java/org/universaltranslator/forge/UniversalTranslatorNeoForgeMod.java",
                "platforms/neoforge/shared/entrypoints/1.21-1.21.1/src/main/java/org/universaltranslator/forge/UniversalTranslatorNeoForgeMod.java",
                "platforms/neoforge/shared/entrypoints/1.21.2-1.21.8/src/main/java/org/universaltranslator/forge/UniversalTranslatorNeoForgeMod.java",
                "platforms/neoforge/shared/entrypoints/1.21.9-1.21.11/src/main/java/org/universaltranslator/forge/UniversalTranslatorNeoForgeMod.java",
                "platforms/neoforge/shared/entrypoints/26.1-26.1.2/src/main/java/org/universaltranslator/forge/UniversalTranslatorNeoForgeMod.java",
                "platforms/neoforge/shared/entrypoints/26.2/src/main/java/org/universaltranslator/forge/UniversalTranslatorNeoForgeMod.java"
        ]
        def missing = requiredSharedFiles.findAll { !file(it).isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing shared platform files:\n" + missing.join("\n"))
        }

        def forbiddenLegacyCopies = []
        def fabricVersionDir = { String gv ->
            gv.startsWith("1.16") ? "platforms/fabric/1.16/versions/${gv}" :
            gv.startsWith("1.19") ? "platforms/fabric/1.19/versions/${gv}" :
            "platforms/fabric/1.20/versions/${gv}"
        }
        ["1.16.5", "1.19.2", "1.20.1"].each { gameVersion ->
            def vDir = fabricVersionDir(gameVersion)
            [
                    "FabricConfig.java",
                    "FabricLocalTextGuard.java",
                    "FabricTranslationRuntime.java",
                    "RenderedTextBridge.java",
                    "TranslationRenderContext.java"
            ].each { name ->
                forbiddenLegacyCopies.add(
                        "${vDir}/src/client/java/" +
                                "org/universaltranslator/fabric/${name}")
            }
            ["en_us.json", "zh_cn.json", "zh_tw.json"].each { name ->
                forbiddenLegacyCopies.add(
                        "${vDir}/src/main/resources/" +
                                "assets/universal_translator/lang/${name}")
                forbiddenLegacyCopies.add(
                        "platforms/forge/modern/${gameVersion}/src/main/resources/" +
                                "assets/universal_translator/lang/${name}")
            }
            forbiddenLegacyCopies.add(
                    "${vDir}/src/main/resources/fabric.mod.json")
            [
                    "ForgeConfig.java",
                    "ForgeTranslationRuntime.java",
                    "TranslationRenderContext.java"
            ].each { name ->
                forbiddenLegacyCopies.add(
                        "platforms/forge/modern/${gameVersion}/src/main/java/" +
                                "org/universaltranslator/forge/${name}")
            }
            forbiddenLegacyCopies.add(
                    "platforms/forge/modern/${gameVersion}/src/main/resources/META-INF/mods.toml")
            forbiddenLegacyCopies.add(
                    "platforms/forge/modern/${gameVersion}/src/main/resources/pack.mcmeta")
        }
        ["1.16.5", "1.19.2"].each { gameVersion ->
            forbiddenLegacyCopies.add(
                    "platforms/fabric/legacy/${gameVersion}/src/client/java/" +
                            "org/universaltranslator/fabric/ButtonWidget.java")
            [
                    "BossBarHudContextMixin.java", "ChatHudContextMixin.java",
                    "InGameHudContextMixin.java", "PlayerListHudContextMixin.java",
                    "ScreenMixin.java", "SignEditScreenMixin.java",
                    "TextFieldWidgetMixin.java", "TextRendererMixin.java"
            ].each { name ->
                forbiddenLegacyCopies.add(
                        "platforms/fabric/legacy/${gameVersion}/src/client/java/" +
                                "org/universaltranslator/fabric/mixin/${name}")
            }
        }
        ["1.19.2", "1.20.1"].each { gameVersion ->
            ["ForgeLocalTextGuard.java", "RenderedTextBridge.java", "UniversalTranslatorForgeMod.java"].each { name ->
                forbiddenLegacyCopies.add(
                        "platforms/forge/modern/${gameVersion}/src/main/java/" +
                                "org/universaltranslator/forge/${name}")
            }
        }
        def duplicated = forbiddenLegacyCopies.findAll { file(it).exists() }
        if (!duplicated.isEmpty()) {
            throw new GradleException(
                    "Legacy shared files must not be copied back into version directories:\n" +
                            duplicated.sort().join("\n")
            )
        }
    }
}

tasks.register("validateOpaqueSelectionTextColors") {
    group = "verification"
    description = "Rejects transparent six-digit RGB colors in custom settings selection text."

    doLast {
        def transparentRgb = ~/0x[0-9A-Fa-f]{6}\b/
        def violations = fileTree("platforms") {
            include "**/UniversalTranslatorConfigScreen.java"
            include "**/UniversalTranslatorConfigScreenBase.java"
            include "**/UniversalTranslatorSettingsScreen.java"
            include "**/UniversalTranslatorScreens.java"
        }.files.findAll { source ->
            def text = source.getText("UTF-8")
            text.contains("SettingsSelectionList.displayName") && transparentRgb.matcher(text).find()
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Custom selection screens must use explicit 0xAARRGGBB text colors:\n" +
                            violations.collect { relativePath(it) }.sort().join("\n")
            )
        }
    }
}

tasks.register("validateNonOverlappingSettingsLabels") {
    group = "verification"
    description = "Prevents settings labels and compact status text from overlapping controls."

    doLast {
        def settingsScreens = fileTree("platforms") {
            include "**/UniversalTranslatorConfigScreen.java"
            include "**/UniversalTranslatorConfigScreenBase.java"
            include "**/UniversalTranslatorSettingsScreen.java"
            include "**/UniversalTranslatorScreens.java"
            include "**/LegacyConfigScreen.java"
        }.files.findAll { source ->
            source.getText("UTF-8").contains("SettingsUiAnimation.openProgress")
        }
        def overlappingPositions = [
                "layout.targetY - 11",
                "layout.endpointY - 11",
                "layout.saveY - 14"
        ]
        def violations = settingsScreens.findAll { source ->
            def text = source.getText("UTF-8")
            overlappingPositions.any { text.contains(it) }
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Custom settings screens must not draw labels in the inter-row control area:\n" +
                            violations.collect { relativePath(it) }.sort().join("\n")
            )
        }

        def missingLayoutImports = settingsScreens.findAll { source ->
            def text = source.getText("UTF-8")
            text.contains("SettingsScreenLayout.") &&
                    !text.contains("import org.universaltranslator.core.SettingsScreenLayout;")
        }
        if (!missingLayoutImports.isEmpty()) {
            throw new GradleException(
                    "Settings screens using the shared layout must import SettingsScreenLayout:\n" +
                            missingLayoutImports.collect { relativePath(it) }.sort().join("\n")
            )
        }
    }
}

tasks.register("validateOpaqueDiagnosticsTextColors") {
    group = "verification"
    description = "Rejects transparent six-digit RGB colors in custom diagnostics text."

    doLast {
        def transparentRgb = ~/0x[0-9A-Fa-f]{6}\b/
        def violations = fileTree("platforms") {
            include "**/*DiagnosticsScreen.java"
            include "**/UniversalTranslatorScreens.java"
        }.files.findAll { source ->
            def text = source.getText("UTF-8")
            text.contains("diagnostics.note") && transparentRgb.matcher(text).find()
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Custom diagnostics screens must use explicit 0xAARRGGBB text colors:\n" +
                            violations.collect { relativePath(it) }.sort().join("\n")
            )
        }
    }
}

tasks.register("validateOutgoingTranslationReentryGuards") {
    group = "verification"
    description = "Prevents translated Forge and NeoForge chat messages from being intercepted again."

    doLast {
        def outgoingClients = fileTree("platforms") {
            include "**/UniversalTranslatorForgeClient.java"
            include "**/UniversalTranslatorNeoForgeClient.java"
        }.files.findAll { source ->
            def text = source.getText("UTF-8")
            text.contains("shouldTranslateOutgoing(message)") &&
                    text.contains("sendCompletedMessage(")
        }
        def violations = outgoingClients.findAll { source ->
            def text = source.getText("UTF-8")
            !text.contains("private static boolean resendingTranslatedMessage;") ||
                    !text.contains("if (resendingTranslatedMessage\n") ||
                    !text.contains("resendingTranslatedMessage = true;") ||
                    !text.contains("} finally {") ||
                    !text.contains("resendingTranslatedMessage = false;")
        }

        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Outgoing translation resend paths must bypass their own chat event:\n" +
                            violations.collect { relativePath(it) }.sort().join("\n")
            )
        }
    }
}

def releaseDirectory = file("downloads/${project.mod_version}")
def releaseArtifacts = fileTree(releaseDirectory) {
    include "*.jar", "*.jar.part-*"
}

def pythonCmd = System.getProperty("os.name").toLowerCase().contains("windows") ? "python" : "python3"

tasks.register("testJarVerifier", Exec) {
    group = "verification"
    description = "Runs unit tests for the release JAR verifier."
    inputs.files(
            file("scripts/verify_release_jars.py"),
            file("scripts/release_layout.py"),
            file("scripts/test_verify_release_jars.py")
    )
    commandLine pythonCmd, file("scripts/test_verify_release_jars.py")
}

tasks.register("testReleaseAssetPreparer", Exec) {
    group = "verification"
    description = "Tests compatible Forge-family and all-version Fabric JAR preparation."
    inputs.files(
            file("scripts/prepare_release_assets.py"),
            file("scripts/release_layout.py"),
            file("scripts/test_prepare_release_assets.py")
    )
    commandLine pythonCmd, file("scripts/test_prepare_release_assets.py")
}

tasks.register("verifyReleaseJars", Exec) {
    group = "verification"
    description = "Validates every tracked release JAR, Mixin class, mapping, and SHA-256 digest."
    dependsOn("testJarVerifier")
    inputs.file(file("scripts/verify_release_jars.py"))
    inputs.file(file("scripts/release_layout.py"))
    inputs.file(new File(releaseDirectory, "SHA256SUMS.txt"))
    inputs.files(releaseArtifacts)

    doFirst {
        def jars = releaseArtifacts.files
                .findAll { it.name.endsWith(".jar") }
        def splitJars = releaseArtifacts.files
                .findAll { it.name.endsWith(".jar.part-aa") }
                .collect { new File(it.parentFile, it.name.substring(0, it.name.length() - ".part-aa".length())) }
        jars = (jars + splitJars).unique { it.absolutePath }
                .sort { left, right -> left.name <=> right.name }
        commandLine(
                [pythonCmd, file("scripts/verify_release_jars.py"),
                 "--checksum-file", new File(releaseDirectory, "SHA256SUMS.txt"),
                 "--require-complete-checksums"] + jars
        )
    }
}

def preparedReleaseDirectory = layout.buildDirectory.dir("release-assets")

tasks.register("prepareReleaseAssets", Exec) {
    group = "distribution"
    description = "Reduces exact-version artifacts to directly installable compatible JAR families."
    dependsOn("testReleaseAssetPreparer")
    inputs.files(
            file("scripts/prepare_release_assets.py"),
            file("LICENSE"),
            file("docs/en/THIRD_PARTY_OFFLINE.md")
    )
    inputs.files(releaseArtifacts)
    outputs.dir(preparedReleaseDirectory)
    commandLine(
            pythonCmd, file("scripts/prepare_release_assets.py"),
            "--release-dir", releaseDirectory,
            "--output-dir", preparedReleaseDirectory.get().asFile,
            "--version", project.mod_version
    )
}

// NeoForge version modules are coordinate-only. Every coordinate they declare must
// resolve to a real directory, the declared Minecraft version must match the directory
// the module lives in, and the declared Forge source layer must be the one the matching
// Forge tree uses. Without this a typo silently compiles the wrong source family.
tasks.register("validateNeoForgeModuleCoordinates") {
    group = "verification"
    description = "Checks that every NeoForge version module's coordinates resolve."

    doLast {
        def required = [
                "neoforgeMinecraftVersion",
                "neoforgeVersion",
                "neoforgeJavaRelease",
                "neoforgeEntryLayer",
                "neoforgeMetadataLayer",
                "neoforgeForgeSharedRoot",
                "neoforgeForgeLayers"
        ]
        def modules = fileTree("platforms/neoforge") {
            include "1.20/versions/*/build.gradle"
            include "1.21/versions/*/build.gradle"
            include "26.x/versions/*/build.gradle"
        }.files

        if (modules.isEmpty()) {
            throw new GradleException("No NeoForge version modules were found to validate")
        }

        def unquote = { String value -> value.trim().replaceAll('^"', '').replaceAll('"$', '') }
        def quoteList = { String value -> (value =~ /"([^"]+)"/).collect { it[1] } }
        def coordinateValue = { String text, String name ->
            def matcher = text =~ /(?m)^\s*ext\.${name}\s*=\s*(.+)$/
            matcher.find() ? matcher.group(1).trim() : null
        }

        def problems = []
        modules.each { module ->
            def relative = relativePath(module).replace('\\', '/')
            def text = module.getText("UTF-8")
            def directoryVersion = module.parentFile.name

            required.each { name ->
                if (coordinateValue(text, name) == null) {
                    problems.add("${relative}: missing coordinate ${name}".toString())
                }
            }

            def declaredVersion = coordinateValue(text, "neoforgeMinecraftVersion")
            if (declaredVersion != null && unquote(declaredVersion) != directoryVersion) {
                problems.add(
                        "${relative}: neoforgeMinecraftVersion '${unquote(declaredVersion)}' " +
                                "does not match its directory '${directoryVersion}'".toString())
            }

            def entryLayer = coordinateValue(text, "neoforgeEntryLayer")
            if (entryLayer != null &&
                    !file("platforms/neoforge/shared/entrypoints/${unquote(entryLayer)}").isDirectory()) {
                problems.add("${relative}: neoforgeEntryLayer does not resolve".toString())
            }

            def metadataLayer = coordinateValue(text, "neoforgeMetadataLayer")
            if (metadataLayer != null &&
                    !file("platforms/neoforge/shared/metadata/${unquote(metadataLayer)}").isDirectory()) {
                problems.add("${relative}: neoforgeMetadataLayer does not resolve".toString())
            }

            def forgeRoot = coordinateValue(text, "neoforgeForgeSharedRoot")
            if (forgeRoot != null && !file(unquote(forgeRoot)).isDirectory()) {
                problems.add("${relative}: neoforgeForgeSharedRoot does not resolve".toString())
            }

            def forgeLayers = coordinateValue(text, "neoforgeForgeLayers")
            if (forgeLayers != null) {
                def names = quoteList(forgeLayers)
                if (names.isEmpty()) {
                    problems.add("${relative}: neoforgeForgeLayers lists no layers".toString())
                }
                names.each { name ->
                    if (forgeRoot != null && !file("${unquote(forgeRoot)}/${name}").isDirectory()) {
                        problems.add("${relative}: Forge layer '${name}' does not resolve".toString())
                    }
                }
            }

            def extraRoots = coordinateValue(text, "neoforgeForgeExtraRoots")
            if (extraRoots != null) {
                quoteList(extraRoots).each { extra ->
                    if (!file(extra).isDirectory()) {
                        problems.add("${relative}: extra root '${extra}' does not resolve".toString())
                    }
                }
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException(
                    "NeoForge version modules must declare resolvable coordinates:\n" +
                            problems.sort().join("\n"))
        }

        // Cross-check the declared Forge layer against the Forge tree's own version->layer
        // map. Naming the wrong family still resolves to a real directory, so only the
        // Forge map can tell us it is the wrong one. The three trees spell their maps
        // differently:
        //   forge/1.21   versionFamilies = ["<family>": ["<version>", ...]]
        //   forge/26.x   sourceLayers    = ["<version>": "<layer>"]
        //   forge/modern sourceLayers    = ["<version>": ["<layer>", ...]]
        def mapBody = { File source, String mapName ->
            def matcher = source.getText("UTF-8") =~ /(?s)def\s+${mapName}\s*=\s*\[(.*?)\n\]/
            if (!matcher.find()) {
                throw new GradleException("Could not read ${mapName} from ${relativePath(source)}")
            }
            matcher.group(1)
        }

        // Map variable names follow the shape of the map they hold so the three trees stay
        // distinguishable: "<key>By<value>" reads left to right.
        def familyByVersion = [:]
        (mapBody(file("platforms/forge/1.21/shared.gradle"), "versionFamilies") =~
                /"([^"]+)"\s*:\s*\[([^\]]*)\]/).each { match ->
            def family = match[1]
            (match[2] =~ /"([^"]+)"/).each { version -> familyByVersion[version[1]] = family }
        }

        def layerByVersion26 = [:]
        (mapBody(file("platforms/forge/26.x/shared.gradle"), "sourceLayers") =~
                /"([^"]+)"\s*:\s*"([^"]+)"/).each { match ->
            layerByVersion26[match[1]] = match[2]
        }

        def layerByVersionModern = [:]
        (mapBody(file("platforms/forge/modern/shared.gradle"), "sourceLayers") =~
                /"([^"]+)"\s*:\s*\[([^\]]*)\]/).each { match ->
            def layers = (match[2] =~ /"([^"]+)"/).collect { it[1] }
            layerByVersionModern[match[1]] = layers.join("/")
        }

        def versionParts = { String value ->
            value.tokenize('.').collect { (it ==~ /\d+/) ? it.toInteger() : 0 }
        }
        def compareVersions = { String left, String right ->
            def a = versionParts(left)
            def b = versionParts(right)
            for (int index = 0; index < Math.max(a.size(), b.size()); index++) {
                def diff = (index < a.size() ? a[index] : 0) <=> (index < b.size() ? b[index] : 0)
                if (diff != 0) {
                    return diff
                }
            }
            0
        }
        // "1.21.2" has no platform-forge-1.21.2 project, so it is absent from the Forge
        // 1.21 map; fall back to the family whose version range contains it.
        def familyFromRanges = { Collection families, String version ->
            families.find { family ->
                def bounds = family.tokenize('-')
                bounds.size() == 2 &&
                        compareVersions(version, bounds[0]) >= 0 &&
                        compareVersions(version, bounds[1]) <= 0
            }
        }

        def crossCheckProblems = []
        modules.each { module ->
            def relative = relativePath(module).replace('\\', '/')
            def text = module.getText("UTF-8")
            def directoryVersion = module.parentFile.name

            def declaredLayers = quoteList(coordinateValue(text, "neoforgeForgeLayers") ?: "")
            def declaredLayer = declaredLayers.find { it != "common" }
            if (declaredLayer == null) {
                return
            }

            def expected = null
            def source = null
            if (relative.startsWith("platforms/neoforge/1.21/versions/")) {
                expected = familyByVersion[directoryVersion]
                if (expected == null) {
                    expected = familyFromRanges(
                            familyByVersion.values().toList().unique(), directoryVersion)
                }
                source = "platforms/forge/1.21/shared.gradle versionFamilies"
            } else if (relative.startsWith("platforms/neoforge/26.x/versions/")) {
                expected = layerByVersion26[directoryVersion]
                source = "platforms/forge/26.x/shared.gradle sourceLayers"
            } else if (relative.startsWith("platforms/neoforge/1.20/versions/")) {
                // 1.20.2/1.20.4/1.20.6 have no Forge counterpart of their own; they reuse
                // the Forge 1.20.1 sources, exactly as the pre-consolidation modules did.
                expected = layerByVersionModern["1.20.1"]
                source = "platforms/forge/modern/shared.gradle sourceLayers"
            }

            if (source == null) {
                return
            }
            if (expected == null) {
                crossCheckProblems.add(
                        "${relative}: cannot resolve the expected Forge layer for " +
                                "${directoryVersion} from ${source}".toString())
            } else if (expected != declaredLayer) {
                crossCheckProblems.add(
                        "${relative}: declares Forge layer '${declaredLayer}' but ${source} " +
                                "maps ${directoryVersion} to '${expected}'".toString())
            }
        }

        if (!crossCheckProblems.isEmpty()) {
            throw new GradleException(
                    "NeoForge modules must reuse the same Forge source layer as their Forge " +
                            "counterpart:\n" + crossCheckProblems.sort().join("\n"))
        }
    }
}

tasks.register("verifyPreparedReleaseAssets", Exec) {
    group = "verification"
    description = "Validates the reduced directly installable release JAR set."
    dependsOn("prepareReleaseAssets", "verifyReleaseJars")
    inputs.dir(preparedReleaseDirectory)
    doFirst {
        def directory = preparedReleaseDirectory.get().asFile
        def jars = fileTree(directory).matching { include "*.jar" }.files
                .sort { left, right -> left.name <=> right.name }
        commandLine(
                [pythonCmd, file("scripts/verify_release_jars.py"),
                 "--checksum-file", new File(directory, "SHA256SUMS.txt"),
                 "--require-complete-checksums"] + jars
        )
    }
}

tasks.named("check") {
    dependsOn(
            "validateMixinConfigs",
            "validateNeoForgeModuleCoordinates",
            "validateNonOverlappingSettingsLabels",
            "validateOutgoingTranslationReentryGuards",
            "validateOpaqueDiagnosticsTextColors",
            "validateOpaqueSelectionTextColors",
            "validateSharedPlatformLayouts",
            "verifyPreparedReleaseAssets"
    )
}
