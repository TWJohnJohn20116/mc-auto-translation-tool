pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.minecraftforge.net/" }
        gradlePluginPortal()
    }
}

rootProject.name = "mc-auto-translation-tool"
include("translator-core")

def includePlatform = { String name, String directory ->
    include(name)
    project(":${name}").projectDir = file(directory)
}

includePlatform("platform-fabric-1.16.5", "platforms/fabric/legacy/1.16.5")
includePlatform("platform-fabric-1.19.2", "platforms/fabric/legacy/1.19.2")
includePlatform("platform-fabric-1.20.1", "platforms/fabric/legacy/1.20.1")
includePlatform("platform-fabric-1.21", "platforms/fabric/1.21/versions/1.21")
includePlatform("platform-fabric-1.21.1", "platforms/fabric/1.21/versions/1.21.1")
includePlatform("platform-fabric-1.21.2", "platforms/fabric/1.21/versions/1.21.2")
includePlatform("platform-fabric-1.21.3", "platforms/fabric/1.21/versions/1.21.3")
includePlatform("platform-fabric-1.21.4", "platforms/fabric/1.21/versions/1.21.4")
includePlatform("platform-fabric-1.21.5", "platforms/fabric/1.21/versions/1.21.5")
includePlatform("platform-fabric-1.21.6", "platforms/fabric/1.21/versions/1.21.6")
includePlatform("platform-fabric-1.21.7", "platforms/fabric/1.21/versions/1.21.7")
includePlatform("platform-fabric-1.21.8", "platforms/fabric/1.21/versions/1.21.8")
includePlatform("platform-fabric-1.21.9", "platforms/fabric/1.21/versions/1.21.9")
includePlatform("platform-fabric-1.21.10", "platforms/fabric/1.21/versions/1.21.10")
includePlatform("platform-fabric-1.21.11", "platforms/fabric/1.21/versions/1.21.11")
includePlatform("platform-fabric-1.21.4-1.21.5", "platforms/fabric/1.21/shared-1.21.4-1.21.5")
includePlatform("platform-fabric-1.21.x", "platforms/fabric/1.21/bundle")
includePlatform("platform-fabric-26.1", "platforms/fabric/26.x/26.1")
includePlatform("platform-fabric-26.1.1", "platforms/fabric/26.x/26.1.1")
includePlatform("platform-fabric-26.1.2", "platforms/fabric/26.x/26.1.2")
includePlatform("platform-fabric-26.2", "platforms/fabric/26.x/26.2")
includePlatform("platform-fabric-26.x", "platforms/fabric/26.x/bundle")
includePlatform("platform-forge-1.16.5", "platforms/forge/modern/1.16.5")
includePlatform("platform-forge-1.20.1", "platforms/forge/modern/1.20.1")
includePlatform("platform-forge-1.19.2", "platforms/forge/modern/1.19.2")
includePlatform("platform-forge-1.21.11", "platforms/forge/modern/1.21.11")

// Set FORGE_TARGET to configure one Forge 26.x mapping workspace at a time.
def forge26Target = System.getenv("FORGE_TARGET")
["26.1", "26.1.1", "26.1.2", "26.2"].each { gameVersion ->
    if (forge26Target == null || forge26Target == gameVersion) {
        includePlatform("platform-forge-${gameVersion}", "platforms/forge/26.x/versions/${gameVersion}")
    }
}
