                .collect { "platform-fabric-${it}".toString() },
        "platform-fabric-1.19.x": ["1.19", "1.19.1", "1.19.2", "1.19.3", "1.19.4"]
                .collect { "platform-fabric-${it}".toString() },
        "platform-fabric-1.20.x": ["1.20", "1.20.1", "1.20.2", "1.20.3", "1.20.4", "1.20.5", "1.20.6"]
                .collect { "platform-fabric-${it}".toString() },
        "platform-fabric-1.21.x": (['1.21'] + (1..11).collect { "1.21.${it}" })
                .collect { "platform-fabric-${it}".toString() },
        "platform-fabric-26.x": ["26.1", "26.1.1", "26.1.2", "26.2"]
                .collect { "platform-fabric-${it}".toString() },
        "platform-neoforge-1.20.1": ["platform-forge-1.20.1"]
