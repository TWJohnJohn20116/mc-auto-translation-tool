def normalizePlatform = { String value ->
    def target = value.trim()
    if (target == "all" || target == "core" || target == "translator-core") {
        return target
    }
    target.startsWith("platform-") ? target.toString() : "platform-${target}".toString()
}

def requested = [] as LinkedHashSet<String>
def targetProperty = gradle.startParameter.projectProperties["targetPlatform"]
if (targetProperty) {
    targetProperty.toString().split(",").findAll { !it.trim().isEmpty() }.each {
        requested.add(normalizePlatform(it))
    }
} else {
    // A fully-qualified task path selects its platform automatically.
    gradle.startParameter.taskNames.each { taskName ->
        def matcher = taskName =~ /^:?(platform-[^:]+)(?::.*)?$/
        if (matcher.matches()) {
            requested.add(matcher.group(1))
        }
    }

    // Retain compatibility with the previous Forge-only selector.
    def legacyForgeTarget = System.getenv("FORGE_TARGET")
    if (requested.isEmpty() && legacyForgeTarget) {
        requested.add("platform-forge-${legacyForgeTarget}".toString())
    }
}

def selected = new LinkedHashSet<String>()
if (requested.contains("all")) {
    selected.addAll(platformProjects.keySet())
} else {
    requested.findAll { it != "core" && it != "translator-core" }.each { selected.add(it) }
}

def queue = new ArrayDeque<String>(selected)
while (!queue.isEmpty()) {
    def platform = queue.removeFirst()
    if (!platformProjects.containsKey(platform)) {
        throw new GradleException(
                "Unknown targetPlatform '${platform}' (requested '${targetProperty}'). Available values: " +
                        platformProjects.keySet().collect { it - "platform-" }.join(", ") + ", all")
    }
    platformDependencies.getOrDefault(platform, []).each { dependency ->
        if (selected.add(dependency)) {
            queue.addLast(dependency)
        }
    }
}

selected.each { name ->
    include(name)
    project(":${name}").projectDir = file(platformProjects[name])
}
