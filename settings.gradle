// 這兩份清單是唯一權威來源，供各 bundle 專案讀取（gradle.ext 對所有專案腳本可見）。
// 之前「fabric-all 應該包含哪些版本」被手抄到 4 個 bundle 的 verifyPreparedReleaseBundle，
// 已經漂移成 3 份漏 26.3、1 份漏 1.16–1.16.4；加一個版本不必再改 5 處。
gradle.ext.platformDependencies = platformDependencies

// platformProjects 與「會被收集成發布資產」的專案集合之間允許有差集，但那個差集必須是明列的，不能
// 靠沉默長出來：先前 1.21.4-1.21.5 這種「每個 PR 都建置、卻不在任何 bundle／downloads 裡」的模組
// 就是這樣存在了整輪審計。只有 Fabric 樹有 bundle，其他載入器的專案是一對一的發布目標，所以這條
// 檢查只看 platform-fabric-*：每個 Fabric 專案都必須是某個 bundle 的成員，否則就必須出現在例外清單。
def fabricPublishableProjects = new LinkedHashSet<String>(platformDependencies.keySet())
platformDependencies.values().each { fabricPublishableProjects.addAll(it as Collection) }
// 例外清單目前是空的。唯一用過它的 `platform-fabric-1.21.4-1.21.5` 已於第四輪審計 B07-004 刪除：
// 它與 `platform-fabric-1.21.5` 同設定、只多一個 `archivesName`，產出的 JAR 不被任何 bundle 或
// `downloads/` 收集，卻每個 PR 都吃掉一個完整 Loom 專案；1.21.4／1.21.5 本來就由
// `platform-fabric-1.21.x` 覆蓋。留一個空清單是刻意的：新增例外要改這裡，而新增「建置但不發布」
// 的模組會由下面的 undeclaredProjects 檢查立刻擋下。
def fabricSelectionExemptProjects = [] as Set
gradle.ext.fabricSelectionExemptProjects = fabricSelectionExemptProjects
def undeclaredProjects = platformProjects.keySet().findAll {
    it.startsWith("platform-fabric-") &&
            !fabricPublishableProjects.contains(it) &&
            !fabricSelectionExemptProjects.contains(it)
}.sort()
if (!undeclaredProjects.isEmpty()) {
    throw new GradleException(
            "These Fabric projects are neither bundle members nor listed in " +
                    "fabricSelectionExemptProjects in settings.gradle: ${undeclaredProjects.join(', ')}. " +
                    "A project that no bundle, release list or downloads/ entry collects is built on " +
                    "every PR and published nowhere; add it to platformDependencies or to the exempt list.")
}

// 這 9 個 Forge 版本是發布資產，卻沒有任何定期 workflow 編譯它們：build.yml 的 platform-build 只建
// 6 個 Forge 目標、legacy-build 建 4 個舊版，legacy-targets.yml 一個 Forge 都沒有，所以只有手動的
// prepare-release.yml 會碰它們。清單放這裡是為了讓 build.gradle 的 check 把「這次不會被驗證」印出來，
// 而不是等到發布前 10 分鐘才在設定階段 throw（forge/1.21 與 forge/26.x 的 versionFamilies／
// sourceLayers 漏接一個版本就是這樣炸的）。要讓某個版本回到定期路徑，改的是 workflow 的 matrix，
// 不是這份清單；這裡只宣告現況，並擋下打字錯誤。
def releaseOnlyForgeTargets = [
        "platform-forge-1.21", "platform-forge-1.21.3", "platform-forge-1.21.4",
        "platform-forge-1.21.5", "platform-forge-1.21.6", "platform-forge-1.21.8",
        "platform-forge-1.21.10", "platform-forge-26.1", "platform-forge-26.1.2"
].collect { it.toString() }
def unknownReleaseOnlyTargets = releaseOnlyForgeTargets.findAll {
    !platformProjects.containsKey(it)
}.sort()
if (!unknownReleaseOnlyTargets.isEmpty()) {
    throw new GradleException(
            "releaseOnlyForgeTargets names projects that platformProjects does not declare: " +
                    "${unknownReleaseOnlyTargets.join(', ')}. A renamed or deleted project has to be " +
                    "removed from that list as well, or the note it drives names nothing.")
}
gradle.ext.releaseOnlyForgeTargets = releaseOnlyForgeTargets

// MCAutoTranslationTool-<mod_version>-fabric-all.jar 內嵌的版本：也就是會出現在 downloads/
// 的 Fabric bundle 成員。1.0-1.8.x 與 1.8-1.12.x 刻意不在其中——它們只由 legacy-targets.yml
// 建置，從來不是發布資產，也不會進到那個合併 jar。清單由上面的 platformDependencies 推導，
// 不另外手寫。
def fabricReleaseBundles = [
        "platform-fabric-1.13.x",
        "platform-fabric-1.14-1.15.x",
        "platform-fabric-1.16.x",
        "platform-fabric-1.17-1.18.x",
        "platform-fabric-1.19.x",
        "platform-fabric-1.20.x",
        "platform-fabric-1.21.x",
        "platform-fabric-26.x"
]
// 專案名 → Minecraft 版本的唯一正規化規則。啟動器把 1.13.0 叫成 "1.13"，所以那個 bundle 的
// nested JAR 是 universal-translator-1.13.jar；專案名不能直接拿來當版本字串。這條規則原本只存在
// 於 fabricReleaseVersions 的 collect 裡，現在抽成 helper 讓 bundle 驗證器共用，避免出現第三份。
def fabricMinecraftVersionOf = { Object platformProjectName ->
    def projectVersion = platformProjectName.toString() - "platform-fabric-"
    projectVersion == "1.13.0" ? "1.13" : projectVersion
}
gradle.ext.fabricMinecraftVersionOf = fabricMinecraftVersionOf

gradle.ext.fabricReleaseVersions = fabricReleaseBundles
        .collectMany { platformDependencies.getOrDefault(it, []) }
        .collect { fabricMinecraftVersionOf(it) }
        .unique()

// 某個 bundle **自己的**版本清單（CI 修-2）：驗證器只能餵「這個 bundle 的 Fabric Loader 世代」
// 解析得出的版本。舊的內嵌 jar（1.13–1.24 依賴舊 fabric API／舊 minecraft）在 26.x 的 resolver
// 裡是 HARD_DEP_NO_CANDIDATE，跨世代餵全域清單不成立，所以 args 一律走這裡；全域清單只留給
// 共用驗證腳本的缺席警告（logger.warn），兩者不可互換。
gradle.ext.fabricBundleVersions = { Object platformProjectName ->
    platformDependencies.getOrDefault(platformProjectName.toString(), [])
            .collect { fabricMinecraftVersionOf(it) }
            .unique()
}

// The one authoritative answer to "which Java release does each tree compile for". build.gradle turns
// this into the Mixin compatibilityLevel bounds, and the two trees that used to hard-code
// options.release (fabric/1.21 and fabric/26.x) read it as well, so changing a release can no longer
// leave the bounds behind — the previous state had seven copies of that fact with no cross-check.
// The pair is [lowest, highest]: fabric/1.20 spans 17 (1.20-1.20.4) and 21 (1.20.5/1.20.6), and Forge
// modern spans 8 (1.16.5) and 17 (1.18.2-1.20.1).
def treeJavaRelease = [
        "platforms/fabric/1.0-1.8/"                     : [8, 8],
        "platforms/fabric/1.8-1.12/"                    : [8, 8],
        "platforms/fabric/1.13/"                        : [8, 8],
        "platforms/fabric/1.14-1.15/"                   : [8, 8],
        "platforms/fabric/1.16/"                        : [8, 8],
        "platforms/fabric/1.17-1.18/"                   : [17, 17],
        "platforms/fabric/1.19/"                        : [17, 17],
        "platforms/fabric/1.20/"                        : [17, 21],
        "platforms/fabric/1.21/"                        : [21, 21],
        "platforms/fabric/26.x/"                        : [25, 25],
        "platforms/forge/modern/1.16.5/"                : [8, 8],
        "platforms/forge/modern/1.18.2/"                : [17, 17],
        "platforms/forge/modern/1.19.2/"                : [17, 17],
        "platforms/forge/modern/1.20.1/"                : [17, 17],
        "platforms/forge/1.21/"                         : [21, 21],
        "platforms/forge/26.x/"                         : [25, 25],
        "platforms/neoforge/1.20.1/"                    : [17, 17],
        "platforms/neoforge/shared/metadata/1.20-1.20.4/": [17, 17],
        "platforms/neoforge/shared/metadata/1.20.6/"    : [21, 21],
        "platforms/neoforge/shared/metadata/1.21/"      : [21, 21],
        "platforms/neoforge/shared/metadata/26.x/"      : [25, 25]
]
gradle.ext.treeJavaRelease = treeJavaRelease

// options.release for a tree that has a single release, so a shared.gradle reads the table instead of
// repeating the number. A missing entry fails at configuration time rather than compiling for a
// silently wrong target.
gradle.ext.treeJavaTarget = { String prefix ->
    def releases = treeJavaRelease.get(prefix)
    if (releases == null) {
        throw new GradleException(
                "No Java release is registered for '${prefix}' in settings.gradle's treeJavaRelease")
    }
    // A tree that spans two releases (fabric/1.20 is [17, 21], forge/modern [8, 17]) cannot answer
    // "which release does this tree compile for", and returning the highest one would silently move
    // the lower half of that tree up a bytecode version while levelBounds keeps declaring both — the
    // same "change A, B stays behind" gap the table exists to close. Fail instead of guessing.
    if (releases[0] != releases[1]) {
        throw new GradleException(
                "treeJavaTarget('${prefix}') is only for trees compiled for a single release, but " +
                        "that tree spans ${releases}; give it its own ext and read it where the two " +
                        "halves are told apart")
    }
    return releases[1]
}

// The toolchain every platform project compiles with, in one place: build.gradle hands this to
// java.toolchain, and gradle/fabric-bundle-aggregate-verify.gradle hands it to the verifier launcher.
// Those two used to carry the same "26.x => 25, everything else => 21" rule separately, and the
// launcher copy is only reached by the release job, so a rule that moved in one of them surfaced as
// UnsupportedClassVersionError after all 48 targets had built.
gradle.ext.toolchainJavaFor = { Object platformProjectName ->
    def name = platformProjectName.toString()
    name.startsWith("platform-fabric-26.")
            || name.startsWith("platform-forge-26.")
            || name.startsWith("platform-neoforge-26.") ? 25 : 21
}

// Fabric API's mod id. The bundle metadata that is hand-written per bundle used to spell it three
// different ways ("fabric" in three bundles, nothing in 1.19, "fabric-api" in six), which the Loader
// resolves through a `provides` alias and nothing compared; gradle/bundle-metadata-verify.gradle now
// rejects a second spelling and the bundle processResources expand this one as ${fabricDependency}.
gradle.ext.fabricApiModId = "fabric-api"

def normalizePlatform = { String value ->
    def target = value.trim()
    if (target == "all" || target == "core" || target == "translator-core") {
        return target
    }
    target.startsWith("platform-") ? target.toString() : "platform-${target}".toString()
}

def requested = [] as LinkedHashSet<String>
def targetProperty = gradle.startParameter.projectProperties["targetPlatform"]
if (targetProperty) {
    targetProperty.toString().split(",").findAll { !it.trim().isEmpty() }.each {
        requested.add(normalizePlatform(it))
    }
} else {
    // A fully-qualified task path selects its platform automatically.
    gradle.startParameter.taskNames.each { taskName ->
        def matcher = taskName =~ /^:?(platform-[^:]+)(?::.*)?$/
        if (matcher.matches()) {
            requested.add(matcher.group(1))
        }
    }

    // Retain compatibility with the previous Forge-only selector.
    def legacyForgeTarget = System.getenv("FORGE_TARGET")
    if (requested.isEmpty() && legacyForgeTarget) {
        requested.add("platform-forge-${legacyForgeTarget}".toString())
    }
}

def selected = new LinkedHashSet<String>()
if (requested.contains("all")) {
    selected.addAll(platformProjects.keySet())
} else {
    requested.findAll { it != "core" && it != "translator-core" }.each { selected.add(it) }
}

def queue = new ArrayDeque<String>(selected)
while (!queue.isEmpty()) {
    def platform = queue.removeFirst()
    if (!platformProjects.containsKey(platform)) {
        throw new GradleException(
                "Unknown targetPlatform '${platform}' (requested '${targetProperty}'). Available values: " +
                        platformProjects.keySet().collect { it - "platform-" }.join(", ") + ", all")
    }
    platformDependencies.getOrDefault(platform, []).each { dependency ->
        if (selected.add(dependency)) {
            queue.addLast(dependency)
        }
    }
}

selected.each { name ->
    include(name)
    project(":${name}").projectDir = file(platformProjects[name])
}
